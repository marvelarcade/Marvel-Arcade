<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S.H.I.E.L.D. Marvel Arcade</title>
  <style>
    :root{
      --bg:#05070a;--panel:#0d1319;--panel2:#111b24;--line:#263742;
      --text:#edf5f7;--muted:#91a4ad;--accent:#6fd8ff;--ok:#95e8bf;--bad:#ff9d9d
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% 0,#10202a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{color:inherit}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#05070ae8;backdrop-filter:blur(12px)}
    .brand{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left}
    .mark{display:grid;place-items:center;width:38px;height:42px;border:1px solid var(--accent);border-radius:10px 10px 18px 18px;color:var(--accent);font-weight:900}
    .brand strong{display:block;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-top:2px}
    .stats{display:flex;gap:8px;align-items:center}
    .pill{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#0b1116}.pill span{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.12em}.pill strong{font-size:.9rem}
    main{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:38px 0 48px}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:end}
    .eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.18em;margin:0 0 8px}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.035em}
    h2{line-height:1.2}.lede{color:var(--muted);line-height:1.65;max-width:700px}
    .card,.mission,.case,.db{border:1px solid var(--line);background:linear-gradient(145deg,#101820,#080d11);border-radius:18px}
    .card{padding:18px}.progress{height:7px;background:#1d2830;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--accent)}
    .gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}
    .game{min-height:230px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#0b1116;cursor:pointer;text-align:left;position:relative}
    .game:hover{border-color:#47697a;background:#0f171e}.game strong{display:block;margin-top:36px;font-size:1.28rem}.game p{color:var(--muted);line-height:1.55}.num{color:#607985;font-size:.7rem;letter-spacing:.14em}.meta{position:absolute;left:20px;right:20px;bottom:18px;border-top:1px solid var(--line);padding-top:12px;color:#b5c5cc;font-size:.8rem}
    .mission{max-width:820px;margin:0 auto;padding:24px}.missionhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
    .back,.btn,.choice{min-height:44px;border-radius:10px;cursor:pointer}
    .back{border:0;background:none;color:var(--muted);padding:8px}
    .btn{padding:10px 15px;border:1px solid var(--line);background:#101820;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#051018}.btn:disabled{opacity:.45;cursor:not-allowed}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:14px;border:1px solid var(--line);background:#091015;text-align:left}.choice:hover{border-color:#4c7182}
    .feedback{min-height:24px;color:#b1c1c8;margin-top:16px}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.form input,.search input{min-height:46px;border-radius:10px;border:1px solid var(--line);background:#05090c;color:var(--text);padding:10px 12px;font-size:16px;width:100%}
    .clues{display:grid;gap:8px;margin:16px 0}.clue{border:1px solid var(--line);border-radius:12px;padding:13px}.clue span{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-bottom:6px}.hidden{opacity:.35}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.reward{display:inline-block;padding:8px 12px;border:1px solid #355364;border-radius:10px;color:var(--accent);font-weight:800;margin:8px 0}
    .casegrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:14px}.case,.db{padding:20px}.case p{color:var(--muted);line-height:1.55}.evidence{display:grid;gap:8px;margin-top:18px}.evidence div{border-left:2px solid var(--accent);background:#6fd8ff0a;padding:10px}.evidence span{font-size:.62rem;color:var(--muted);letter-spacing:.12em}
    .search{display:grid;grid-template-columns:1fr auto;gap:8px}.results{display:grid;gap:8px;max-height:560px;overflow:auto;margin-top:12px}.person{border:1px solid var(--line);border-radius:12px;background:#091015;padding:13px;text-align:left;cursor:pointer}.person.sel{border-color:var(--accent);background:#6fd8ff10}.person strong{display:block}.person small{color:var(--accent)}.person p{font-size:.78rem;color:#c5d1d6;margin:7px 0 0;line-height:1.4}

    .topright{display:flex;align-items:center;gap:8px}
    .quote-box{padding:22px;border:1px solid var(--line);border-radius:14px;background:#071016;margin:18px 0}
    .quote-box blockquote{margin:0;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.45;font-weight:700}
    .quote-box small{display:block;color:var(--muted);margin-top:12px;letter-spacing:.12em}
    .artifact-clue-stack{display:grid;gap:8px;margin:18px 0}

    .inventory-btn{position:relative}
    .inventory-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--accent);color:#051018;font-size:.68rem;font-weight:900}
    .inventory-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    .inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
    .inventory-item{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .inventory-item-top{display:flex;gap:12px;align-items:flex-start}
    .artifact-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#060c10;color:var(--accent)}
    .artifact-icon svg{width:34px;height:34px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .artifact-icon svg .fill{fill:currentColor;stroke:none;opacity:.9}
    .artifact-icon svg .soft{opacity:.45}
    .inventory-item-copy{min-width:0;flex:1}
    .inventory-item strong{display:block;font-size:1rem}.inventory-item span{display:block;color:var(--accent);font-size:.72rem;margin-top:4px}
    .inventory-item p{color:var(--muted);font-size:.8rem;line-height:1.45;margin:8px 0 0}
    .rarity{display:inline-block;margin-top:8px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:.64rem;font-weight:900;letter-spacing:.09em}
    .rarity-common{opacity:.78}
    .rarity-uncommon{border-color:#4d7a64}
    .rarity-rare{border-color:#496a8d}
    .rarity-epic{border-color:#75548d}
    .rarity-legendary{border-color:#8d7348}
    .rarity-mythic{border-color:#8b4b5f}
    .new-reward{padding:12px 14px;border-left:2px solid var(--ok);background:rgba(149,232,191,.06);color:#ccebdd;margin:18px 0}
    .grid-status{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .grid-chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#0a1116;font-size:.78rem}
    .marvel-grid-wrap{overflow-x:auto;padding-bottom:4px}
    .marvel-grid{display:grid;grid-template-columns:120px repeat(3,minmax(120px,1fr));gap:6px;min-width:520px}
    .grid-corner,.grid-head,.grid-rowhead,.grid-cell{min-height:92px;border:1px solid var(--line);border-radius:12px;background:#091015;padding:10px}
    .grid-corner{display:grid;place-items:center;color:var(--muted);font-size:.68rem;letter-spacing:.12em}
    .grid-head,.grid-rowhead{display:grid;place-items:center;text-align:center;color:#c9d6db;font-size:.78rem;font-weight:800}
    .grid-cell{cursor:pointer;display:grid;place-items:center;text-align:center;position:relative}
    .grid-cell:hover{border-color:#4c7182}.grid-cell.selected{border-color:var(--accent);background:#6fd8ff0d}
    .grid-cell.filled{border-color:#497565;background:rgba(149,232,191,.06);cursor:default}
    .grid-cell.revealed{opacity:.65;cursor:default}
    .grid-cell .cell-plus{font-size:1.6rem;color:#5b7480}
    .grid-cell .cell-name{font-size:.82rem;font-weight:800}
    .grid-cell .cell-example{font-size:.68rem;color:var(--muted);margin-top:4px}
    .grid-entry{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#081015}
    .grid-entry h3{margin:0 0 6px}.grid-entry p{color:var(--muted);font-size:.82rem;line-height:1.45}
    .suggestions{display:grid;gap:6px;margin-top:8px;max-height:290px;overflow:auto}
    .suggestion{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0b1218;cursor:pointer;text-align:left}
    .suggestion:hover{border-color:#4c7182}.suggestion small{display:block;color:var(--muted);margin-top:3px}
    .grid-results{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0a1116}
    .inventory-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.inventory-tabs .btn.active{border-color:var(--accent);background:#6fd8ff10}
    .inventory-controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
    .inventory-controls select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081015;color:var(--text);padding:8px 12px;font-size:16px}
    .power-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
    .power-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .power-card strong{display:block}.power-card .power-meta{color:var(--accent);font-size:.72rem;margin-top:5px}.power-card p{color:var(--muted);font-size:.8rem;line-height:1.45}
    .active-power{border-color:#486f62;background:rgba(149,232,191,.05)}
    .rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
    .rules-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091015}.rules-card h3{margin:0 0 8px}.rules-card p,.rules-card li{color:var(--muted);font-size:.82rem;line-height:1.5}.rules-card ul{padding-left:18px;margin:8px 0}
    .heist-vault{display:grid;place-items:center;min-height:220px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 35%,#17242d,#070b0e 65%);text-align:center;padding:20px}
    .heist-vault .artifact-icon{width:72px;height:72px;flex-basis:72px}.heist-vault .artifact-icon svg{width:52px;height:52px}
    .heist-odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.heist-odds div{padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:.75rem}
    .degree-path{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.degree-node{padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:#0a1116;font-size:.8rem}.degree-arrow{color:var(--muted)}
    .buff-strip{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.buff-chip{padding:7px 9px;border:1px solid #486f62;border-radius:999px;background:rgba(149,232,191,.05);font-size:.7rem;color:#cde8db}
    .toast-host{position:fixed;right:14px;bottom:14px;z-index:50;display:grid;gap:8px;max-width:min(360px,calc(100% - 28px))}
    .toast{padding:13px 15px;border:1px solid #466779;border-radius:12px;background:#0b151cf2;box-shadow:0 12px 30px #0008;font-size:.82rem;line-height:1.4}
    .toast strong{color:var(--accent)}
    .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
    .admin-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .admin-card h3{margin:0 0 8px}.admin-card p{color:var(--muted);font-size:.8rem;line-height:1.45}
    .admin-card input,.admin-card select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#071015;color:var(--text);padding:9px 11px;font-size:16px;margin:6px 0}
    .admin-inline{display:flex;gap:8px;flex-wrap:wrap}.admin-inline>*{flex:1 1 120px}
    .admin-danger{border-color:#7d4545;background:rgba(125,69,69,.07)}
    .admin-status{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#071015;color:var(--muted);font-size:.78rem;margin-top:8px}
    .admin-hidden{display:none!important}
    .admin-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
    .admin-toggle:first-of-type{border-top:0}
    .admin-toggle input{width:22px;height:22px;min-height:auto;margin:0;flex:0 0 auto}
    .admin-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .admin-kpi div{padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center}
    .admin-kpi strong{display:block;font-size:1.05rem}
    .support-user{padding:12px;border:1px solid var(--line);border-radius:12px;background:#071015;margin-top:8px}
    .support-user code{font-size:.72rem;word-break:break-all;color:var(--accent)}
    .support-user.selected{border-color:var(--accent)}
    .support-list{max-height:340px;overflow:auto;padding-right:4px}
    .chaos-button{min-height:58px;font-size:1rem;letter-spacing:.05em}


    .loginstatus{color:var(--muted);font-size:.7rem}
    .syncok{color:var(--ok)}.syncbad{color:var(--bad)}
    .difficultygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
    .difficulty{min-height:44px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#091015;cursor:pointer;text-align:left}
    .difficulty:hover{border-color:#4c7182}.difficulty.selected{border-color:var(--accent);background:#6fd8ff10}
    .difficulty strong{display:block;font-size:1.05rem}.difficulty span{display:block;color:var(--accent);font-size:.72rem;margin-top:3px}
    .difficulty p{color:var(--muted);font-size:.84rem;line-height:1.45;margin:8px 0 0}
    .notice{padding:12px 14px;border-left:2px solid var(--accent);background:#6fd8ff0a;color:#bcd0d8;line-height:1.5}

    footer{padding:18px;color:#6f858e;text-align:center;border-top:1px solid #11202a;font-size:.7rem}
    @media(max-width:820px){.hero,.casegrid,.gamegrid{grid-template-columns:1fr}.pill{display:none}}
    @media(max-width:560px){.choices,.form,.search,.difficultygrid{grid-template-columns:1fr}.brand small{display:none}.top{align-items:flex-start}.topright{flex-direction:column;align-items:flex-end}}
  </style>
</head>
<body>
  <header class="top">
    <button class="brand" id="homeBtn">
      <span class="mark">S</span>
      <span><strong>S.H.I.E.L.D.</strong><small>TRAINING NETWORK</small></span>
    </button>
    <div class="topright">
      <div class="stats">
        <div class="pill"><span>LEVEL</span><strong id="lvl">1</strong></div>
        <div class="pill"><span>XP</span><strong id="xp">0</strong></div>
      </div>
      <button class="btn" id="rulesBtn" type="button">Rules</button>
      <button class="btn admin-hidden" id="accountBtn" type="button">Account</button>
      <button class="btn admin-hidden" id="adminBtn" type="button">Admin</button>
      <button class="btn inventory-btn" id="inventoryBtn" type="button">Inventory<span class="inventory-badge" id="inventoryBadge" hidden>0</span></button>
      <button class="btn" id="loginBtn" type="button">Sign in with Google</button>
      <div class="loginstatus" id="loginStatus">Local save</div>
    </div>
  </header>

  <main id="screen"></main>
  <footer>Unofficial fan-made Marvel project · no affiliation with Marvel or Disney</footer>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCHje4H7RJs6Jixn0UQ8Fgef7-c39fiPks",
  authDomain: "marvel-arcade.firebaseapp.com",
  projectId: "marvel-arcade",
  storageBucket: "marvel-arcade.firebasestorage.app",
  messagingSenderId: "493712703852",
  appId: "1:493712703852:web:91a458b37440c4fa46f349"
};

const ADMIN_UID='X3O34lqlrUeqgf0rVOB5lZwESw03';

function isAdmin(){
  return !!currentUser && currentUser.uid===ADMIN_UID;
}

function updateAdminUI(){
  const button=document.getElementById("adminBtn");
  if(!button)return;
  button.classList.toggle("admin-hidden",!isAdmin());
}


const firebaseEnabled = !Object.values(firebaseConfig).some(v => String(v).startsWith("PASTE_"));
let auth=null, db=null, currentUser=null;
let GoogleAuthProviderClass=null, signInWithPopupFn=null, signInWithRedirectFn=null, signOutFn=null;
let docFn=null, getDocFn=null, setDocFn=null, serverTimestampFn=null, collectionFn=null, queryFn=null, whereFn=null, getDocsFn=null;

function setLoginStatus(message,bad=false){
  const el=document.getElementById("loginStatus");
  if(!el)return;
  el.textContent=message;
  el.className="loginstatus "+(bad?"syncbad":message.includes("Cloud")?"syncok":"");
}

async function initFirebase(){
  if(!firebaseEnabled)return;
  try{
    const appMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const authMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
    const fsMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

    const app=appMod.initializeApp(firebaseConfig);
    auth=authMod.getAuth(app);
    db=fsMod.getFirestore(app);
    GoogleAuthProviderClass=authMod.GoogleAuthProvider;
    signInWithPopupFn=authMod.signInWithPopup;
    signInWithRedirectFn=authMod.signInWithRedirect;
    signOutFn=authMod.signOut;
    docFn=fsMod.doc;
    getDocFn=fsMod.getDoc;
    setDocFn=fsMod.setDoc;
    serverTimestampFn=fsMod.serverTimestamp;
    collectionFn=fsMod.collection;
    queryFn=fsMod.query;
    whereFn=fsMod.where;
    getDocsFn=fsMod.getDocs;

    await authMod.setPersistence(auth,authMod.browserLocalPersistence);

    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      updateLoginUI();
      if(activeScreen==="admin"&&!isAdmin())home();

      if(!user){
        setLoginStatus("Local save");
        if(activeScreen==="home")home();
        return;
      }

      setLoginStatus("Syncing…");
      try{
        const snap=await getDocFn(docFn(db,"users",user.uid));
        if(snap.exists()&&snap.data().progress){
          prog=mergeProgress(prog,snap.data().progress);
        }
        await save();
        if(activeScreen==="home")home();
      }catch(error){
        console.error(error);
        setLoginStatus("Cloud sync failed",true);
      }
    });
  }catch(error){
    console.error(error);
    setLoginStatus("Firebase failed to load",true);
  }
}
const firebaseReady=initFirebase();

const characters=[
{name:"Steve Rogers",aliases:["Captain America","Cap"],species:"Human",aff:["Avengers","S.H.I.E.L.D."],powers:["Super-soldier physiology","Enhanced strength","Enhanced endurance"],gear:["Vibranium shield"],assoc:["Bucky Barnes","Sam Wilson","Natasha Romanoff"],loc:["Brooklyn","Washington, D.C.","Avengers Compound"],year:2011,quote:"I can do this all day."},
{name:"Tony Stark",aliases:["Iron Man"],species:"Human",aff:["Avengers","Stark Industries"],powers:["Engineering genius","Powered armour"],gear:["Iron Man armour","Arc reactor technology"],assoc:["Pepper Potts","James Rhodes","Peter Parker"],loc:["Malibu","New York","Avengers Compound"],year:2008,quote:"We have a Hulk."},
{name:"Natasha Romanoff",aliases:["Black Widow"],species:"Human",aff:["Avengers","S.H.I.E.L.D.","Red Room"],powers:["Elite espionage","Martial arts","Marksmanship"],gear:["Widow's Bite"],assoc:["Clint Barton","Steve Rogers","Yelena Belova"],loc:["Budapest","New York"],year:2010,quote:"I've got red in my ledger."},
{name:"Thor",aliases:["God of Thunder"],species:"Asgardian",aff:["Avengers","Asgard"],powers:["Lightning","Superhuman strength","Longevity"],gear:["Mjolnir","Stormbreaker"],assoc:["Loki","Valkyrie","Bruce Banner"],loc:["Asgard","New Asgard","Earth"],year:2011,quote:"I need a horse!"},
{name:"Bruce Banner",aliases:["Hulk","Smart Hulk"],species:"Human",aff:["Avengers"],powers:["Gamma transformation","Extreme strength","Scientific genius"],gear:[],assoc:["Tony Stark","Thor","Natasha Romanoff"],loc:["Harlem","Sakaar","Avengers Compound"],year:2008,quote:"That's my secret, Captain."},

function artifactIcon(name){
  let kind=artifactIconKind[name];
  if(!kind){
    const n=String(name||"").toLowerCase();
    if(/shield/.test(n))kind="shield";
    else if(/gauntlet|glove/.test(n))kind="gauntlet";
    else if(/hammer|mjolnir|gungnir|scepter|sceptre|staff|cane|spear/.test(n))kind="scepter";
    else if(/axe|stormbreaker/.test(n))kind="axe";
    else if(/sword|blade|necrosword|dragonfang/.test(n))kind="sword";
    else if(/bow|arrow|dart/.test(n))kind="arrow";
    else if(/stone|bloodstone|orb|sphere/.test(n))kind="orb";
    else if(/book|handbook|darkhold/.test(n))kind="book";
    else if(/ring|bangle/.test(n))kind="rings";
    else if(/suit|armour|armor|hulkbuster|iron man|war machine|iron patriot|rescue/.test(n))kind="armour";
    else if(/wing/.test(n))kind="drone";
    else if(/rifle|pistol|blaster|missile|weapon/.test(n))kind="blaster";
    else if(/glasses|visor/.test(n))kind="glasses";
    else if(/reactor|tunnel|loom|extractor|fabricator|laboratory|lab|collar|twister|charge|drive|pager|inhibitor/.test(n))kind="device";
    else if(/ship|fighter|flyer|helicarrier|milano|benatar|bowie|domo|van/.test(n))kind="drone";
    else if(/serum|dust|vial|particles|battery|batteries|disc/.test(n))kind="particles";
    else if(/cloak/.test(n))kind="cloak";
    else if(/necklace|beads/.test(n))kind="beads";
    else if(/web shooter|baton|tentacle/.test(n))kind="wrist";
    else if(/glider/.test(n))kind="drone";
    else if(/pumpkin bomb/.test(n))kind="orb";
    else kind="default";
  }
  return iconSvg(kind);
}

function rarityForArtifact(name){
  return artifactRarity[name]||"Common";
}

function rarityWeightsForLevel(level){
  if(level<10){
    return {Common:82,Uncommon:18,Rare:0,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<25){
    return {Common:62,Uncommon:30,Rare:8,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<50){
    return {Common:45,Uncommon:34,Rare:16,Epic:5,Legendary:0,Mythic:0};
  }
  if(level<100){
    return {Common:34,Uncommon:31,Rare:22,Epic:10,Legendary:3,Mythic:0};
  }
  if(level<250){
    return {Common:24,Uncommon:28,Rare:26,Epic:16,Legendary:5,Mythic:1};
  }
  if(level<500){
    return {Common:18,Uncommon:24,Rare:28,Epic:20,Legendary:8,Mythic:2};
  }
  return {Common:14,Uncommon:20,Rare:28,Epic:23,Legendary:11,Mythic:4};
}

function chooseRarityForLevel(level,salt=0){
  const weights=rarityWeightsForLevel(level);
  const roll=seededUnit(prog.rewardSeed,level,salt)*100;
  let running=0;

  for(const rarity of rarityOrder){
    running+=weights[rarity]||0;
    if(roll<running)return rarity;
  }

  return "Common";
}

function totalXpForLevel(level){
  if(level<=1)return 0;
  return Math.round(100*Math.pow(level-1,2.15));
}

function lvl(xp){
  xp=Math.max(0,Number(xp)||0);

  // Estimate the level, then correct for rounding.
  let level=Math.max(1,Math.floor(Math.pow(xp/100,1/2.15))+1);

  while(totalXpForLevel(level+1)<=xp)level++;
  while(level>1&&totalXpForLevel(level)>xp)level--;

  return level;
}

function levelProgress(xp){
  const level=lvl(xp);
  const start=totalXpForLevel(level);
  const next=totalXpForLevel(level+1);
  const gained=Math.max(0,xp-start);
  const needed=Math.max(1,next-start);

  return {
    level,
    gained,
    needed,
    next,
    percent:Math.max(0,Math.min(100,(gained/needed)*100))
  };
}

function powerupKey(id,durationMin){
  return `${id}|${durationMin||0}`;
}

function mergePowerupInventory(localItems=[],cloudItems=[]){
  const merged=new Map();
  for(const item of [...cloudItems,...localItems]){
    if(!item||!item.id)continue;
    const key=powerupKey(item.id,item.durationMin);
    const existing=merged.get(key);
    if(!existing){
      merged.set(key,{id:item.id,durationMin:item.durationMin||0,qty:Math.max(1,item.qty||1)});
    }else{
      existing.qty=Math.max(existing.qty||1,item.qty||1);
    }
  }
  return [...merged.values()];
}

function mergeActivePowerups(localItems=[],cloudItems=[]){
  const merged=new Map();
  for(const item of [...cloudItems,...localItems]){
    if(!item||!item.id||!(item.remainingMs>0))continue;
    const existing=merged.get(item.id);
    if(!existing||item.remainingMs>existing.remainingMs){
      merged.set(item.id,{id:item.id,remainingMs:item.remainingMs});
    }
  }
  return [...merged.values()];
}

function showToast(title,message){

  if(!host)return;
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML=`<strong>${esc(title)}</strong><br>${esc(message)}`;
  host.appendChild(el);
  setTimeout(()=>el.remove(),5500);
}

function formatClock(ms){
  ms=Math.max(0,Number(ms)||0);
  const total=Math.ceil(ms/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function hasActivePowerup(id){
  return (prog.activePowerups||[]).some(item=>item.id===id&&item.remainingMs>0);
}

function remainingPowerupMs(id){
  return (prog.activePowerups||[]).find(item=>item.id===id)?.remainingMs||0;
}

function activePowerupMultiplier(gameId){
  let multiplier=1;
  if(hasActivePowerup("xp_amp"))multiplier+=0.5;
  if(hasActivePowerup("intel_amp")&&["identity","database","artifact","quote"].includes(gameId))multiplier+=0.5;
  if(hasActivePowerup("tactical_amp")&&["escape","grid","six"].includes(gameId))multiplier+=0.5;
  return multiplier;
}

function awardXp(baseXp,gameId){

  if(base<=0)return 0;
  const adminMult=isAdmin()?Math.max(0,Number(prog.adminXpMultiplier)||1):1;
  return Math.round(base*activePowerupMultiplier(gameId)*adminMult*10)/10;
}

function weightedDuration(){
  const roll=Math.random()*100;
  if(roll<45)return 5;
  if(roll<75)return 15;
  if(roll<93)return 30;
  return 60;
}

function addPowerupToInventory(id,durationMin=0){
  const key=powerupKey(id,durationMin);
  let item=(prog.powerups||[]).find(entry=>powerupKey(entry.id,entry.durationMin)===key);
  if(item)item.qty=(item.qty||1)+1;
  else prog.powerups.push({id,durationMin,qty:1});
  prog.unseenPowerups=(prog.unseenPowerups||0)+1;
  return {id,durationMin};
}

function rollPostGamePowerup(gameId){
  const forced=isAdmin()&&prog.adminForcePowerupDrop;
  const forcedId=isAdmin()&&prog.adminNextPowerupId?prog.adminNextPowerupId:"";
  const denominator=hasActivePowerup("powerup_luck")?18:POWERUP_DROP_DENOMINATOR;

  if(!forced&&!forcedId&&Math.random()>=1/denominator)return null;

  const ids=Object.keys(powerupCatalog);
  const id=forcedId&&powerupCatalog[forcedId]?forcedId:rnd(ids);
  const info=powerupCatalog[id];
  const durationMin=info.timed
    ? (forcedId?Math.max(1,Number(prog.adminNextPowerupDuration)||60):weightedDuration())
    : 0;

  const drop=addPowerupToInventory(id,durationMin);

  if(forcedId){
    prog.adminNextPowerupId="";
  }

  setTimeout(()=>{
    showToast(
      "POWER-UP RECOVERED",
      `${info.name}${durationMin?` · ${durationMin} min`:" · single use"} added to Inventory.`
    );
  },60);

  return drop;
}

function removeStoredPowerup(id,durationMin=0){
  const key=powerupKey(id,durationMin);
  const item=(prog.powerups||[]).find(entry=>powerupKey(entry.id,entry.durationMin)===key);
  if(!item||item.qty<=0)return false;
  item.qty--;
  prog.powerups=prog.powerups.filter(entry=>(entry.qty||0)>0);
  return true;
}

function activateTimedPowerup(id,durationMin){
  if(!removeStoredPowerup(id,durationMin))return false;
  let active=(prog.activePowerups||[]).find(item=>item.id===id);
  if(active)active.remainingMs=Math.min(4*60*60*1000,(active.remainingMs||0)+durationMin*60000);
  else prog.activePowerups.push({id,remainingMs:durationMin*60000});
  showToast("POWER-UP ACTIVATED",`${powerupCatalog[id].name} · ${durationMin} minutes of active-tab time.`);
  return true;
}

function tickPowerTimers(){
  const now=Date.now();
  const canTick=document.visibilityState==="visible"&&navigator.onLine&&!(isAdmin()&&prog.adminFreezeBuffTimers);
  let changed=false;

  if(canTick){
    const delta=Math.max(0,Math.min(5000,now-powerTimerLast));
    for(const item of prog.activePowerups||[]){
      if(item.remainingMs>0){
        item.remainingMs=Math.max(0,item.remainingMs-delta);
        changed=true;
      }
    }
    prog.activePowerups=(prog.activePowerups||[]).filter(item=>item.remainingMs>0);
  }

  powerTimerLast=now;

  if(changed&&now-powerTimerPersistAt>5000){
    persistLocalProgress();
    powerTimerPersistAt=now;
  }

  document.querySelectorAll("[data-active-power]").forEach(el=>{
    const id=el.dataset.activePower;
    const remaining=remainingPowerupMs(id);
    if(remaining<=0){
      el.remove();
    }else{
      el.textContent=`${powerupCatalog[id]?.name||id} · ${formatClock(remaining)}`;
    }
  });
}

function seededUnit(seed,level,salt=0){
  let x=(Number(seed)||1) ^ Math.imul(level+31,2654435761) ^ Math.imul(salt+17,1597334677);
  x=Math.imul(x^(x>>>16),2246822507);
  x=Math.imul(x^(x>>>13),3266489909);
  x=(x^(x>>>16))>>>0;
  return x/4294967296;
}

function rewardLevelEligible(level){
  // Guaranteed every 5 levels. Level Cache Scanner only affects random non-guaranteed drops.
  if(level%5===0)return true;
  const chance=hasActivePowerup("level_luck")?0.56:0.28;
  return seededUnit(prog.rewardSeed,level,1)<chance;
}

function addInventoryReward(artifact,level){
  const rarity=rarityForArtifact(artifact.name);
  const existing=(prog.inventory||[]).find(item=>item.name===artifact.name);
  if(existing){
    existing.qty=(existing.qty||1)+1;
    existing.lastLevel=level;
    existing.rarity=rarity;
  }else{
    prog.inventory.push({
      name:artifact.name,
      rarity,
      qty:1,
      firstLevel:level,
      lastLevel:level
    });
  }
  prog.unseenInventory=(prog.unseenInventory||0)+1;
}

function rewardArtifactFor(level,slot){
  const desiredRarity=chooseRarityForLevel(level,slot+100);
  const owned=new Set((prog.inventory||[]).map(item=>item.name));

  let pool=artifacts.filter(item=>
    rarityForArtifact(item.name)===desiredRarity &&
    !owned.has(item.name)
  );

  // If all unowned artefacts of that rarity are gone, allow duplicates.
  if(!pool.length){
    pool=artifacts.filter(item=>rarityForArtifact(item.name)===desiredRarity);
  }

  // If a tier has no artefacts at all, step downward to the nearest available tier.
  if(!pool.length){
    let rarityIndex=rarityOrder.indexOf(desiredRarity);
    while(rarityIndex>0&&!pool.length){
      rarityIndex--;
      const fallbackRarity=rarityOrder[rarityIndex];
      pool=artifacts.filter(item=>rarityForArtifact(item.name)===fallbackRarity);
    }
  }

  if(!pool.length)pool=artifacts;

  const index=Math.floor(seededUnit(prog.rewardSeed,level,slot+200)*pool.length);
  return pool[Math.max(0,Math.min(pool.length-1,index))];
}

function processLevelRewards(){
  const currentLevel=lvl(prog.xp);
  const processed=new Set(prog.rewardedLevels||[]);

  for(let level=2;level<=currentLevel;level++){
    if(processed.has(level))continue;

    if(rewardLevelEligible(level)){
      let count=1;
      if(level%25===0)count=3;
      else if(level%10===0)count=2;

      for(let slot=0;slot<count;slot++){
        addInventoryReward(rewardArtifactFor(level,slot),level);
      }
    }

    prog.rewardedLevels.push(level);
    processed.add(level);
  }

  prog.rewardedLevels=[...new Set(prog.rewardedLevels)].sort((a,b)=>a-b);
}

    return;
  }

  await firebaseReady;

  if(currentUser){
    await signOutFn(auth);
    return;
  }

  const provider=new GoogleAuthProviderClass();
  provider.setCustomParameters({prompt:"select_account"});

  try{
    await signInWithPopupFn(auth,provider);

    console.error(error);

      return;

function supportGiveArtifact(target,name,qty=1){

  if(!Array.isArray(target.inventory))target.inventory=[];
  qty=Math.max(1,Math.floor(Number(qty)||1));
  for(let i=0;i<qty;i++){

    if(existing)existing.qty=(existing.qty||1)+1;
    else target.inventory.push({

      firstLevel:lvl(target.xp||0),

function supportGivePowerup(target,id,durationMin=60,qty=1){

  if(!info)return false;
  if(!Array.isArray(target.powerups))target.powerups=[];
  const duration=info.timed?Math.max(1,Math.floor(Number(durationMin)||60)):0;
  const key=powerupKey(id,duration);
  let item=target.powerups.find(x=>powerupKey(x.id,x.durationMin)===key);
  qty=Math.max(1,Math.floor(Number(qty)||1));
  if(item)item.qty=(item.qty||1)+qty;
  else target.powerups.push({id,durationMin:duration,qty});
  target.unseenPowerups=(target.unseenPowerups||0)+qty;
  return true;
}

async function adminMutateSupportUser(uid,mutator){
  if(!isAdmin()||!uid)throw new Error("Admin access required.");
  const ref=docFn(db,"users",uid);
  const snap=await getDocFn(ref);
  if(!snap.exists())throw new Error("User save not found.");
  const data=snap.data();
  const target=JSON.parse(JSON.stringify(data.progress||{}));
  if(target.adminSupport!==true)throw new Error("This user has not enabled admin support.");

  await mutator(target);

  // Preserve the user's opt-in so admin writes cannot silently remove consent.
  target.adminSupport=true;
  await setDocFn(ref,{progress:target,updatedAt:serverTimestampFn()},{merge:true});
  return target;
}

    try{
      const users=await adminLoadSupportUsers();
      if(!users.length){
        host.innerHTML=`<div class="admin-status">No users have opted into admin support yet.</div>`;
        return;
      }
      host.innerHTML=users.map(user=>{
        const p=user.progress||{};
        const inv=(p.inventory||[]).reduce((sum,x)=>sum+(x.qty||1),0);
        return `<button type="button" class="support-user" data-support-uid="${esc(user.uid)}" style="width:100%;text-align:left;color:inherit">
          <strong>Agent ${esc(user.uid.slice(0,8))}…</strong><br>
          <code>${esc(user.uid)}</code>
          <div class="admin-kpi">
            <div><strong>${lvl(p.xp||0)}</strong><span>Level</span></div>
            <div><strong>${Number(p.xp||0).toLocaleString()}</strong><span>XP</span></div>
            <div><strong>${inv}</strong><span>Artefacts</span></div>
          </div>

      }).join("");

      document.querySelectorAll("[data-support-uid]").forEach(button=>{

  // 3) type RESET and press the final button
  document.getElementById("admResetStart").onclick=()=>{

    host.innerHTML=`<div class="notice" style="margin-top:10px"><strong>Confirmation 2/3</strong><br>This will erase the entire save for this account.</div><button class="btn" id="admResetSecond">I understand · Continue</button>`;

    document.getElementById("admResetSecond").onclick=()=>{
      host.innerHTML=`<div class="notice" style="margin-top:10px"><strong>Confirmation 3/3</strong><br>Type <strong>RESET</strong> exactly.</div><input id="admResetWord" placeholder="RESET" autocomplete="off"><button class="btn" id="admResetFinal" disabled>RESET ACCOUNT</button>`;
      const input=document.getElementById("admResetWord");
      const finalButton=document.getElementById("admResetFinal");

      input.addEventListener("input",()=>{finalButton.disabled=input.value!=="RESET"});

      finalButton.onclick=async()=>{

function buildClues(c,key){
 const all={
   species:`CLASSIFICATION: Species — ${c.species}`,
   affiliation:`AFFILIATION: Records connect the subject to ${rnd(c.aff)}.`,
   associate:`KNOWN ASSOCIATE: ${rnd(c.assoc)}.`,
   power:`CAPABILITY: ${rnd(c.powers)}.`,
   location:`LOCATION OF INTEREST: ${rnd(c.loc)}.`,
   year:`FIRST MCU APPEARANCE YEAR: ${c.year}.`,
   equipment:`EQUIPMENT PROFILE: The subject is associated with ${c.safeGear}.`,
   quote:c.quote?`ARCHIVED DIALOGUE: “${c.quote}”`:null
 };

 let keys=
   key==="recruit" ? ["species","affiliation","power","equipment"] :
   key==="agent" ? ["year","associate","location","power"] :
   key==="expert" ? ["quote","location","associate","equipment"] :
                    ["quote","location","year","associate"];

 let first=keys.map(k=>all[k]).filter(Boolean);
 const fallback=sh(Object.values(all).filter(Boolean));

 for(const clue of fallback){
   if(first.length>=4)break;
   if(!first.includes(clue))first.push(clue);
 }

 first=sh(first.slice(0,4));
 return [...first,`FINAL LIFELINE: ${c.finalEasy}`];
}

function guessGame(){
 activeScreen="guess";
 prog.games++;
 save();

 const c=fresh();
 const d=difficulties[prog.difficulty];
 const clues=buildClues(c,prog.difficulty);
 let n=1,done=false;

 function pts(){
   if(n>=clues.length)return 0;
   return d.points[Math.min(n-1,d.points.length-1)];
 }

   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS · ${d.name.toUpperCase()}</p><h1>Unknown subject</h1></div><div class="reward">STREAK ${prog.streak}</div></div>

   <p class="feedback" id="fb">${esc(msg)}</p></section>`;

   document.getElementById("b").onclick=home;

     document.getElementById("next").onclick=guessGame;

   }

     e.preventDefault();
     if(done)return;

     const a=document.getElementById("gi").value;

     if(ok){

       prog.xp+=gain;

       );
     }else{

         render(`SUBJECT REVEALED: ${c.name}`);
       }else{
         document.getElementById("fb").textContent="IDENTITY REJECTED. Guess again or reveal another clue.";
       }
     }
   };
 }
 render();
}

function freshQuote(pool){
 const recentIds=new Set(prog.recentQuoteIds||[]);
 const recentItems=(prog.recentQuoteIds||[])
   .slice(-5)
   .map(id=>quoteBank.find(q=>quoteId(q)===id))
   .filter(Boolean);
 const recentSpeakers=new Set(recentItems.map(q=>q.speaker));

 let fresh=pool.filter(q=>!recentIds.has(quoteId(q))&&!recentSpeakers.has(q.speaker));
 if(!fresh.length)fresh=pool.filter(q=>!recentIds.has(quoteId(q)));
 if(!fresh.length)fresh=pool;

 return rnd(fresh);
}

function rememberQuote(item){
 prog.recentQuoteIds=[...(prog.recentQuoteIds||[]),quoteId(item)].slice(-24);
}

function quoteDistractors(item,mode){
 const allSpeakers=[...new Set(quoteBank.map(q=>q.speaker))].filter(name=>name!==item.speaker);
 const speakerGroups=quoteGroups[item.speaker]||[];
 let ordered=[];

 if(mode==="expert"||mode==="agent"){
   ordered.push(...sh(allSpeakers.filter(name=>{
     const groups=quoteGroups[name]||[];
     return groups.some(group=>speakerGroups.includes(group));
   })));
 }

 ordered.push(...sh(allSpeakers));

 const unique=[];
 for(const name of ordered){
   if(!unique.includes(name))unique.push(name);
   if(unique.length>=3)break;
 }
 return unique;
}

function quoteGame(mode="agent"){
 activeScreen="quote";
 prog.games++;
 save();

 const cfg={
   recruit:{mult:1,tiers:["recruit","agent"],typedChance:.20},
   agent:{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48},
   expert:{mult:2,tiers:["agent","expert"],typedChance:.68}
 }[mode]||{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48};

 const pool=quoteBank.filter(q=>cfg.tiers.includes(q.tier));
 const item=freshQuote(pool.length?pool:quoteBank);
 const initialTyped=Math.random()<cfg.typedChance;
 const distractors=quoteDistractors(item,mode);
 const choices=sh([item.speaker,...distractors]);
 let answerType=initialTyped?"typed":"mcq";
 let converted=false;
 let answered=false;

 function reward(){
   if(answerType==="typed"&&!converted)return Math.round(85*cfg.mult);
   return Math.round(55*cfg.mult);
 }

 function render(msg=""){
   const answerUi=answerType==="typed"
     ? `<form class="form" id="quoteTypedForm">
          <input id="quoteTypedInput" placeholder="Type the character name or alias" autocomplete="off" ${answered?"disabled":""} required>
          <button class="btn primary" ${answered?"disabled":""}>Submit</button>
        </form>
        <div class="row">
          <button class="btn" id="convertQuote" ${answered?"disabled":""}>Show MCQ instead · lower XP</button>
        </div>`
     : `<div class="choices">${choices.map(name=>`<button class="choice" data-quote-answer="${esc(name)}" ${answered?"disabled":""}>${esc(name)}</button>`).join("")}</div>`;

   screen.innerHTML=`<div class="missionhead">
   <button class="back" id="qback">← Terminal</button>
   <div><p class="eyebrow">WHO SAID IT? · ${mode.toUpperCase()} · ${answerType==="typed"?"TYPE-IN":"MCQ"}</p><h1>Identify the speaker</h1></div>
   <div class="reward">STREAK ${prog.quoteStreak||0} · +${reward()} XP</div>
   </div>
   <section class="mission">
   <div class="quote-box"><blockquote>“${esc(item.quote)}”</blockquote><small>ARCHIVED MCU DIALOGUE</small></div>
   ${answerUi}
   <div class="row">${answered?'<button class="btn primary" id="qn">Next quote</button><button class="btn" id="qc">Change difficulty</button>':""}</div>
   <p class="feedback" id="qfeedback">${esc(msg)}</p></section>`;

   document.getElementById("qback").onclick=home;

   async function finish(correct){
     if(answered)return;
     answered=true;
     rememberQuote(item);

     if(correct){
       const gain=awardXp(reward(),"quote");
       prog.xp+=gain;
       prog.quotesIdentified=(prog.quotesIdentified||0)+1;
       prog.quoteStreak=(prog.quoteStreak||0)+1;
       prog.bestQuoteStreak=Math.max(prog.bestQuoteStreak||0,prog.quoteStreak);
       rollPostGamePowerup("quote");
       await save();
       render(`CORRECT: ${item.speaker} · +${gain} XP`);
     }else{
       prog.quoteStreak=0;
       rollPostGamePowerup("quote");
       await save();
       render(`INCORRECT · ${item.speaker} said it.`);
     }
   }

   if(answerType==="typed"){
     document.getElementById("quoteTypedForm").onsubmit=e=>{
       e.preventDefault();
       finish(quoteAccepted(item,document.getElementById("quoteTypedInput").value));
     };

     document.getElementById("convertQuote").onclick=()=>{
       answerType="mcq";
       converted=true;
       render("MCQ assistance enabled. Reward reduced.");
     };
   }else{
     document.querySelectorAll("[data-quote-answer]").forEach(button=>{
       button.onclick=()=>finish(button.dataset.quoteAnswer===item.speaker);
     });
   }

   if(answered){
     document.getElementById("qn").onclick=()=>quoteGame(mode);
     document.getElementById("qc").onclick=quoteDifficultyMenu;
   }
 }
 render();
}

const MCU_ROSTER_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/characters.json";
const MCU_MOVIES_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/movies.json";
const MCU_TV_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/tvshows.json";

let fullGridRosterLoaded=false;
let fullGridRosterLoading=null;
let fullGridRosterError=false;
let fullGridRosterCount=gridProfiles.length;
const gridDynamicCategoryTags=new Set();

function allProfileNames(profile){
  return [profile.name,...(profile.aliases||[])].map(norm).filter(Boolean);
}

function remoteRecordMatchesProfile(record,profile){
  const remoteNames=[record.name,record.alias].filter(Boolean).map(norm);
  const localNames=allProfileNames(profile);
  return remoteNames.some(name=>localNames.includes(name));
}

function addTag(tags,tag){
  if(tag)tags.add(tag);
}

function gridSlug(value){
  return String(value||"")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,48);
}

function deriveDescriptionTags(record){
  const tags=new Set();
  const d=String(record.description||"").toLowerCase();
  const alias=String(record.alias||"").toLowerCase();
  const name=String(record.name||"").toLowerCase();
  const all=`${name} ${alias} ${d}`;

  if(/\bavenger\b|\bavengers\b/.test(all))addTag(tags,"avenger");
  if(/guardian of the galaxy|guardians of the galaxy|\bguardian\b/.test(all))addTag(tags,"guardian");
  if(/wakanda|wakandan/.test(all))addTag(tags,"wakandan");
  if(/s\.?h\.?i\.?e\.?l\.?d/.test(all))addTag(tags,"shield");
  if(/\bhydra\b/.test(all))addTag(tags,"hydra");
  if(/\btva\b|time variance authority/.test(all))addTag(tags,"tva");
  if(/master[s]? of the mystic arts|sorcerer supreme|mystic arts/.test(all))addTag(tags,"mystic");
  if(/\bvillain\b|\bantagonist\b|\bcriminal\b|\bwarlord\b|\bterrorist\b/.test(all))addTag(tags,"villain");
  if(/former villain|former antagonist|redeemed/.test(all))addTag(tags,"formerVillain");
  if(/\bspy\b|intelligence operative|secret agent|assassin/.test(all))addTag(tags,"spy");
  if(/\bscientist\b|\bphysicist\b|\bengineer\b|\binventor\b|\bresearcher\b/.test(all))addTag(tags,"scientist");
  if(/red room/.test(all))addTag(tags,"redRoom");
  if(/asgardian|asgard/.test(all)){addTag(tags,"asgardian");addTag(tags,"alien");}
  if(/\bking\b|\bqueen\b|\bprince\b|\bprincess\b|\broyal\b|\bruler\b|\bmonarch\b/.test(all))addTag(tags,"royalty");
  if(/\bmagic\b|\bwitch\b|\bsorcerer\b|\bsorceress\b|\bwarlock\b|\bmystical\b/.test(all))addTag(tags,"magic");
  if(/\bsorcerer\b|\bsorceress\b|sorcerer supreme/.test(all))addTag(tags,"sorcerer");
  if(/super soldier|enhanced|mutant|inhuman|superhuman|experiment/.test(all))addTag(tags,"enhanced");
  if(/superhuman strength|super strength|incredible strength|enhanced strength|immense strength/.test(all))addTag(tags,"superStrength");
  if(/\bflies\b|\bflight\b|\bflying\b|\bwings\b|\bwinged\b/.test(all))addTag(tags,"fly");
  if(/technology|technological|armor|armour|robot|android|synthezoid|cyborg|mechanical|powered suit/.test(all))addTag(tags,"tech");
  if(/\balien\b|\bkree\b|\bskrull\b|\beternal\b|\bcelestial\b|frost giant|dark elf|titan|xandarian|sovereign/.test(all))addTag(tags,"alien");
  if(/\barcher\b|\bbow\b/.test(all))addTag(tags,"archer");
  if(/young hero|teenage hero|teenager|student/.test(all))addTag(tags,"young");

  return tags;
}

function firstReleasedProjectFor(record,moviesById,showsById){
  const movie=record.first_appearance_movie_id?moviesById.get(Number(record.first_appearance_movie_id)):null;
  const show=record.first_appearance_tvshow_id?showsById.get(Number(record.first_appearance_tvshow_id)):null;

  if(movie&&show){
    const md=movie.release_date||"9999-12-31";
    const sd=show.release_date||"9999-12-31";
    return md<=sd?movie:show;
  }
  return movie||show||null;
}

function projectIsReleased(project){
  if(!project||!project.release_date)return false;
  const release=new Date(`${project.release_date}T00:00:00Z`).getTime();
  return Number.isFinite(release)&&release<=Date.now();
}

function deriveProjectTags(project){
  const tags=new Set();
  if(!project)return tags;

  const phase=Number(project.phase);
  if(phase>=1&&phase<=6)addTag(tags,`debutPhase${phase}`);

  if(project.type==="movie"){
    addTag(tags,"debutMovie");
  }else{
    addTag(tags,"debutSeries");
  }

  const title=String(project.title||"");
  const slug=gridSlug(title);
  if(slug){
    const projectTag=`debutProject-${slug}`;
    addTag(tags,projectTag);
    gridDynamicCategoryTags.add(projectTag);
    gridCategoryMap[projectTag]=`Introduced in ${title}`;
  }

  const t=title.toLowerCase();
  if(t.includes("iron man"))addTag(tags,"ironManFranchise");
  if(t.includes("thor"))addTag(tags,"thorFranchise");
  if(t.includes("captain america"))addTag(tags,"captainAmericaFranchise");
  if(t.includes("avengers"))addTag(tags,"avengersFranchise");
  if(t.includes("guardians of the galaxy"))addTag(tags,"guardiansFranchise");
  if(t.includes("ant-man"))addTag(tags,"antManFranchise");
  if(t.includes("doctor strange"))addTag(tags,"doctorStrangeFranchise");
  if(t.includes("spider-man"))addTag(tags,"spiderManFranchise");
  if(t.includes("black panther"))addTag(tags,"blackPantherFranchise");
  if(t.includes("captain marvel")||t==="the marvels")addTag(tags,"captainMarvelFranchise");
  if(t.includes("deadpool"))addTag(tags,"deadpoolFranchise");
  if(t.includes("fantastic four"))addTag(tags,"fantasticFourFranchise");

  return tags;
}

function mergeRemoteGridProfile(record,project){
  const existing=gridProfiles.find(profile=>remoteRecordMatchesProfile(record,profile));
  const derived=new Set([
    ...deriveDescriptionTags(record),
    ...deriveProjectTags(project)
  ]);

  if(existing){
    existing.tags=[...new Set([...(existing.tags||[]),...derived])];

    const aliases=new Set(existing.aliases||[]);
    if(record.alias&&norm(record.alias)!==norm(existing.name))aliases.add(record.alias);
    if(record.name&&norm(record.name)!==norm(existing.name))aliases.add(record.name);
    existing.aliases=[...aliases];

    existing.remoteId=record.id;
    existing.description=record.description||existing.description||"";
    existing.firstProject=project?.title||existing.firstProject||"";
    return existing;
  }

  const aliases=[];
  if(record.alias&&norm(record.alias)!==norm(record.name))aliases.push(record.alias);

  const profile={
    name:record.name,
    aliases,
    tags:[...derived],
    remoteId:record.id,
    description:record.description||"",
    firstProject:project?.title||""
  };
  gridProfiles.push(profile);
  return profile;
}

function refreshDynamicGridPools(){
  const counts=new Map();
  for(const profile of gridProfiles){
    for(const tag of profile.tags||[]){
      counts.set(tag,(counts.get(tag)||0)+1);
    }
  }

  // Only use debut-project categories with enough characters to make
  // interesting, solvable intersections rather than ultra-narrow boards.
  const projectTags=[...gridDynamicCategoryTags]
    .filter(tag=>(counts.get(tag)||0)>=4);

  for(const tag of projectTags){
    if(!gridRowPool.includes(tag))gridRowPool.push(tag);
  }
}

async function loadFullGridRoster(){
  if(fullGridRosterLoaded)return gridProfiles;
  if(fullGridRosterLoading)return fullGridRosterLoading;

  fullGridRosterLoading=(async()=>{
    try{
      const [charactersResponse,moviesResponse,tvResponse]=await Promise.all([
        fetch(MCU_ROSTER_URL,{cache:"no-store"}),
        fetch(MCU_MOVIES_URL,{cache:"no-store"}),
        fetch(MCU_TV_URL,{cache:"no-store"})
      ]);

      if(!charactersResponse.ok||!moviesResponse.ok||!tvResponse.ok){
        throw new Error("MCU roster source unavailable");
      }

      const [records,movies,shows]=await Promise.all([
        charactersResponse.json(),
        moviesResponse.json(),
        tvResponse.json()
      ]);

      const moviesById=new Map(movies.map(item=>[Number(item.id),item]));
      const showsById=new Map(shows.map(item=>[Number(item.id),item]));

      for(const record of records){
        if(!record||!record.name)continue;
        const project=firstReleasedProjectFor(record,moviesById,showsById);

        // "Introduced so far" means the first appearance must actually
        // have released by the day the player opens the site.
        if(!projectIsReleased(project))continue;

        mergeRemoteGridProfile(record,project);
      }

      // Remove accidental duplicate canonical names while preserving aliases/tags.
      const merged=[];
      for(const profile of gridProfiles){
        const duplicate=merged.find(existing=>
          allProfileNames(existing).some(name=>allProfileNames(profile).includes(name))
        );
        if(!duplicate){
          merged.push(profile);
        }else{
          duplicate.tags=[...new Set([...(duplicate.tags||[]),...(profile.tags||[])])];
          duplicate.aliases=[...new Set([...(duplicate.aliases||[]),profile.name,...(profile.aliases||[])])]
            .filter(alias=>norm(alias)!==norm(duplicate.name));
        }
      }
      gridProfiles=merged;

      refreshDynamicGridPools();
      fullGridRosterCount=gridProfiles.length;
      fullGridRosterLoaded=true;
      fullGridRosterError=false;
      return gridProfiles;
    }catch(error){
      console.warn("Full MCU roster failed; using built-in Marvel Grid roster.",error);
      fullGridRosterError=true;
      fullGridRosterCount=gridProfiles.length;
      return gridProfiles;
    }finally{
      fullGridRosterLoading=null;
    }
  })();

  return fullGridRosterLoading;
}

const gridRowPool=["avenger","guardian","wakandan","shield","hydra","tva","mystic","villain","formerVillain","royalty","spy","scientist","redRoom","asgardian","young","debutPhase1","debutPhase2","debutPhase3","debutPhase4","debutPhase5","debutPhase6","debutMovie","debutSeries"];
const gridColPool=["tech","fly","superStrength","magic","sorcerer","enhanced","alien","phase1","phase2","phase3","phase4","phase5","disneyPlus","avengersMovie","captainAmericaMovie","spiderManMovie","guardiansMovie","foughtThanos","wasSnapped","survivedSnap","beenAvenger","space","wakanda","quantumRealm","usedInfinityStone","archer","ironManFranchise","thorFranchise","captainAmericaFranchise","avengersFranchise","guardiansFranchise","antManFranchise","doctorStrangeFranchise","spiderManFranchise","blackPantherFranchise","captainMarvelFranchise","deadpoolFranchise","fantasticFourFranchise"];

function gridCandidates(rowTag,colTag){
 return gridProfiles.filter(profile=>profile.tags.includes(rowTag)&&profile.tags.includes(colTag));
}

function gridHasDistinctSolution(rows,cols){
 const cells=[];
 for(let r=0;r<3;r++){
   for(let c=0;c<3;c++){
     const candidates=gridCandidates(rows[r],cols[c]);
     if(!candidates.length)return false;
     cells.push({r,c,candidates});
   }
 }

 cells.sort((a,b)=>a.candidates.length-b.candidates.length);
 const used=new Set();

 function backtrack(index){
   if(index>=cells.length)return true;
   for(const candidate of cells[index].candidates){
     if(used.has(candidate.name))continue;
     used.add(candidate.name);
     if(backtrack(index+1))return true;
     used.delete(candidate.name);
   }
   return false;
 }

 return backtrack(0);
}

function generateMarvelGrid(){
 for(let attempt=0;attempt<800;attempt++){
   const rows=sh(gridRowPool).slice(0,3);
   const cols=sh(gridColPool).slice(0,3);

   let reasonable=true;
   for(const row of rows){
     for(const col of cols){
       const count=gridCandidates(row,col).length;
       if(count<1||count>14){reasonable=false;break;}
     }
     if(!reasonable)break;
   }

   if(reasonable&&gridHasDistinctSolution(rows,cols))return {rows,cols};
 }

 const fallback={rows:["avenger","guardian","villain"],cols:["phase3","tech","space"]};
 return fallback;
}

function findGridProfile(answer){
 const needle=norm(answer);
 return gridProfiles.find(profile=>
   norm(profile.name)===needle ||
   (profile.aliases||[]).some(alias=>norm(alias)===needle)
 );
}

const sixStrongConnections={
  avenger:"Avengers",
  guardian:"Guardians of the Galaxy",
  wakandan:"Wakanda",
  shield:"S.H.I.E.L.D.",
  hydra:"HYDRA",
  tva:"TVA",
  mystic:"Masters of the Mystic Arts",
  redRoom:"Red Room",
  asgardian:"Asgard"
};

function sixConnectionReason(a,b){
  if(!a||!b||a.name===b.name)return null;

  for(const [tag,label] of Object.entries(sixStrongConnections)){
    if((a.tags||[]).includes(tag)&&(b.tags||[]).includes(tag)){
      return `Shared connection: ${label}`;
    }
  }

  if(a.firstProject&&b.firstProject&&a.firstProject===b.firstProject){
    return `Shared debut record: ${a.firstProject}`;
  }

  return null;
}

function sixNeighbors(profile){
  return gridProfiles.filter(other=>other.name!==profile.name&&sixConnectionReason(profile,other));
}

function shortestSixPath(start,end,maxDepth=6){
  const queue=[[start]];
  const seen=new Set([start.name]);

  while(queue.length){
    const path=queue.shift();
    const current=path[path.length-1];
    if(current.name===end.name)return path;
    if(path.length-1>=maxDepth)continue;

    for(const next of sixNeighbors(current)){
      if(seen.has(next.name))continue;
      seen.add(next.name);
      queue.push([...path,next]);
    }
  }

  return null;
}

function generateSixPair(){
  const viable=gridProfiles.filter(profile=>sixNeighbors(profile).length>=2);
  const recent=new Set(prog.recentSixPairs||[]);

  for(let attempt=0;attempt<250;attempt++){
    const start=rnd(viable);
    const end=rnd(viable.filter(x=>x.name!==start.name));
    if(!start||!end)continue;

    const key=[start.name,end.name].sort().join("|");
    if(recent.has(key))continue;

    const shortest=shortestSixPath(start,end,6);
    const distance=shortest?shortest.length-1:0;
    if(shortest&&distance>=2&&distance<=5){
      return {start,end,shortest,key};
    }
  }

  const start=gridProfiles.find(x=>x.name==="Steve Rogers")||viable[0];
  const end=gridProfiles.find(x=>x.name==="Rocket")||viable[viable.length-1];
  return {start,end,shortest:shortestSixPath(start,end,6),key:[start.name,end.name].sort().join("|")};
}

async function sixDegreesGame(){
  activeScreen="six";

  screen.innerHTML=`<div class="missionhead"><button class="back" id="sixLoadBack">← Terminal</button><div><p class="eyebrow">SIX DEGREES OF MARVEL</p><h1>Building connection graph…</h1></div></div><section class="mission"><div class="notice">Loading the released-character roster.</div></section>`;
  document.getElementById("sixLoadBack").onclick=home;

  await loadFullGridRoster();

  prog.games++;
  prog.sixPlayed=(prog.sixPlayed||0)+1;
  const pair=generateSixPair();
  prog.recentSixPairs=[...(prog.recentSixPairs||[]),pair.key].slice(-12);
  await save();

  const path=[pair.start];
  const used=new Set([pair.start.name]);
  const optimal=Math.max(1,(pair.shortest?.length||2)-1);
  let finished=false,gaveUp=false;

  function currentLinks(){return path.length-1}

  function baseReward(){
    const extra=Math.max(0,currentLinks()-optimal);
    return Math.max(20,120-extra*25);
  }

  async function finish(success){
    if(finished)return;
    finished=true;
    gaveUp=!success;

    let gain=0;
    if(success){
      gain=awardXp(baseReward(),"six");
      prog.xp+=gain;
      prog.sixSolved=(prog.sixSolved||0)+1;
      if(!prog.sixBest||currentLinks()<prog.sixBest)prog.sixBest=currentLinks();
      rollPostGamePowerup("six");
    }
    await save();
    render(success?`CHAIN VERIFIED · +${gain} XP`:"CHAIN ABANDONED · +0 XP");
  }

  function render(message=""){
    const current=path[path.length-1];
    const complete=current.name===pair.end.name;

    if(complete&&!finished){
      finish(true);
      return;
    }

    const pathHtml=path.map((node,index)=>{
      const arrow=index?`<span class="degree-arrow">→</span>`:"";
      return `${arrow}<span class="degree-node">${esc(node.name)}</span>`;
    }).join("");

    const reasonHtml=path.length>1?path.slice(1).map((node,index)=>{
      return `<div class="clue"><span>LINK ${index+1}</span><div>${esc(sixConnectionReason(path[index],node)||"Verified relationship")}</div></div>`;
    }).join(""):"";

    screen.innerHTML=`<div class="missionhead">
      <button class="back" id="sixBack">← Terminal</button>
      <div><p class="eyebrow">SIX DEGREES OF MARVEL</p><h1>${esc(pair.start.name)} → ${esc(pair.end.name)}</h1></div>
      <div class="reward">${currentLinks()}/6 links · shortest ${optimal}</div>
    </div>
    <section class="mission">
      <div class="notice">Add characters one at a time. Every adjacent pair needs a verified strong relationship. Maximum: 6 links.</div>
      <div class="degree-path">${pathHtml}<span class="degree-arrow">→</span><span class="degree-node" style="border-style:dashed">${esc(pair.end.name)}</span></div>
      ${reasonHtml}
      ${!finished?`
        <form class="form" id="sixForm">
          <input id="sixInput" placeholder="Search next character…" autocomplete="off" required>
          <button class="btn primary">Add link</button>
        </form>
        <div class="suggestions" id="sixSuggestions"></div>
        <div class="row"><button class="btn" id="sixGiveUp">Give up · 0 XP</button></div>
      `:`<div class="grid-results"><strong>${gaveUp?"GAVE UP":"CHAIN COMPLETE"}</strong><p>${gaveUp?`Shortest route: ${pair.shortest?.map(x=>x.name).join(" → ")||"unavailable"}`:`${currentLinks()} links · shortest possible ${optimal}`}</p><div class="row"><button class="btn primary" id="sixNew">New chain</button><button class="btn" id="sixHome">Terminal</button></div></div>`}
      <p class="feedback" id="sixFeedback">${esc(message)}</p>
    </section>`;

    document.getElementById("sixBack").onclick=home;

    if(!finished){
      const input=document.getElementById("sixInput");
      const suggestions=document.getElementById("sixSuggestions");

      function refresh(){
        const q=norm(input.value);
        if(!q){suggestions.innerHTML="";return;}
        const matches=gridProfiles
          .filter(profile=>!used.has(profile.name))
          .filter(profile=>norm(profile.name).includes(q)||(profile.aliases||[]).some(alias=>norm(alias).includes(q)))
          .sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1)||a.name.localeCompare(b.name))
          .slice(0,12);

        suggestions.innerHTML=matches.map(profile=>`<button class="suggestion" data-six-name="${esc(profile.name)}" type="button"><strong>${esc(profile.name)}</strong><small>${esc((profile.aliases||[]).slice(0,2).join(" · "))}</small></button>`).join("");
        document.querySelectorAll("[data-six-name]").forEach(button=>button.onclick=()=>{input.value=button.dataset.sixName;suggestions.innerHTML=""});
      }

      input.addEventListener("input",refresh);

      document.getElementById("sixForm").onsubmit=e=>{
        e.preventDefault();
        const candidate=findGridProfile(input.value);
        const feedback=document.getElementById("sixFeedback");

        if(!candidate){feedback.textContent="Character not found. Choose a suggested personnel record.";return;}
        if(used.has(candidate.name)){feedback.textContent="That character is already in your chain.";return;}

        const reason=sixConnectionReason(path[path.length-1],candidate);
        if(!reason){feedback.textContent=`No valid direct connection found between ${path[path.length-1].name} and ${candidate.name}.`;return;}

        if(candidate.name!==pair.end.name&&currentLinks()>=5){
          feedback.textContent="That would use your sixth link without reaching the target.";
          return;
        }

        path.push(candidate);
        used.add(candidate.name);

        if(currentLinks()>6){
          finish(false);
        }else{
          render(`${candidate.name} added · ${reason}`);
        }
      };

      document.getElementById("sixGiveUp").onclick=()=>finish(false);
    }else{
      document.getElementById("sixNew").onclick=sixDegreesGame;
      document.getElementById("sixHome").onclick=home;
    }
  }

  render();
}

function heistRemainingMs(){
  if(isAdmin()&&prog.adminHeistNoCooldown)return 0;
  return Math.max(0,(Number(prog.heistReadyAt)||0)-Date.now());
}

const HEIST_BASE_WEIGHTS={Common:38,Uncommon:28,Rare:20,Epic:10,Legendary:3.5,Mythic:0.5};
const HEIST_LUCK_WEIGHTS={Common:28,Uncommon:27,Rare:23,Epic:16.2,Legendary:4.9,Mythic:0.9};

function rollWeightedRarity(weights){
  const roll=Math.random()*100;
  let total=0;
  for(const rarity of rarityOrder){
    total+=weights[rarity]||0;
    if(roll<total)return rarity;
  }
  return "Common";
}

function rollHeistArtifact(){
  if(isAdmin()&&prog.adminNextHeistArtifact){
    const forced=artifacts.find(a=>a.name===prog.adminNextHeistArtifact);
    prog.adminNextHeistArtifact="";
    if(forced)return forced;
  }

  const weights=hasActivePowerup("heist_luck")?HEIST_LUCK_WEIGHTS:HEIST_BASE_WEIGHTS;
  let rarity=(isAdmin()&&prog.adminNextHeistRarity&&rarityOrder.includes(prog.adminNextHeistRarity))
    ? prog.adminNextHeistRarity
    : rollWeightedRarity(weights);

  if(isAdmin()&&prog.adminNextHeistRarity)prog.adminNextHeistRarity="";

  let pool=artifacts.filter(item=>rarityForArtifact(item.name)===rarity);
  if(!pool.length)pool=artifacts;
  let artifact=rnd(pool);

  if(hasActivePowerup("dup_guard")&&(prog.inventory||[]).some(item=>item.name===artifact.name)){
    const uniquePool=pool.filter(item=>!(prog.inventory||[]).some(owned=>owned.name===item.name));
    if(uniquePool.length)artifact=rnd(uniquePool);
  }

  return artifact;
}

function heistOddsHtml(){
  const weights=hasActivePowerup("heist_luck")?HEIST_LUCK_WEIGHTS:HEIST_BASE_WEIGHTS;
  return `<div class="heist-odds">${rarityOrder.map(r=>`<div><strong>${esc(r)}</strong><br>${weights[r]}%</div>`).join("")}</div>`;
}

        ${revealing?`<div><p class="eyebrow">ACCESSING VAULT</p><h2>Scanning recovered object…</h2></div>`:
          lastRewards.length?`<div style="width:100%"><p class="eyebrow">RECOVERY COMPLETE</p>${lastRewards.map(a=>artifactResultVisual(a)).join("")}</div>`:
          `<div><p class="eyebrow">${ready?"VAULT AVAILABLE":"COOLDOWN ACTIVE"}</p><h2>${ready?"Initiate a recovery attempt":"Return when the vault unlocks"}</h2></div>`}
      </div>
      <div class="row">
        <button class="btn primary" id="heistGo" ${!ready||revealing?"disabled":""}>${ready?"Initiate Heist":"Heist Locked"}</button>
        <button class="btn" id="heistInventory">Open Inventory</button>
      </div>
      <p class="feedback">${esc(message)}</p>
    </section>`;

    document.getElementById("heistBack").onclick=home;
    document.getElementById("heistInventory").onclick=()=>inventoryScreen("artifacts");

    const go=document.getElementById("heistGo");
    if(go)go.onclick=async()=>{
      if(heistRemainingMs()>0||revealing)return;
      revealing=true;
      lastRewards=[];
      render("Vault access accepted…");

      // Lock the next attempt immediately so refreshing cannot reroll the reward.
      prog.heistReadyAt=(isAdmin()&&prog.adminHeistNoCooldown)?0:Date.now()+60*60*1000;
      prog.heistStateUpdatedAt=Date.now();
      prog.heists=(prog.heists||0)+1;
      prog.games++;
      await save();

      setTimeout(async()=>{
        const first=rollHeistArtifact();
        lastRewards=[first];
        addInventoryReward(first,lvl(prog.xp));

        if((isAdmin()&&prog.adminForceDoubleRecovery)||(hasActivePowerup("double_loot")&&Math.random()<0.25)){
          const second=rollHeistArtifact();
          lastRewards.push(second);
          addInventoryReward(second,lvl(prog.xp));
        }

        rollPostGamePowerup("heist");
        revealing=false;
        await save();
        render(`${lastRewards.length} artefact${lastRewards.length===1?"":"s"} recovered.`);
      },1100);
    };
  }

  render();

  const heistUiTimer=setInterval(()=>{
    if(activeScreen!=="heist"){clearInterval(heistUiTimer);return;}
    if(!revealing&&heistRemainingMs()>0)render();
  },1000);
}

function dbGame(){
 prog.games++;save();let s=fresh(),cl=sh([
 `The subject has been connected to ${rnd(s.aff)}.`,
 `A recovered file lists ${rnd(s.assoc)} as a known associate.`,
 `The subject has demonstrated ${rnd(s.powers)}.`,
 `The investigation references ${rnd(s.loc)}.`,
 `The subject's first MCU appearance year is ${s.year}.`,
 s.gear.length?`Equipment analysis mentions ${rnd(s.gear)}.`:`No signature equipment appears in the recovered manifest.`,
 `Classification lists the subject as ${s.species}.`
 ]).slice(0,4);let q="",sel="";
 function filtered(){if(!q)return characters;let n=norm(q);return characters.filter(c=>norm([c.name,...c.aliases,...c.aff,...c.powers,...c.gear,...c.assoc,...c.loc,c.species,c.year].join(" ")).includes(n))}
 function render(msg=""){let rs=filtered();screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">CLASSIFIED DATABASE</p><h1>Active case</h1></div></div><section class="casegrid"><aside class="case"><p class="eyebrow">ACTIVE INVESTIGATION</p><h2>Identify the unknown subject.</h2><p>Use the evidence and search the personnel database.</p><div class="evidence">${cl.map((x,i)=>`<div><span>EVIDENCE ${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div></aside><section class="db"><form class="search" id="sf"><input id="si" placeholder="Search name, alias, power, team, location…" value="${esc(q)}"><button class="btn">Search</button></form><div class="results">${rs.map(c=>`<button class="person ${sel===c.name?"sel":""}" data-p="${esc(c.name)}"><strong>${esc(c.name)}</strong><small>${esc(c.aliases[0]||"")}</small><p>${esc(c.species)} · ${esc(c.aff.join(", "))}<br>${esc(c.powers.slice(0,2).join(", "))}</p></button>`).join("")}</div><div class="row"><button class="btn primary" id="acc" ${sel?"":"disabled"}>Submit selected identity</button></div><p class="feedback" id="fb">${esc(msg)}</p></section></section>`;
 document.getElementById("b").onclick=home;document.getElementById("sf").onsubmit=e=>{e.preventDefault();q=document.getElementById("si").value;render()};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;render()});document.getElementById("acc").onclick=()=>{if(sel===s.name){const gain=awardXp(80,"database");prog.xp+=gain;prog.cases++;prog.recent=[...prog.recent,s.name].slice(-12);rollPostGamePowerup("database");save();screen.innerHTML=`<section class="mission"><p class="eyebrow">CASE CLOSED</p><h1>${esc(s.name)} identified.</h1><div class="reward">+${gain} XP</div><div class="row"><button class="btn primary" id="new">Generate new case</button><button class="btn" id="home">Terminal</button></div></section>`;document.getElementById("new").onclick=dbGame;document.getElementById("home").onclick=home}else document.getElementById("fb").textContent="IDENTITY REJECTED. Re-check the evidence."}}
 render();
}
document.getElementById("homeBtn").onclick=home;
document.getElementById("rulesBtn").onclick=rulesScreen;
document.getElementById("accountBtn").onclick=accountPanel;
document.getElementById("adminBtn").onclick=adminPanel;
document.getElementById("inventoryBtn").onclick=()=>inventoryScreen("artifacts");
document.getElementById("loginBtn").onclick=authClick;
updateLoginUI();
updateInventoryButton();
home();
loadFullGridRoster().then(()=>{
  // If the user is still on the terminal, refresh the card metadata quietly.
  if(activeScreen==="home")home();
});
</script>
