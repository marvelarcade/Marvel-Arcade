  event_first(){
    const options=sh(events).slice(0,4);
    const answer=options.slice().sort((a,b)=>a[1]-b[1])[0];
    const minYear=Math.min(...options.map(x=>x[1]));
    if(options.filter(x=>x[1]===minYear).length!==1)return null;
    return escapeMcq(
      "TIMELINE LOCK",
      "Which event occurred first?",
      answer[0],
      options.filter(x=>x!==answer).map(x=>x[0])
    );
  },

  event_last(){
    const options=sh(events).slice(0,4);
    const answer=options.slice().sort((a,b)=>b[1]-a[1])[0];
    const maxYear=Math.max(...options.map(x=>x[1]));
    if(options.filter(x=>x[1]===maxYear).length!==1)return null;
    return escapeMcq(
      "TIMELINE LOCK",
      "Which event occurred most recently?",
      answer[0],
      options.filter(x=>x!==answer).map(x=>x[0])
    );
  },

  event_middle(){
    const uniqueYears=[];
    for(const ev of sh(events)){
      if(uniqueYears.some(x=>x[1]===ev[1]))continue;
      uniqueYears.push(ev);
      if(uniqueYears.length===3)break;
    }
    if(uniqueYears.length<3)return null;
    const ordered=uniqueYears.sort((a,b)=>a[1]-b[1]);
    return escapeMcq(
      "CHRONOLOGY LOCK",
      `Which event occurred between “${ordered[0][0]}” and “${ordered[2][0]}”?`,
      ordered[1][0],
      events.filter(e=>e[0]!==ordered[1][0]).map(e=>e[0])
    );
  },

  event_gap(){
    const pairs=[];
    for(const a of events)for(const b of events){
      if(a[0]!==b[0]&&a[1]!==b[1])pairs.push([a,b]);
    }
    const [a,b]=rnd(pairs);
    return escapeNumber(
      "DATE CALCULATION LOCK",
      `How many years elapsed between “${a[0]}” (${a[1]}) and “${b[0]}” (${b[1]})?`,
      Math.abs(a[1]-b[1])
    );
  },

  event_sequence(){
    const chosen=[];
    for(const ev of sh(events)){
      if(chosen.some(x=>x[1]===ev[1]))continue;
      chosen.push(ev);
      if(chosen.length===3)break;
    }
    if(chosen.length<3)return null;
    const ordered=chosen.slice().sort((a,b)=>a[1]-b[1]);
    const answer=ordered.map(x=>x[0]).join(" → ");
    const permutations=[
      [chosen[0],chosen[2],chosen[1]],
      [chosen[1],chosen[0],chosen[2]],
      [chosen[2],chosen[1],chosen[0]],
      [chosen[2],chosen[0],chosen[1]],
      [chosen[1],chosen[2],chosen[0]]
    ].map(p=>p.map(x=>x[0]).join(" → ")).filter(x=>x!==answer);
    return escapeMcq(
      "SEQUENCE LOCK",
      "Which sequence places these events in chronological order, earliest to latest?",
      answer,
      permutations
    );
  },

  power_owner(){
    const c=rnd(escapeCharacters().filter(x=>x.powers?.length));
    const power=rnd(c.powers);
    const distractors=escapeOtherCharacters(
      c,
      x=>!x.powers?.some(p=>norm(p)===norm(power))
    ).map(x=>x.name);
    return escapeMcq(
      "CAPABILITY LOCK",
      `Which personnel file lists “${power}” as a capability?`,
      c.name,
      distractors
    );
  },

  affiliation_owner(){
    const c=rnd(escapeCharacters().filter(x=>x.aff?.length));
    const aff=rnd(c.aff);
    const distractors=escapeOtherCharacters(
      c,
      x=>!x.aff?.some(v=>norm(v)===norm(aff))
    ).map(x=>x.name);
    return escapeMcq(
      "AFFILIATION LOCK",
      `Which personnel file lists “${aff}” as an affiliation?`,
      c.name,
      distractors
    );
  },

  associate_owner(){
    const c=rnd(escapeCharacters().filter(x=>x.assoc?.length));
    const assoc=rnd(c.assoc);
    const distractors=escapeOtherCharacters(
      c,
      x=>!x.assoc?.some(v=>norm(v)===norm(assoc))
    ).map(x=>x.name);
    return escapeMcq(
      "ASSOCIATE LOCK",
      `Which personnel file lists ${assoc} as a known associate?`,
      c.name,
      distractors
    );
  },

  location_owner(){
    const c=rnd(escapeCharacters().filter(x=>x.loc?.length));
    const loc=rnd(c.loc);
    const distractors=escapeOtherCharacters(
      c,
      x=>!x.loc?.some(v=>norm(v)===norm(loc))
    ).map(x=>x.name);
    return escapeMcq(
      "LOCATION LOCK",
      `Which personnel file includes ${loc} as a location of interest?`,
      c.name,
      distractors
    );
  },

  species_lookup(){
    const c=rnd(escapeCharacters());
    return escapeMcq(
      "CLASSIFICATION LOCK",
      `Which classification is listed for ${c.name}?`,
      c.species,
      escapeCharacterFactPool("species").filter(x=>norm(x)!==norm(c.species))
    );
  },

  gear_lookup(){
    const c=rnd(escapeCharacters().filter(x=>x.gear?.length));
    const gear=rnd(c.gear);
    const distractors=escapeCharacterFactPool("gear").filter(x=>
      !c.gear.some(g=>norm(g)===norm(x))
    );
    return escapeMcq(
      "LOADOUT LOCK",
      `Which item appears in ${c.name}’s equipment record?`,
      gear,
      distractors
    );
  },

  gear_owner(){
    const c=rnd(escapeCharacters().filter(x=>x.gear?.length));
    const gear=rnd(c.gear);
    const distractors=escapeOtherCharacters(
      c,
      x=>!x.gear?.some(v=>norm(v)===norm(gear))
    ).map(x=>x.name);
    return escapeMcq(
      "EQUIPMENT LOCK",
      `Which personnel file lists “${gear}” in its equipment record?`,
      c.name,
      distractors
    );
  },

  debut_year(){
    const c=rnd(escapeCharacters());
    return escapeNumber(
      "ARCHIVE DATE LOCK",
      `Which year is listed as ${c.name}’s first MCU appearance?`,
      c.year
    );
  },

  compound_identity(){
    const c=rnd(escapeCharacters().filter(x=>x.aff?.length&&x.loc?.length));
    const aff=rnd(c.aff),loc=rnd(c.loc);
    return escapeMcq(
      "CROSS-REFERENCE LOCK",
      `Identify the person matching this file. Classification: ${c.species}. Affiliation: ${aff}. Location of interest: ${loc}. First MCU appearance: ${c.year}.`,
      c.name,
      escapeOtherCharacters(c).map(x=>x.name)
    );
  },

  typed_identity(){
    const c=rnd(escapeCharacters().filter(x=>x.assoc?.length&&x.loc?.length));
    return escapeTyped(
      "LEVEL 7 IDENTITY LOCK",
      `Identify the person matching this file. Classification: ${c.species}. Known associate: ${rnd(c.assoc)}. Location of interest: ${rnd(c.loc)}. First MCU appearance: ${c.year}.`,
      [c.name,...(c.aliases||[])],
      "Enter a character name, alias or recognised nickname"
    );
  },

  typed_artifact(){
    const art=rnd(standardArtifacts.filter(a=>a.clues?.length>=2));
    const clues=sh(art.clues).slice(0,2);
    return escapeTyped(
      "LEVEL 7 ARTEFACT LOCK",
      `Identify the artefact matching both archive clues: “${clues[0]}” and “${clues[1]}”`,
      [art.name,...(art.aliases||[])],
      "Enter the artefact name"
    );
  },

  file_anomaly(){
    const c=rnd(escapeCharacters().filter(x=>x.aff?.length&&x.powers?.length&&x.loc?.length&&x.assoc?.length));
    const falseAssoc=rnd(escapeCharacterFactPool("assoc").filter(v=>!c.assoc.some(x=>norm(x)===norm(v))));
    if(!falseAssoc)return null;
    const correct=`Associate — ${falseAssoc}`;
    const trueFacts=[
      `Affiliation — ${rnd(c.aff)}`,
      `Capability — ${rnd(c.powers)}`,
      `Location — ${rnd(c.loc)}`
    ];
    return escapeMcq(
      "ANOMALY LOCK",
      `Which entry does NOT belong in ${c.name}’s personnel file?`,
      correct,
      trueFacts
    );
  },

  dossier_integrity(){
    const c=rnd(escapeCharacters().filter(x=>x.aff?.length&&x.powers?.length));
    const correct=`${c.name} · ${rnd(c.aff)} · ${rnd(c.powers)} · ${c.year}`;
    const others=sh(escapeOtherCharacters(c).filter(x=>x.aff?.length&&x.powers?.length)).slice(0,3);
    const falseRows=others.map(x=>{
      const wrongPower=rnd(
        escapeCharacters().filter(z=>z.name!==x.name&&z.powers?.length)
          .flatMap(z=>z.powers)
          .filter(power=>!x.powers.some(real=>norm(real)===norm(power)))
      );
      if(!wrongPower)return `${x.name} · INVALID RECORD · ${x.year}`;
      return `${x.name} · ${rnd(x.aff)} · ${wrongPower} · ${x.year}`;
    });
    return escapeMcq(
      "DOSSIER INTEGRITY",
      "Which personnel record is internally consistent?",
      correct,
      falseRows
    );
  }
};

const escapeDifficultyPools={
  recruit:["alias_identity","alias_reverse","artifact_clue","event_year","power_owner","affiliation_owner","species_lookup","gear_lookup","location_owner","debut_year"],
  agent:["alias_identity","artifact_clue","artifact_type","artifact_owner","event_year","event_first","event_last","event_middle","power_owner","affiliation_owner","associate_owner","location_owner","species_lookup","gear_lookup","gear_owner","debut_year","compound_identity"],
  expert:["artifact_clue","artifact_type","artifact_owner","event_first","event_last","event_middle","event_gap","event_sequence","power_owner","associate_owner","location_owner","gear_owner","debut_year","compound_identity","typed_identity","typed_artifact","file_anomaly","dossier_integrity"],
  level7:["event_middle","event_gap","event_sequence","associate_owner","gear_owner","compound_identity","typed_identity","typed_artifact","file_anomaly","dossier_integrity","artifact_owner","debut_year","power_owner","location_owner"]
};

function buildEscapePuzzles(diffKey,replay=false){
  const config=escapeDifficulties[diffKey]||escapeDifficulties.agent;
  escapeActiveCharacters=identityCharacterPool(diffKey,replay?0:adaptiveQuestionBias("escape"));
  const source=escapeDifficultyPools[diffKey]||escapeDifficultyPools.agent;
  const puzzles=[];
  let available=sh(source);

  for(let safety=0;puzzles.length<config.locks&&safety<300;safety++){
    if(!available.length)available=sh(source);
    const id=available.pop();
    const builder=escapeQuestionBuilders[id];
    if(!builder)continue;

    let puzzle=null;
    try{puzzle=builder()}catch(error){console.warn("Escape lock generation failed",id,error)}
    if(!puzzle)continue;

    puzzle.kind=id;
    const validation=validateEscapePuzzle(puzzle);
    if(!validation.ok){console.warn("Discarded invalid Escape lock",id,validation.reason);continue}
    puzzles.push(puzzle);
  }

  if(puzzles.length<config.locks){
    throw new Error("Unable to assemble enough valid Escape Protocol locks.");
  }

  return puzzles;
}

function escapeGame(replayId=null){
  activeScreen="escape";
  const replay=typeof replayId==="string";
  const modeKeys=["recruit","agent","expert","level7"];
  let meta=resolvePuzzle("ESC",replay?replayId:null);
  let diffKey;

  if(replay){
    diffKey=modeKeys[meta.seed&3]||"agent";
  }else{
    diffKey=prog.escapeDifficulty||"agent";
    const modeIndex=Math.max(0,modeKeys.indexOf(diffKey));
    meta.seed=((meta.seed&~3)|modeIndex)>>>0;
  }

  const config=escapeDifficulties[diffKey]||escapeDifficulties.agent;
  let seed=meta.seed,generated=null;
  for(let tries=0;tries<25;tries++){
    try{
      generated=withPuzzleSeed(seed,()=>({theme:rnd(themes),puzzles:buildEscapePuzzles(diffKey,replay)}));
      if(generated?.puzzles?.length===config.locks)break;
    }catch(error){console.warn("Escape seed rejected",seed,error)}
    if(replay)break;
    seed=((seed+4)>>>0)||4;
  }

  if(!generated?.puzzles?.length){
    screen.innerHTML=`<section class="mission"><p class="eyebrow">ESCAPE PROTOCOL</p><h1>Room generation failed.</h1><p>This Puzzle ID could not produce a fully validated room.</p><button class="btn" id="escapeFailBack">Terminal</button></section>`;
    document.getElementById("escapeFailBack").onclick=home;return;
  }

  setCurrentPuzzle("ESC",seed);
  prog.games++;
  save();
  const startedAt=Date.now();
  const {theme,puzzles}=generated;
  let i=0,mistakes=0;

  function answerCorrect(p,input){
    const accepted=p.answers?.length?p.answers:[p.a];
    if(accepted.some(answer=>norm(answer)===norm(input)))return true;
    return accepted.some(answer=>{const character=characterProfileByAnyName(answer);return character?characterAnswerAccepted(character,input,escapeCharacters()):false});
  }

  async function finish(){
    const base=Math.max(Math.round(config.baseXp*0.25),config.baseXp-(mistakes*config.penalty));
    const gain=awardXp(base,"escape");
    prog.xp+=gain;prog.rooms++;
    recordGameResult("escape",{xp:gain,durationMs:Date.now()-startedAt,errors:mistakes,score:puzzles.length});
    rollPostGamePowerup("escape");await save();

    screen.innerHTML=`<section class="mission">
      <div class="row" style="justify-content:flex-end">${puzzleIdInline()}</div>
      <p class="eyebrow">ROOM CLEARED · ${esc(config.name.toUpperCase())}</p>
      <h1>${esc(theme)} cleared.</h1>
      <p>${puzzles.length} locks cleared · ${mistakes} error${mistakes===1?"":"s"}.</p>
      <div class="reward">+${gain} XP</div>
      <div class="row"><button class="btn primary" id="escapeAgain">Generate another ${esc(config.name)} room</button><button class="btn" id="escapeChange">Change difficulty</button><button class="btn" id="escapeHome">Terminal</button></div>
    </section>`;
    document.getElementById("escapeAgain").onclick=()=>escapeGame();document.getElementById("escapeChange").onclick=escapeDifficultyMenu;document.getElementById("escapeHome").onclick=home;
  }

  function render(msg=""){
    if(i>=puzzles.length){finish();return}
    const p=puzzles[i];let input="";
    if(p.mode==="mcq")input=`<div class="choices">${p.o.map(x=>`<button class="choice" data-escape-answer="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
    else input=`<form class="form" id="escapeForm"><input id="escapeInput" ${p.mode==="number"?'inputmode="numeric"':""} placeholder="${esc(p.placeholder||"Enter answer")}" autocomplete="off" required><button class="btn primary">Unlock</button></form>`;
    const remaining=puzzles.length-i;
    screen.innerHTML=`<div class="missionhead"><button class="back" id="escapeBack">← Terminal</button><div><p class="eyebrow">ESCAPE PROTOCOL · ${esc(config.name.toUpperCase())} · ${esc(theme)}</p><h1>Lock ${i+1} of ${puzzles.length}</h1></div><div><div class="reward">${remaining} LOCK${remaining===1?"":"S"} REMAINING</div>${puzzleIdInline()}</div></div>
    <section class="mission"><div class="notice"><strong>${esc(p.label||"SECURITY LOCK")}</strong> · Errors: ${mistakes}</div><h2>${esc(p.q)}</h2>${input}<p class="feedback" id="escapeFeedback">${esc(msg)}</p></section>`;
    document.getElementById("escapeBack").onclick=home;
    async function check(value){if(answerCorrect(p,value)){i++;render("LOCK CLEARED")}else{mistakes++;document.getElementById("escapeFeedback").textContent=`ACCESS DENIED · ${config.penalty} base XP will be deducted from the final room reward. Try again.`}}
    document.querySelectorAll("[data-escape-answer]").forEach(button=>button.onclick=()=>check(button.dataset.escapeAnswer));
    const form=document.getElementById("escapeForm");if(form)form.onsubmit=e=>{e.preventDefault();check(document.getElementById("escapeInput").value)};
  }
  render();
}

function buildClues(c,key){
 const all={
   species:`CLASSIFICATION: Species — ${c.species}`,
   affiliation:`AFFILIATION: Records connect the subject to ${rnd(c.aff)}.`,
   associate:`KNOWN ASSOCIATE: ${rnd(c.assoc)}.`,
   power:`CAPABILITY: ${rnd(c.powers)}.`,
   location:`LOCATION OF INTEREST: ${rnd(c.loc)}.`,
   year:`FIRST MCU APPEARANCE YEAR: ${c.year}.`,
   equipment:`EQUIPMENT PROFILE: The subject is associated with ${c.safeGear}.`,
   quote:c.quote?`ARCHIVED DIALOGUE: “${c.quote}”`:null
 };

 let keys=
   key==="recruit" ? ["species","affiliation","power","equipment"] :
   key==="agent" ? ["year","associate","location","power"] :
   key==="expert" ? ["quote","location","associate","equipment"] :
                    ["quote","location","year","associate"];

 let first=keys.map(k=>all[k]).filter(Boolean);
 const fallback=sh(Object.values(all).filter(Boolean));

 for(const clue of fallback){
   if(first.length>=4)break;
   if(!first.includes(clue))first.push(clue);
 }

 first=sh(first.slice(0,4));
 return [...first,`FINAL LIFELINE: ${c.finalEasy}`];
}


function identityCharacterPool(mode,bias=0){
  const modes=["recruit","agent","expert","level7"];
  const index=Math.max(0,modes.indexOf(mode));
  const effective=modes[Math.max(0,Math.min(modes.length-1,index+Math.sign(Number(bias)||0)))]||mode;
  const weights={
    recruit:{1:8,2:1,3:0,4:0},
    agent:{1:4,2:5,3:2,4:0},
    expert:{1:1,2:3,3:6,4:3},
    level7:{1:1,2:1,3:4,4:9}
  }[effective]||{1:4,2:4,3:2,4:1};

  const pool=[];
  for(const character of characters){
    const tier=Math.max(1,Math.min(4,Number(character.identityTier)||1));
    const copies=Math.max(0,weights[tier]||0);
    for(let i=0;i<copies;i++)pool.push(character);
  }
  return pool.length?pool:characters;
}

function guessGame(replayId=null){
 activeScreen="guess";
 prog.games++;
 save();

 const modeKeys=["recruit","agent","expert","level7"];
 let meta=resolvePuzzle("ID",typeof replayId==="string"?replayId:null);
 if(typeof replayId!=="string"){
   const modeIndex=Math.max(0,modeKeys.indexOf(prog.difficulty));
   meta.seed=((meta.seed&~3)|modeIndex)>>>0;
 }
 const mode=modeKeys[meta.seed&3]||"agent";
 if(typeof replayId==="string")prog.difficulty=mode;

 let seed=meta.seed,generated=null;
 const recentSet=new Set(prog.recent||[]);
 for(let tries=0;tries<24;tries++){
   generated=withPuzzleSeed(seed,()=>{
     const pool=identityCharacterPool(mode,typeof replayId==="string"?0:adaptiveQuestionBias("identity"));
     const c=pool[Math.floor(Math.random()*pool.length)];
     return {c,clues:buildClues(c,mode)};
   });
   if(typeof replayId==="string"||!recentSet.has(generated.c.name))break;
   seed=(seed+4)>>>0;
 }
 setCurrentPuzzle("ID",seed);

 const c=generated.c;
 const d=difficulties[mode];
 const clues=generated.clues;
 const questionLead=nextIdentityPrompt(c,seed);
 const roundStartedAt=Date.now();
 let n=1,done=false;

 function pts(){
   if(n>=clues.length)return 0;
   return d.points[Math.min(n-1,d.points.length-1)];
 }

 function render(msg=""){
   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS · ${d.name.toUpperCase()}</p><h1>Unknown subject</h1></div><div class="reward">STREAK ${prog.streak}</div></div>
   <section class="mission">
   <div class="row" style="justify-content:space-between;align-items:center;gap:12px"><strong>${esc(questionLead)}</strong>${puzzleIdInline()}</div>
   <div class="reward" style="margin-top:10px">${n>=clues.length?"FINAL LIFELINE · 0 XP":`${pts()} points · ${d.multiplier}× XP`}</div>
   <div class="clues">${clues.map((x,i)=>`<div class="clue ${i<n?"":"hidden"}"><span>${i===4?"FINAL CLUE":`CLUE ${i+1}`}</span><div>${i<n?esc(x):"████████████████"}</div></div>`).join("")}</div>
   <form class="form" id="gf"><input id="gi" placeholder="Character name, alias or recognised nickname" autocomplete="off" ${done?"disabled":""} required><button class="btn primary" ${done?"disabled":""}>Submit</button></form>
   <div class="row"><button class="btn" id="more" ${n>=5||done?"disabled":""}>Reveal another clue</button>${done?'<button class="btn primary" id="next">Next subject</button><button class="btn" id="change">Change difficulty</button>':""}</div>
   <p class="feedback" id="fb">${esc(msg)}</p></section>`;

   document.getElementById("b").onclick=home;
   document.getElementById("more").onclick=()=>{n=Math.min(5,n+1);render()};

   if(done){
     document.getElementById("next").onclick=()=>guessGame();
     document.getElementById("change").onclick=difficultyMenu;
   }

   document.getElementById("gf").onsubmit=async e=>{
     e.preventDefault();
     if(done)return;

     const a=document.getElementById("gi").value;
     const ok=characterAnswerAccepted(c,a,characters);

     if(ok){
       done=true;
       const baseGain=n>=clues.length?0:Math.round(pts()*8*d.multiplier);
       const gain=awardXp(baseGain,"identity");
       prog.xp+=gain;
       prog.guessed++;
       prog.streak++;
       prog.best=Math.max(prog.best,prog.streak);
       prog.recent=[...prog.recent,c.name].slice(-14);
       recordGameResult("identity",{xp:gain,durationMs:Date.now()-roundStartedAt,score:prog.streak});
       rollPostGamePowerup("identity");
       await save();
       render(gain>0?`IDENTITY CONFIRMED: ${c.name} · +${gain} XP`:`IDENTITY CONFIRMED: ${c.name} · final lifeline used, so +0 XP`);
     }else{
       prog.streak=0;
       adaptiveFailure("identity");
       await save();
       if(n>=5){
         done=true;
         rollPostGamePowerup("identity");
         await save();

function artifactGame(replayId=null){
 activeScreen="artifact";
 prog.games++;
 save();

 let meta=resolvePuzzle("ART",typeof replayId==="string"?replayId:null);
 let seed=meta.seed,artifact=null,format="progressive";
 const recent=new Set(prog.recentArtifacts||[]);

 for(let tries=0;tries<32;tries++){
   ({artifact,format}=withPuzzleSeed(seed,()=>{
     const picked=standardArtifacts[Math.floor(Math.random()*standardArtifacts.length)];
     const roll=Math.random(),bias=typeof replayId==="string"?0:adaptiveQuestionBias("artifact");
     const fmt=bias>0?(roll<0.20?"progressive":roll<0.40?"mcq":roll<0.85?"rapid":"association")
       :bias<0?(roll<0.46?"progressive":roll<0.82?"mcq":roll<0.92?"rapid":"association")
       :(roll<0.36?"progressive":roll<0.66?"mcq":roll<0.86?"rapid":"association");
     return {artifact:picked,format:fmt};
   }));
   if(typeof replayId==="string"||!recent.has(artifact.name))break;
   seed=(seed+1)>>>0;
 }

 setCurrentPuzzle("ART",seed);
 withPuzzleSeed(seed^0xA17F3C21,()=>{
   if(format==="progressive")artifactProgressive(artifact);
   else if(format==="mcq")artifactMcq(artifact);
   else if(format==="rapid")artifactRapid(artifact);
   else artifactAssociation(artifact);
 });
}

function artifactClueLeaksExactAnswer(artifact,clue){
  const clueNorm=norm(clue);
  if(!clueNorm)return true;

  const forbidden=[artifact.name,...(artifact.aliases||[])]
    .map(value=>norm(value))
    .filter(value=>value.length>=3);

  return forbidden.some(answer=>clueNorm.includes(answer));
}

function artifactSafeClues(artifact){
  const finalClue=String(artifact.easy||"").trim();
  const finalNorm=norm(finalClue);
  const safe=[];

  function add(clue){
    clue=String(clue||"").trim();
    if(!clue)return;
    if(finalNorm&&norm(clue)===finalNorm)return; // Never leak the final clue early.
    if(artifactClueLeaksExactAnswer(artifact,clue))return; // Never print the answer/alias early.
    if(safe.some(existing=>norm(existing)===norm(clue)))return;
    safe.push(clue);
  }

  for(const clue of artifact.clues||[])add(clue);

  // Metadata fallbacks make sure every object still has four pre-final clues
  // even if an old authored clue was effectively the final answer.
  add(`Archive classification: ${artifact.type}.`);
  if(artifact.owners?.length){
    add(`The archive links this object to ${artifact.owners.length===1?"one recorded owner":`${artifact.owners.length} recorded owners`}.`);
    add(`One recorded association is ${artifact.owners[0]}.`);
  }
  add(`Collection rarity classification: ${rarityForArtifact(artifact.name)}.`);
  add(`The archive records ${(artifact.aliases||[]).length} alternate designation${(artifact.aliases||[]).length===1?"":"s"} for this object.`);

  return safe.slice(0,4);
}

function artifactProgressiveClueSet(artifact){
  const finalClue=String(artifact.easy||`Final archive identification: ${artifact.name}.`);
  return [...artifactSafeClues(artifact),finalClue];
}

function quoteId(item){
 return norm(`${item.speaker}-${item.quote}`);
}

function quoteAccepted(item,answer){
 const accepted=[item.speaker,...(quoteAliases[item.speaker]||[])];
 if(accepted.some(name=>norm(name)===norm(answer)))return true;
 return characterAnswerAccepted(item.speaker,answer,characters);
}

function freshQuote(pool){
 const recentIds=new Set(prog.recentQuoteIds||[]);
 const recentItems=(prog.recentQuoteIds||[])
   .slice(-5)
   .map(id=>quoteBank.find(q=>quoteId(q)===id))
   .filter(Boolean);
 const recentSpeakers=new Set(recentItems.map(q=>q.speaker));

 let fresh=pool.filter(q=>!recentIds.has(quoteId(q))&&!recentSpeakers.has(q.speaker));
 if(!fresh.length)fresh=pool.filter(q=>!recentIds.has(quoteId(q)));
 if(!fresh.length)fresh=pool;

 return rnd(fresh);
}

function rememberQuote(item){
 prog.recentQuoteIds=[...(prog.recentQuoteIds||[]),quoteId(item)].slice(-24);
}

function quoteDistractors(item,mode){
 const allSpeakers=[...new Set(quoteBank.map(q=>q.speaker))].filter(name=>name!==item.speaker);
 const speakerGroups=quoteGroups[item.speaker]||[];
 let ordered=[];

 if(mode==="expert"||mode==="agent"){
   ordered.push(...sh(allSpeakers.filter(name=>{
     const groups=quoteGroups[name]||[];
     return groups.some(group=>speakerGroups.includes(group));
   })));
 }

 ordered.push(...sh(allSpeakers));

 const unique=[];
 for(const name of ordered){
   if(!unique.includes(name))unique.push(name);
   if(unique.length>=3)break;
 }
 return unique;
}

function quoteGame(mode="agent",replayId=null){
 activeScreen="quote";
 prog.games++;
 save();

 const modeKeys=["recruit","agent","expert"];
 let meta=resolvePuzzle("QUOTE",typeof replayId==="string"?replayId:null);
 if(typeof replayId!=="string"){
   const modeIndex=Math.max(0,modeKeys.indexOf(mode));
   meta.seed=((meta.seed&~3)|modeIndex)>>>0;
 }else mode=modeKeys[meta.seed&3]||"agent";

 const cfg={
   recruit:{mult:1,tiers:["recruit","agent"],typedChance:.20},
   agent:{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48},
   expert:{mult:2,tiers:["agent","expert"],typedChance:.68}
 }[mode]||{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48};

 const quoteBias=typeof replayId==="string"?0:adaptiveQuestionBias("quote");
 const adaptiveTiers=quoteBias>0?(mode==="expert"?["expert"]:["agent","expert"]):quoteBias<0?["recruit","agent"]:cfg.tiers;
 const pool=quoteBank.filter(q=>adaptiveTiers.includes(q.tier));
 const recentIds=new Set(prog.recentQuoteIds||[]);
 const recentSpeakers=new Set((prog.recentQuoteIds||[]).slice(-5).map(id=>quoteBank.find(q=>quoteId(q)===id)?.speaker).filter(Boolean));
 let seed=meta.seed,item=null,initialTyped=false,distractors=[],choices=[];

 for(let tries=0;tries<40;tries++){
   ({item,initialTyped,distractors,choices}=withPuzzleSeed(seed,()=>{
     const picked=pool[Math.floor(Math.random()*pool.length)]||quoteBank[0];
     const typed=Math.random()<cfg.typedChance;
     const ds=quoteDistractors(picked,mode);
     return {item:picked,initialTyped:typed,distractors:ds,choices:sh([picked.speaker,...ds])};
   }));
   const acceptable=typeof replayId==="string"||(!recentIds.has(quoteId(item))&&!recentSpeakers.has(item.speaker))||tries>24;
   if(acceptable)break;
   seed=(seed+4)>>>0;
 }

 setCurrentPuzzle("QUOTE",seed);
 const questionLead=nextQuotePrompt(item,seed);
 const roundStartedAt=Date.now();
 const choiceValidation=validateMcqContent(item.speaker,choices);
 if(!choiceValidation.ok)console.warn("Quote MCQ validation failed",choiceValidation.reason);

 let answerType=initialTyped?"typed":"mcq";
 let converted=false;
 let answered=false;

 function reward(){
   if(answerType==="typed"&&!converted)return Math.round(85*cfg.mult);
   return Math.round(55*cfg.mult);
 }

 function render(msg=""){
   const answerUi=answerType==="typed"
     ? `<form class="form" id="quoteTypedForm"><input id="quoteTypedInput" placeholder="Type the character name, alias or recognised nickname" autocomplete="off" ${answered?"disabled":""} required><button class="btn primary" ${answered?"disabled":""}>Submit</button></form><div class="row"><button class="btn" id="convertQuote" ${answered?"disabled":""}>Show MCQ instead · lower XP</button></div>`
     : `<div class="choices">${choices.map(name=>`<button class="choice" data-quote-answer="${esc(name)}" ${answered?"disabled":""}>${esc(name)}</button>`).join("")}</div>`;

   screen.innerHTML=`<div class="missionhead"><button class="back" id="qback">← Terminal</button><div><p class="eyebrow">WHO SAID IT? · ${mode.toUpperCase()} · ${answerType==="typed"?"TYPE-IN":"MCQ"}</p><h1>${esc(questionLead)}</h1></div><div class="reward">STREAK ${prog.quoteStreak||0} · +${reward()} XP</div></div>
   <section class="mission"><div class="row" style="justify-content:flex-end">${puzzleIdInline()}</div><div class="quote-box"><blockquote>“${esc(item.quote)}”</blockquote><small>ARCHIVED MCU DIALOGUE</small></div>${answerUi}<div class="row">${answered?'<button class="btn primary" id="qn">Next quote</button><button class="btn" id="qc">Change difficulty</button>':""}</div><p class="feedback" id="qfeedback">${esc(msg)}</p></section>`;

   document.getElementById("qback").onclick=home;

   async function finish(correct){
     if(answered)return;
     answered=true;
     rememberQuote(item);
     if(correct){
       const gain=awardXp(reward(),"quote");
       prog.xp+=gain;
       prog.quotesIdentified=(prog.quotesIdentified||0)+1;
       prog.quoteStreak=(prog.quoteStreak||0)+1;
       prog.bestQuoteStreak=Math.max(prog.bestQuoteStreak||0,prog.quoteStreak);
       recordGameResult("quote",{xp:gain,durationMs:Date.now()-roundStartedAt,score:prog.quoteStreak});
       rollPostGamePowerup("quote");
       await save();
       render(`CORRECT: ${item.speaker} · +${gain} XP`);
     }else{
       prog.quoteStreak=0;adaptiveFailure("quote");rollPostGamePowerup("quote");await save();render(`INCORRECT · ${item.speaker} said it.`);
     }
   }

   if(answerType==="typed"){
     document.getElementById("quoteTypedForm").onsubmit=e=>{e.preventDefault();finish(quoteAccepted(item,document.getElementById("quoteTypedInput").value))};
     document.getElementById("convertQuote").onclick=()=>{answerType="mcq";converted=true;render("MCQ assistance enabled. Reward reduced.")};
   }else document.querySelectorAll("[data-quote-answer]").forEach(button=>button.onclick=()=>finish(button.dataset.quoteAnswer===item.speaker));

   if(answered){document.getElementById("qn").onclick=()=>quoteGame(mode);document.getElementById("qc").onclick=quoteDifficultyMenu}
 }
 render();
}

const MCU_ROSTER_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/characters.json";
const MCU_MOVIES_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/movies.json";
const MCU_TV_URL="https://cdn.jsdelivr.net/gh/AugustoMarcelo/mcuapi@master/data/tvshows.json";

let fullGridRosterLoaded=false;
let fullGridRosterLoading=null;
let fullGridRosterError=false;
let fullGridRosterCount=gridProfiles.length;
let fullMcuMovies=[];
let fullMcuShows=[];
const gridDynamicCategoryTags=new Set();

function allProfileNames(profile){
  return [profile.name,...(profile.aliases||[])].map(norm).filter(Boolean);
}

function remoteRecordMatchesProfile(record,profile){
  const remoteNames=[record.name,record.alias].filter(Boolean).map(norm);
  const localNames=allProfileNames(profile);
  return remoteNames.some(name=>localNames.includes(name));
}

function addTag(tags,tag){
  if(tag)tags.add(tag);
}

function gridSlug(value){
  return String(value||"")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,48);
}

function deriveDescriptionTags(record){
  const tags=new Set();
  const d=String(record.description||"").toLowerCase();
  const alias=String(record.alias||"").toLowerCase();
  const name=String(record.name||"").toLowerCase();
  const all=`${name} ${alias} ${d}`;

  if(/\bavenger\b|\bavengers\b/.test(all))addTag(tags,"avenger");
  if(/guardian of the galaxy|guardians of the galaxy|\bguardian\b/.test(all))addTag(tags,"guardian");
  if(/wakanda|wakandan/.test(all))addTag(tags,"wakandan");
  if(/s\.?h\.?i\.?e\.?l\.?d/.test(all))addTag(tags,"shield");
  if(/\bhydra\b/.test(all))addTag(tags,"hydra");
  if(/\btva\b|time variance authority/.test(all))addTag(tags,"tva");
  if(/master[s]? of the mystic arts|sorcerer supreme|mystic arts/.test(all))addTag(tags,"mystic");
  if(/\bvillain\b|\bantagonist\b|\bcriminal\b|\bwarlord\b|\bterrorist\b/.test(all))addTag(tags,"villain");
  if(/former villain|former antagonist|redeemed/.test(all))addTag(tags,"formerVillain");
  if(/\bspy\b|intelligence operative|secret agent|assassin/.test(all))addTag(tags,"spy");
  if(/\bscientist\b|\bphysicist\b|\bengineer\b|\binventor\b|\bresearcher\b/.test(all))addTag(tags,"scientist");
  if(/red room/.test(all))addTag(tags,"redRoom");
  if(/asgardian|asgard/.test(all)){addTag(tags,"asgardian");addTag(tags,"alien");}
  if(/\bking\b|\bqueen\b|\bprince\b|\bprincess\b|\broyal\b|\bruler\b|\bmonarch\b/.test(all))addTag(tags,"royalty");
  if(/\bmagic\b|\bwitch\b|\bsorcerer\b|\bsorceress\b|\bwarlock\b|\bmystical\b/.test(all))addTag(tags,"magic");
  if(/\bsorcerer\b|\bsorceress\b|sorcerer supreme/.test(all))addTag(tags,"sorcerer");
  if(/super soldier|enhanced|mutant|inhuman|superhuman|experiment/.test(all))addTag(tags,"enhanced");
  if(/superhuman strength|super strength|incredible strength|enhanced strength|immense strength/.test(all))addTag(tags,"superStrength");
  if(/\bflies\b|\bflight\b|\bflying\b|\bwings\b|\bwinged\b/.test(all))addTag(tags,"fly");
  if(/technology|technological|armor|armour|robot|android|synthezoid|cyborg|mechanical|powered suit/.test(all))addTag(tags,"tech");
  if(/\balien\b|\bkree\b|\bskrull\b|\beternal\b|\bcelestial\b|frost giant|dark elf|titan|xandarian|sovereign/.test(all))addTag(tags,"alien");
  if(/\barcher\b|\bbow\b/.test(all))addTag(tags,"archer");
  if(/young hero|teenage hero|teenager|student/.test(all))addTag(tags,"young");

  return tags;
}

function firstReleasedProjectFor(record,moviesById,showsById){
  const movie=record.first_appearance_movie_id?moviesById.get(Number(record.first_appearance_movie_id)):null;
  const show=record.first_appearance_tvshow_id?showsById.get(Number(record.first_appearance_tvshow_id)):null;

  if(movie&&show){
    const md=movie.release_date||"9999-12-31";
    const sd=show.release_date||"9999-12-31";
    return md<=sd?movie:show;
  }
  return movie||show||null;
}

function projectIsReleased(project){
  if(!project||!project.release_date)return false;
  const release=new Date(`${project.release_date}T00:00:00Z`).getTime();
  return Number.isFinite(release)&&release<=Date.now();
}

function deriveProjectTags(project){
  const tags=new Set();
  if(!project)return tags;

  const phase=Number(project.phase);
  if(phase>=1&&phase<=6)addTag(tags,`debutPhase${phase}`);

  if(project.type==="movie"){
    addTag(tags,"debutMovie");
  }else{
    addTag(tags,"debutSeries");
  }

  const title=String(project.title||"");
  const slug=gridSlug(title);
  if(slug){
    const projectTag=`debutProject-${slug}`;
    addTag(tags,projectTag);
    gridDynamicCategoryTags.add(projectTag);
    gridCategoryMap[projectTag]=`Introduced in ${title}`;
  }

  const t=title.toLowerCase();
  if(t.includes("iron man"))addTag(tags,"ironManFranchise");
  if(t.includes("thor"))addTag(tags,"thorFranchise");
  if(t.includes("captain america"))addTag(tags,"captainAmericaFranchise");
  if(t.includes("avengers"))addTag(tags,"avengersFranchise");
  if(t.includes("guardians of the galaxy"))addTag(tags,"guardiansFranchise");
  if(t.includes("ant-man"))addTag(tags,"antManFranchise");
  if(t.includes("doctor strange"))addTag(tags,"doctorStrangeFranchise");
  if(t.includes("spider-man"))addTag(tags,"spiderManFranchise");
  if(t.includes("black panther"))addTag(tags,"blackPantherFranchise");
  if(t.includes("captain marvel")||t==="the marvels")addTag(tags,"captainMarvelFranchise");
  if(t.includes("deadpool"))addTag(tags,"deadpoolFranchise");
  if(t.includes("fantastic four"))addTag(tags,"fantasticFourFranchise");

  return tags;
}


function gridProjectMeta(project){
  if(!project)return null;
  return {
    id:Number(project.id)||0,
    title:String(project.title||""),
    type:String(project.type||""),
    phase:Number(project.phase)||0,
    release_date:String(project.release_date||"")
  };
}

function earlierGridProjectMeta(a,b){
  if(!a)return b||null;
  if(!b)return a;
  const ad=a.release_date||"9999-12-31";
  const bd=b.release_date||"9999-12-31";
  return bd<ad?b:a;
}

const gridDebutFranchiseTags=[
  "ironManFranchise","thorFranchise","captainAmericaFranchise","avengersFranchise",
  "guardiansFranchise","antManFranchise","doctorStrangeFranchise","spiderManFranchise",
  "blackPantherFranchise","captainMarvelFranchise","deadpoolFranchise","fantasticFourFranchise"
];

function rebuildCanonicalDebutTags(){
  for(const profile of gridProfiles){
    const meta=profile.firstProjectMeta;
    if(!meta)continue;

    // Remove every old/merged "introduced in..." tag first.
    profile.tags=(profile.tags||[]).filter(tag=>
      !/^debutPhase[1-6]$/.test(tag) &&
      tag!=="debutMovie" &&
      tag!=="debutSeries" &&
      !tag.startsWith("debutProject-") &&
      !gridDebutFranchiseTags.includes(tag)
    );

    // Re-add introduction tags from exactly ONE canonical earliest project.
    profile.tags=[
      ...new Set([
        ...profile.tags,
        ...deriveProjectTags(meta)
      ])
    ];

    profile.firstProject=meta.title||profile.firstProject||"";

    // A character cannot have appeared in a phase before their debut phase.
    const debutPhase=Number(meta.phase)||0;
    if(debutPhase>=1&&debutPhase<=6){
      profile.tags=profile.tags.filter(tag=>{
        const match=String(tag).match(/^phase([1-6])$/);
        return !match || Number(match[1])>=debutPhase;
      });
    }
  }
}

function mergeRemoteGridProfile(record,project){
  const existing=gridProfiles.find(profile=>remoteRecordMatchesProfile(record,profile));
  const derived=new Set([
    ...deriveDescriptionTags(record)
  ]);
  const meta=gridProjectMeta(project);

  if(existing){
    existing.tags=[...new Set([...(existing.tags||[]),...derived])];

    const aliases=new Set(existing.aliases||[]);
    if(record.alias&&norm(record.alias)!==norm(existing.name))aliases.add(record.alias);
    if(record.name&&norm(record.name)!==norm(existing.name))aliases.add(record.name);
    existing.aliases=[...aliases];

    if(!Array.isArray(existing.remoteIds))existing.remoteIds=[];
    if(existing.remoteId!=null&&!existing.remoteIds.includes(existing.remoteId))existing.remoteIds.push(existing.remoteId);
    if(record.id!=null&&!existing.remoteIds.includes(record.id))existing.remoteIds.push(record.id);
    if(existing.remoteId==null)existing.remoteId=record.id;

    existing.description=[existing.description,record.description].filter(Boolean).join(" ");
    existing.firstProjectMeta=earlierGridProjectMeta(existing.firstProjectMeta,meta);
    existing.firstProject=existing.firstProjectMeta?.title||existing.firstProject||"";
    return existing;
  }

  const aliases=[];
  if(record.alias&&norm(record.alias)!==norm(record.name))aliases.push(record.alias);

  const profile={
    name:record.name,
    aliases,
    tags:[...derived],
    remoteId:record.id,
    remoteIds:record.id!=null?[record.id]:[],
    description:record.description||"",
    firstProjectMeta:meta,
    firstProject:meta?.title||""
  };
  gridProfiles.push(profile);
  return profile;
}

function refreshDynamicGridPools(){
  const counts=new Map();
  for(const profile of gridProfiles){
    for(const tag of profile.tags||[]){
      counts.set(tag,(counts.get(tag)||0)+1);
    }
  }

  // Only use debut-project categories with enough characters to make
  // interesting, solvable intersections rather than ultra-narrow boards.
  const projectTags=[...gridDynamicCategoryTags]
    .filter(tag=>(counts.get(tag)||0)>=4);

  for(const tag of projectTags){
    if(!gridRowPool.includes(tag))gridRowPool.push(tag);
  }
}

async function loadFullGridRoster(){
  if(fullGridRosterLoaded)return gridProfiles;
  if(fullGridRosterLoading)return fullGridRosterLoading;

  fullGridRosterLoading=(async()=>{
    try{
      const [charactersResponse,moviesResponse,tvResponse]=await Promise.all([
        fetch(MCU_ROSTER_URL,{cache:"no-store"}),
        fetch(MCU_MOVIES_URL,{cache:"no-store"}),
        fetch(MCU_TV_URL,{cache:"no-store"})
      ]);

      if(!charactersResponse.ok||!moviesResponse.ok||!tvResponse.ok){
        throw new Error("MCU roster source unavailable");
      }

      const [records,movies,shows]=await Promise.all([
        charactersResponse.json(),
        moviesResponse.json(),
        tvResponse.json()
      ]);

      fullMcuMovies=movies;
      fullMcuShows=shows;
      const moviesById=new Map(movies.map(item=>[Number(item.id),item]));
      const showsById=new Map(shows.map(item=>[Number(item.id),item]));

      for(const record of records){
        if(!record||!record.name)continue;
        const project=firstReleasedProjectFor(record,moviesById,showsById);

        // "Introduced so far" means the first appearance must actually
        // have released by the day the player opens the site.
        if(!projectIsReleased(project))continue;

        mergeRemoteGridProfile(record,project);
      }

      // Remove accidental duplicate canonical names while preserving aliases/tags.
      const merged=[];
      for(const profile of gridProfiles){
        const duplicate=merged.find(existing=>
          allProfileNames(existing).some(name=>allProfileNames(profile).includes(name))
        );
        if(!duplicate){
          merged.push(profile);
        }else{
          duplicate.tags=[...new Set([...(duplicate.tags||[]),...(profile.tags||[])])];
          duplicate.aliases=[...new Set([...(duplicate.aliases||[]),profile.name,...(profile.aliases||[])])]
            .filter(alias=>norm(alias)!==norm(duplicate.name));

          duplicate.firstProjectMeta=earlierGridProjectMeta(
            duplicate.firstProjectMeta,
            profile.firstProjectMeta
          );

          duplicate.remoteIds=[
            ...new Set([
              ...(duplicate.remoteIds||[duplicate.remoteId].filter(v=>v!=null)),
              ...(profile.remoteIds||[profile.remoteId].filter(v=>v!=null))
            ])
          ];

          if(duplicate.remoteId==null&&duplicate.remoteIds.length){
            duplicate.remoteId=duplicate.remoteIds[0];
          }
        }
      }
      gridProfiles=merged;

      rebuildCanonicalDebutTags();
      refreshDynamicGridPools();
      fullGridRosterCount=gridProfiles.length;
      fullGridRosterLoaded=true;
      fullGridRosterError=false;
      return gridProfiles;
    }catch(error){
      console.warn("Full MCU roster failed; using built-in Marvel Grid roster.",error);
      fullGridRosterError=true;
      fullGridRosterCount=gridProfiles.length;
      return gridProfiles;
    }finally{
      fullGridRosterLoading=null;
    }
  })();

  return fullGridRosterLoading;
}

function gridArchiveProject(projectKey){
  const archived=sixArchive?.projects?.[projectKey];
  if(!archived)return null;

  const source=archived.type==="movie"?fullMcuMovies:fullMcuShows;
  return (source||[]).find(project=>Number(project.id)===Number(archived.id))||archived;
}

function rebuildExactGridAppearancePhases(){
  if(!sixArchiveLooksValid(sixArchive))return false;

  const phaseTags=new Set(["phase1","phase2","phase3","phase4","phase5","phase6"]);

  for(const profile of gridProfiles){
    const ids=[
      ...(profile.remoteIds||[]),
      ...(profile.remoteId!=null?[profile.remoteId]:[])
    ].map(String);

    const projectKeys=new Set();
    for(const id of ids){
      for(const projectKey of sixArchive.filmographies?.[id]||[]){
        projectKeys.add(projectKey);
      }
    }

    // If the complete archive has no mapping for this record, keep its
    // curated/manual phase tags rather than inventing data.
    if(!projectKeys.size)continue;

    profile.tags=(profile.tags||[]).filter(tag=>!phaseTags.has(tag));

    for(const projectKey of projectKeys){
      const project=gridArchiveProject(projectKey);
      const phase=Number(project?.phase)||0;
      if(phase>=1&&phase<=6)profile.tags.push(`phase${phase}`);
    }

    profile.tags=[...new Set(profile.tags)];

    // Final chronology sanitation after exact appearance reconstruction.
    const debutPhase=Number(profile.firstProjectMeta?.phase)||0;
    if(debutPhase>=1&&debutPhase<=6){
      profile.tags=profile.tags.filter(tag=>{
        const match=String(tag).match(/^phase([1-6])$/);
        return !match || Number(match[1])>=debutPhase;
      });
    }
  }

  return true;
}

function gridPhaseFromTag(tag,prefix){
  const match=String(tag||"").match(new RegExp(`^${prefix}([1-6])$`));
  return match?Number(match[1]):null;
}

function gridSpecificDebutProjectMeta(tag){
  if(!String(tag||"").startsWith("debutProject-"))return null;
  const wanted=String(tag).slice("debutProject-".length);

  for(const project of [...(fullMcuMovies||[]),...(fullMcuShows||[])]){
    if(gridSlug(project.title)===wanted)return gridProjectMeta(project);
  }
  return null;
}

function gridDebutConstraint(tag){
  const phase=gridPhaseFromTag(tag,"debutPhase");
  if(phase)return {phase};

  if(tag==="debutMovie")return {type:"movie"};
  if(tag==="debutSeries")return {type:"tvshow"};

  const project=gridSpecificDebutProjectMeta(tag);
  if(project)return {
    phase:Number(project.phase)||0,
    type:project.type,
    projectId:Number(project.id)||0
  };

  return {};
}

function gridPairIsSemanticallyCompatible(rowTag,colTag){
  const a=gridDebutConstraint(rowTag);
  const b=gridDebutConstraint(colTag);

  // Two simultaneous introduction statements can never disagree.
  if(a.phase&&b.phase&&a.phase!==b.phase)return false;
  if(a.type&&b.type&&a.type!==b.type)return false;
  if(a.projectId&&b.projectId&&a.projectId!==b.projectId)return false;

  const debutPhase=a.phase||b.phase||null;
  const appearedPhase=
    gridPhaseFromTag(rowTag,"phase") ||
    gridPhaseFromTag(colTag,"phase");

  // Core rule: a character cannot appear before they are introduced.
  if(debutPhase&&appearedPhase&&appearedPhase<debutPhase)return false;

  return true;
}

function gridProfileCanSatisfy(profile,rowTag,colTag){
  if(!gridPairIsSemanticallyCompatible(rowTag,colTag))return false;
  if(!profile.tags.includes(rowTag)||!profile.tags.includes(colTag))return false;

  // Per-character chronology guard. Even if a bad tag ever slips into the
  // database later, it cannot make an impossible square appear valid.
  const debutPhase=Number(profile.firstProjectMeta?.phase)||0;
  const rowAppearance=gridPhaseFromTag(rowTag,"phase");
  const colAppearance=gridPhaseFromTag(colTag,"phase");
  const appearedPhase=rowAppearance||colAppearance||0;

  if(debutPhase&&appearedPhase&&appearedPhase<debutPhase)return false;

  return true;
}

function gridPuzzleHasNoContradictions(rows,cols){
  for(const row of rows){
    for(const col of cols){
      if(!gridPairIsSemanticallyCompatible(row,col))return false;
      if(gridCandidates(row,col).length<1)return false;
    }
  }
  return true;
}

const gridRowPool=["avenger","guardian","wakandan","shield","hydra","tva","mystic","villain","formerVillain","royalty","spy","scientist","redRoom","asgardian","young","debutPhase1","debutPhase2","debutPhase3","debutPhase4","debutPhase5","debutPhase6","debutMovie","debutSeries"];
const gridColPool=["tech","fly","superStrength","magic","sorcerer","enhanced","alien","phase1","phase2","phase3","phase4","phase5","phase6","disneyPlus","avengersMovie","captainAmericaMovie","spiderManMovie","guardiansMovie","foughtThanos","wasSnapped","survivedSnap","beenAvenger","space","wakanda","quantumRealm","usedInfinityStone","archer","ironManFranchise","thorFranchise","captainAmericaFranchise","avengersFranchise","guardiansFranchise","antManFranchise","doctorStrangeFranchise","spiderManFranchise","blackPantherFranchise","captainMarvelFranchise","deadpoolFranchise","fantasticFourFranchise"];

function gridCandidates(rowTag,colTag){
 if(!gridPairIsSemanticallyCompatible(rowTag,colTag))return [];
 return gridProfiles.filter(profile=>gridProfileCanSatisfy(profile,rowTag,colTag));
}

function gridHasDistinctSolution(rows,cols){
 const cells=[];
 for(let r=0;r<3;r++){
   for(let c=0;c<3;c++){
     const candidates=gridCandidates(rows[r],cols[c]);
     if(!candidates.length)return false;
     cells.push({r,c,candidates});
   }
 }

 cells.sort((a,b)=>a.candidates.length-b.candidates.length);
 const used=new Set();

 function backtrack(index){
   if(index>=cells.length)return true;
   for(const candidate of cells[index].candidates){
     if(used.has(candidate.name))continue;
     used.add(candidate.name);
     if(backtrack(index+1))return true;
     used.delete(candidate.name);
   }
   return false;
 }

 return backtrack(0);
}

function generateMarvelGrid(){
 for(let attempt=0;attempt<800;attempt++){
   const rows=sh(gridRowPool).slice(0,3);
   const cols=sh(gridColPool).slice(0,3);

   let reasonable=gridPuzzleHasNoContradictions(rows,cols);
   if(reasonable){
     for(const row of rows){
       for(const col of cols){
         const count=gridCandidates(row,col).length;
         if(count<1||count>14){reasonable=false;break;}
       }
       if(!reasonable)break;
     }
   }

   if(
     reasonable &&
     gridPuzzleHasNoContradictions(rows,cols) &&
     gridHasDistinctSolution(rows,cols)
   )return {rows,cols};
 }

 const fallback={rows:["avenger","guardian","villain"],cols:["phase3","tech","space"]};
 if(gridPuzzleHasNoContradictions(fallback.rows,fallback.cols)&&gridHasDistinctSolution(fallback.rows,fallback.cols)){
   return fallback;
 }

 // Emergency safe-search: never return a contradictory board.
 for(const r1 of gridRowPool){
   for(const r2 of gridRowPool){
     if(r2===r1)continue;
     for(const r3 of gridRowPool){
       if(r3===r1||r3===r2)continue;
       const rows=[r1,r2,r3];
       for(let attempt=0;attempt<500;attempt++){
         const cols=sh(gridColPool).slice(0,3);
         if(gridPuzzleHasNoContradictions(rows,cols)&&gridHasDistinctSolution(rows,cols)){
           return {rows,cols};
         }
       }
     }
   }
 }

 throw new Error("Unable to generate a contradiction-free Marvel Grid.");
}

function findGridProfile(answer){
 const needle=norm(answer);if(!needle)return null;
 // Prefer exact canonical/official alias matches first.
 const exact=gridProfiles.filter(profile=>norm(profile.name)===needle||(profile.aliases||[]).some(alias=>norm(alias)===needle));
 if(exact.length===1)return exact[0];
 if(exact.length>1){const canonical=exact.find(profile=>norm(profile.name)===needle);if(canonical)return canonical}
 // Then accept richer common-name/title variants only when they resolve uniquely.
 const matches=gridProfiles.filter(profile=>{
   const extra=CHARACTER_COMMON_NAMES[profile.name]||[];
   const forms=new Set();
   [profile.name,...(profile.aliases||[]),...extra].forEach(value=>expandCharacterNameForms(value).forEach(form=>forms.add(norm(form))));
   const parts=String(profile.name).replace(/[()]/g," ").trim().split(/\s+/).filter(Boolean);
   if(parts.length>=2){forms.add(norm(parts[0]));forms.add(norm(parts[parts.length-1]))}
   return forms.has(needle);
 });
 return matches.length===1?matches[0]:null;
}

async function marvelGridGame(replayId=null){
 activeScreen="grid";

 screen.innerHTML=loadingSkeletonMarkup("MARVEL GRID","Preparing personnel archive…","gridLoadingBack");
 document.getElementById("gridLoadingBack").onclick=home;

 await loadFullGridRoster();

 // Reuse the complete Six Degrees appearance archive to make phase categories
 // authoritative. If the archive is temporarily unavailable, the semantic
 // guards below still prevent chronologically impossible intersections.
 await loadSixArchive();
 rebuildExactGridAppearancePhases();
 rebuildCanonicalDebutTags();


 prog.games++;
 prog.gridPlayed=(prog.gridPlayed||0)+1;
 save();

 const meta=resolvePuzzle("GRID",typeof replayId==="string"?replayId:null);
 const puzzle=withPuzzleSeed(meta.seed,()=>generateMarvelGrid());
 const validation=validateGridGeneratedPuzzle(puzzle);
 if(!validation.ok){screen.innerHTML=`<section class="mission"><p class="eyebrow">MARVEL GRID</p><h1>Puzzle validation failed.</h1><p>${esc(validation.reason)}</p><button class="btn" id="gridInvalidBack">Terminal</button></section>`;document.getElementById("gridInvalidBack").onclick=home;return}
 setCurrentPuzzle("GRID",meta.seed);
 const startedAt=Date.now();
 let attempts=9;
 let points=0;
 let selectedCell=null;
 let finished=false;
 let gaveUp=false;
 const filled={};
 const usedNames=new Set();

 function cellKey(r,c){return `${r}-${c}`}

 function scoreXp(){
   return Number(((points/9)*10).toFixed(1));
 }

 function validExample(r,c){
   const used=new Set(Object.values(filled));
   return gridCandidates(puzzle.rows[r],puzzle.cols[c]).find(p=>!used.has(p.name)) ||
          gridCandidates(puzzle.rows[r],puzzle.cols[c])[0];
 }

 async function finishPuzzle(giveUp=false){
   if(finished)return;
   finished=true;
   gaveUp=giveUp;

   const baseXp=giveUp?0:scoreXp();
   const xp=giveUp?0:awardXp(baseXp,"grid");
   if(!giveUp){
     prog.xp+=xp;
     prog.gridPoints=(prog.gridPoints||0)+points;
     if(points===9)prog.gridPerfect=(prog.gridPerfect||0)+1;
     recordGameResult("grid",{xp,durationMs:Date.now()-startedAt,score:points});
     rollPostGamePowerup("grid");
   }
   await save();
   render();
 }

 function render(message=""){
   const headerCells=puzzle.cols.map(col=>`<div class="grid-head">${esc(gridCategoryMap[col])}</div>`).join("");
   let body="";

   for(let r=0;r<3;r++){
     body+=`<div class="grid-rowhead">${esc(gridCategoryMap[puzzle.rows[r]])}</div>`;
     for(let c=0;c<3;c++){
       const key=cellKey(r,c);
       const answer=filled[key];
       const selected=selectedCell&&selectedCell.r===r&&selectedCell.c===c;
       const reveal=finished&&!answer;
       const example=reveal?validExample(r,c):null;

       body+=`<button class="grid-cell ${answer?"filled":""} ${selected?"selected":""} ${reveal?"revealed":""}"
                     data-grid-cell="${r},${c}"
                     ${answer||finished?"disabled":""}
                     type="button">
         ${answer
           ? `<span class="cell-name">${esc(answer)}</span>`
           : reveal
             ? `<span><span class="cell-name">Unfilled</span><span class="cell-example">e.g. ${esc(example?.name||"No example")}</span></span>`
             : `<span class="cell-plus">+</span>`}
       </button>`;
     }
   }

   let entry="";
   if(!finished&&selectedCell){
     const rowLabel=gridCategoryMap[puzzle.rows[selectedCell.r]];
     const colLabel=gridCategoryMap[puzzle.cols[selectedCell.c]];

     entry=`<div class="grid-entry">
       <h3>${esc(rowLabel)} × ${esc(colLabel)}</h3>
       <p>Type a Marvel character who matches both categories. A valid character can only be used once on the board.</p>
       <form class="form" id="gridAnswerForm">
         <input id="gridAnswerInput" placeholder="Search character…" autocomplete="off" required>
         <button class="btn primary">Submit</button>
       </form>
       <div class="suggestions" id="gridSuggestions"></div>
     </div>`;
   }

   const result=finished
     ? `<div class="grid-results">
         <strong>${gaveUp?"PUZZLE GIVEN UP":points===9?"PERFECT GRID":"GRID COMPLETE"}</strong>
         <p>${points}/9 points · ${gaveUp?"0":scoreXp()} XP earned</p>
         <div class="row"><button class="btn primary" id="newGrid">New puzzle</button><button class="btn" id="gridHome">Terminal</button></div>
       </div>`
     : "";

   screen.innerHTML=`<div class="missionhead">
     <button class="back" id="gridBack">← Terminal</button>
     <div><p class="eyebrow">MARVEL GRID</p><h1>3×3 personnel matrix</h1></div><div>${puzzleIdInline()}</div>
   </div>

   <section class="mission" style="max-width:1000px">
     <div class="notice">
       Fill each cell with a character matching both its row and column. You get exactly 9 attempts.
       Characters cannot be reused. The roster automatically loads released MCU character records and excludes future debuts.
     </div>

     <div class="grid-status">
       <span class="grid-chip"><strong>${points}/9</strong> points</span>
       <span class="grid-chip"><strong>${attempts}</strong> attempts left</span>
       <span class="grid-chip">Current XP if finished: <strong>${scoreXp()}</strong></span>
       <span class="grid-chip">Roster: <strong>${fullGridRosterCount}</strong> released characters${fullGridRosterError?" · cached fallback":""}</span>
     </div>

     <div class="marvel-grid-wrap">
       <div class="marvel-grid">
         <div class="grid-corner">ROW × COLUMN</div>
         ${headerCells}
         ${body}
       </div>
     </div>

     ${entry}

     ${!finished?`<div class="row">
       <button class="btn" id="giveUpGrid">Give up · 0 XP</button>
       <button class="btn" id="newGridEarly">New puzzle · forfeits current puzzle</button>
     </div>`:""}

     <p class="feedback" id="gridFeedback">${esc(message)}</p>
     ${result}
   </section>`;

   document.getElementById("gridBack").onclick=home;

   document.querySelectorAll("[data-grid-cell]").forEach(button=>{
     button.onclick=()=>{
       const [r,c]=button.dataset.gridCell.split(",").map(Number);
       selectedCell={r,c};
       render();
       const input=document.getElementById("gridAnswerInput");
       if(input)input.focus();
     };
   });

   if(!finished&&selectedCell){
     const input=document.getElementById("gridAnswerInput");
     const suggestions=document.getElementById("gridSuggestions");

     function refreshSuggestions(){
       const query=norm(input.value);
       if(!query){suggestions.innerHTML="";return;}

       const matches=gridProfiles
         .filter(profile=>!usedNames.has(profile.name))
         .filter(profile=>
           norm(profile.name).includes(query) ||
           (profile.aliases||[]).some(alias=>norm(alias).includes(query))
         )
         .sort((a,b)=>{
           const an=norm(a.name),bn=norm(b.name);
           const aStarts=an.startsWith(query)?0:1;
           const bStarts=bn.startsWith(query)?0:1;
           return aStarts-bStarts || a.name.localeCompare(b.name);
         })
         .slice(0,14);

       suggestions.innerHTML=matches.map(profile=>`<button class="suggestion" data-grid-suggestion="${esc(profile.name)}" type="button">
         <strong>${esc(profile.name)}</strong>
         <small>${esc((profile.aliases||[]).slice(0,2).join(" · "))}</small>
       </button>`).join("");

       document.querySelectorAll("[data-grid-suggestion]").forEach(button=>{
         button.onclick=()=>{
           input.value=button.dataset.gridSuggestion;
           suggestions.innerHTML="";
         };
       });
     }

     input.addEventListener("input",refreshSuggestions);

     document.getElementById("gridAnswerForm").onsubmit=async event=>{
       event.preventDefault();
       if(finished||attempts<=0)return;

       const profile=findGridProfile(input.value);
       if(!profile){
         document.getElementById("gridFeedback").textContent="That character is not in the Marvel Grid database. Choose a suggested character.";
         return;
       }

       if(usedNames.has(profile.name)){
         document.getElementById("gridFeedback").textContent=`${profile.name} has already been used on this grid.`;
         return;
       }

       const rowTag=puzzle.rows[selectedCell.r];
       const colTag=puzzle.cols[selectedCell.c];
       const validAnswer=profile.tags.includes(rowTag)&&profile.tags.includes(colTag);

       let shieldUsed=false;
       if(!validAnswer&&((isAdmin()&&prog.adminInfiniteGridShield)||hasActivePowerup("grid_reality_anchor"))){
         shieldUsed=true;
       }else if(!validAnswer&&!hasGameModifier("no_safety_net")&&prog.gridShieldCharges>0){
         prog.gridShieldCharges--;
         shieldUsed=true;
         save();
       }else if(!validAnswer&&!hasGameModifier("no_safety_net")&&Math.random()<artifactLoadoutEffects().gridShieldChance){
         shieldUsed=true;
         showToast("ARTEFACT PROTECTION","Your equipped artefacts protected this Grid attempt.");
       }else{
         attempts--;
       }

       if(validAnswer){
         const key=cellKey(selectedCell.r,selectedCell.c);
         filled[key]=profile.name;
         usedNames.add(profile.name);
         points++;
         selectedCell=null;

         if(points===9||attempts===0){
           await finishPuzzle(false);
         }else{
           render(`CORRECT: ${profile.name}`);
         }
       }else{
         const failedName=profile.name;
         if(shieldUsed){
           render(`GRID SAFEGUARD: ${failedName} was incorrect, but your attempt was protected.`);
         }else if(attempts===0){
           await finishPuzzle(false);
         }else{
           render(`INCORRECT: ${failedName} does not satisfy both categories. Attempt used.`);
         }
       }
     };
   }

   const giveUp=document.getElementById("giveUpGrid");
   if(giveUp)giveUp.onclick=()=>finishPuzzle(true);

   const newEarly=document.getElementById("newGridEarly");
   if(newEarly)newEarly.onclick=()=>marvelGridGame();

   const newGrid=document.getElementById("newGrid");
   if(newGrid)newGrid.onclick=()=>marvelGridGame();

   const gridHome=document.getElementById("gridHome");
   if(gridHome)gridHome.onclick=home;
 }

 render();
}



const SIX_ARCHIVE_STORAGE_KEY="shield-six-appearance-archive-v3";
const SIX_ARCHIVE_COLLECTION="publicData";
const SIX_ARCHIVE_DOC="sixDegreesAppearanceArchiveV3";
const MCU_API_BASE="https://mcuapi.up.railway.app/api/v1";

let sixArchive=null;
let sixArchiveLoadPromise=null;
let sixArchiveBuildPromise=null;
let sixProjectMembers=new Map();
let sixProfileByRemoteId=new Map();
let sixArchiveProgress={done:0,total:0,label:""};

function sixCompactProjectKey(type,id){
  return `${type==="movie"?"m":"t"}${Number(id)}`;
}

function sixArchiveLooksValid(data){
  return !!data
    && data.version===3
    && data.filmographies
    && typeof data.filmographies==="object"
    && data.projects
    && typeof data.projects==="object";
}

function sixReleasedTitles(){
  const movieRefs=(fullMcuMovies||[])
    .filter(projectIsReleased)
    .map(item=>({
      key:sixCompactProjectKey("movie",item.id),
      type:"movie",
      id:Number(item.id),
      title:item.title,
      release_date:item.release_date
    }));

  const showRefs=(fullMcuShows||[])
    .filter(projectIsReleased)
    .map(item=>({
      key:sixCompactProjectKey("tvshow",item.id),
      type:"tvshow",
      id:Number(item.id),
      title:item.title,
      release_date:item.release_date
    }));

  return [...movieRefs,...showRefs]
    .sort((a,b)=>String(a.release_date||"").localeCompare(String(b.release_date||""))||a.title.localeCompare(b.title));
}

function sixRebuildRuntimeIndex(){
  sixProjectMembers=new Map();
  sixProfileByRemoteId=new Map();

  for(const profile of gridProfiles){
    if(profile.remoteId!=null){
      sixProfileByRemoteId.set(String(profile.remoteId),profile);
    }
  }

  if(!sixArchiveLooksValid(sixArchive))return;

  for(const [remoteId,projects] of Object.entries(sixArchive.filmographies||{})){
    if(!sixProfileByRemoteId.has(String(remoteId)))continue;
    for(const projectKey of projects||[]){
      if(!sixProjectMembers.has(projectKey))sixProjectMembers.set(projectKey,new Set());
      sixProjectMembers.get(projectKey).add(String(remoteId));
    }
  }
}

function sixSaveLocalArchive(archive){
  try{
    localStorage.setItem(SIX_ARCHIVE_STORAGE_KEY,JSON.stringify(archive));
  }catch(error){
    console.warn("Six Degrees archive local cache failed.",error);
  }
}

function sixLoadLocalArchive(){
  try{
    const raw=localStorage.getItem(SIX_ARCHIVE_STORAGE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return sixArchiveLooksValid(parsed)?parsed:null;
  }catch{
    return null;
  }
}

async function sixLoadCloudArchive(){
  if(!db||!docFn||!getDocFn)return null;
  try{
    const snap=await getDocFn(docFn(db,SIX_ARCHIVE_COLLECTION,SIX_ARCHIVE_DOC));
    if(!snap.exists())return null;
    const data=snap.data();
    return sixArchiveLooksValid(data)?data:null;
  }catch(error){
    console.warn("Six Degrees cloud archive unavailable.",error);
    return null;
  }
}

async function loadSixArchive(){
  if(sixArchiveLooksValid(sixArchive)){
    sixRebuildRuntimeIndex();
    return sixArchive;
  }
  if(sixArchiveLoadPromise)return sixArchiveLoadPromise;

  sixArchiveLoadPromise=(async()=>{
    await loadFullGridRoster();

    const local=sixLoadLocalArchive();
    const cloud=await sixLoadCloudArchive();

    const best=[local,cloud]
      .filter(sixArchiveLooksValid)
      .sort((a,b)=>(Number(b.builtAt)||0)-(Number(a.builtAt)||0))[0]||null;

    if(best){
      sixArchive=best;
      sixSaveLocalArchive(best);
      sixRebuildRuntimeIndex();
    }

    return sixArchive;
  })().finally(()=>{sixArchiveLoadPromise=null});

  return sixArchiveLoadPromise;
}

function sixSleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function sixFetchCast(titleRef){
  const segment=titleRef.type==="movie"?"movie":"tvshow";
  const url=`${MCU_API_BASE}/characters/${segment}/${titleRef.id}`;

  for(let attempt=0;attempt<4;attempt++){
    const response=await fetch(url,{cache:"no-store"});

    if(response.status===429){
      await sixSleep(65000);
      continue;
    }

    if(!response.ok){
      if(attempt<3){
        await sixSleep(2500*(attempt+1));
        continue;
      }
      throw new Error(`Cast request failed for ${titleRef.title} (${response.status})`);
    }

    const data=await response.json();
    return Array.isArray(data)?data:[];
  }

  throw new Error(`Cast request failed repeatedly for ${titleRef.title}`);
}

async function buildCompleteSixArchive(onProgress=()=>{}){
  if(!isAdmin())throw new Error("Only the configured administrator can rebuild the shared relationship archive.");
  if(sixArchiveBuildPromise)return sixArchiveBuildPromise;

  sixArchiveBuildPromise=(async()=>{
    await loadFullGridRoster();

    const titles=sixReleasedTitles();
    if(!titles.length)throw new Error("No released Marvel titles were found.");

    const filmographies={};
    const projects={};
    const failedTitles=[];

    sixArchiveProgress={done:0,total:titles.length,label:"Starting full cast scan…"};
    onProgress({...sixArchiveProgress});

    // 850 ms between requests keeps this comfortably below the API's
    // documented 100 requests/minute limit.
    for(let i=0;i<titles.length;i++){
      const titleRef=titles[i];

      sixArchiveProgress={
        done:i,
        total:titles.length,
        label:`Scanning ${titleRef.title}`
      };
      onProgress({...sixArchiveProgress});

      try{
        const cast=await sixFetchCast(titleRef);
        projects[titleRef.key]={
          title:titleRef.title,
          type:titleRef.type,
          id:titleRef.id
        };

        for(const character of cast){
          if(character?.id==null)continue;
          const id=String(character.id);
          if(!filmographies[id])filmographies[id]=[];
          if(!filmographies[id].includes(titleRef.key)){
            filmographies[id].push(titleRef.key);
          }
        }
      }catch(error){
        console.error(error);
        failedTitles.push(titleRef.title);
      }

      sixArchiveProgress={
        done:i+1,
        total:titles.length,
        label:`Scanned ${i+1} / ${titles.length}`
      };
      onProgress({...sixArchiveProgress});

      if(i<titles.length-1)await sixSleep(850);
    }

    // Never publish a graph with missing casts, because that would silently
    // reject real links.
    if(failedTitles.length){
      throw new Error(`Archive incomplete. Failed title casts: ${failedTitles.join(", ")}`);
    }

    const archive={
      version:3,
      builtAt:Date.now(),
      characterCount:Object.keys(filmographies).length,
      projectCount:Object.keys(projects).length,
      filmographies,
      projects
    };

    if(!db||!docFn||!setDocFn||!serverTimestampFn){
      throw new Error("Firebase is unavailable, so the complete archive cannot be published.");
    }

    await setDocFn(
      docFn(db,SIX_ARCHIVE_COLLECTION,SIX_ARCHIVE_DOC),
      {...archive,cloudUpdatedAt:serverTimestampFn()},
      {merge:false}
    );

    sixArchive=archive;
    sixSaveLocalArchive(archive);
    sixRebuildRuntimeIndex();

    sixArchiveProgress={
      done:titles.length,
      total:titles.length,
      label:`Complete · ${archive.characterCount} characters across ${archive.projectCount} released projects`
    };
    onProgress({...sixArchiveProgress});

    return archive;
  })().finally(()=>{sixArchiveBuildPromise=null});

  return sixArchiveBuildPromise;
}

function sixProfileProjects(profile){
  if(!sixArchiveLooksValid(sixArchive)||profile?.remoteId==null)return [];
  return sixArchive.filmographies[String(profile.remoteId)]||[];
}

function sixSharedProjectKeys(a,b){
  const bSet=new Set(sixProfileProjects(b));
  return sixProfileProjects(a).filter(key=>bSet.has(key));
}

function sixConnectionReason(a,b){
  if(!a||!b||a.name===b.name||!sixArchiveLooksValid(sixArchive))return null;

  const shared=sixSharedProjectKeys(a,b);
  if(!shared.length)return null;

  const titles=shared
    .map(key=>sixArchive.projects[key]?.title)
    .filter(Boolean);

  if(!titles.length)return "Shared released Marvel project";
  if(titles.length===1)return `Both appear in ${titles[0]}`;
  return `Both appear in ${titles[0]} + ${titles.length-1} more`;
}

function sixNeighbors(profile){
  if(!sixArchiveLooksValid(sixArchive)||profile?.remoteId==null)return [];

  const ids=new Set();
  for(const projectKey of sixProfileProjects(profile)){
    for(const remoteId of sixProjectMembers.get(projectKey)||[]){
      if(String(remoteId)!==String(profile.remoteId))ids.add(String(remoteId));
    }
  }

  return [...ids]
    .map(id=>sixProfileByRemoteId.get(id))
    .filter(Boolean);
}

function shortestSixPath(start,end,maxDepth=6){
  if(!start||!end)return null;

  const queue=[[start]];
  const seen=new Set([String(start.remoteId??start.name)]);

  while(queue.length){
    const path=queue.shift();
    const current=path[path.length-1];

    if(current.name===end.name)return path;
    if(path.length-1>=maxDepth)continue;

    for(const next of sixNeighbors(current)){
      const key=String(next.remoteId??next.name);
      if(seen.has(key))continue;
      seen.add(key);
      queue.push([...path,next]);
    }
  }

  return null;
}

function sixConnectedProfiles(){
  return gridProfiles.filter(profile=>
    profile.remoteId!=null &&
    sixProfileProjects(profile).length>0 &&
    sixNeighbors(profile).length>0
  );
}

function generateSixPair(ignoreRecent=false){
  const viable=sixConnectedProfiles();
  if(viable.length<2)return null;

  const recent=ignoreRecent?new Set():new Set(prog.recentSixPairs||[]);

  for(let attempt=0;attempt<500;attempt++){
    const start=rnd(viable);
    const end=rnd(viable.filter(x=>x.name!==start.name));
    if(!start||!end)continue;

    const key=[start.name,end.name].sort().join("|");
    if(recent.has(key))continue;

    const shortest=shortestSixPath(start,end,6);
    const distance=shortest?shortest.length-1:0;

    if(shortest&&distance>=1&&distance<=6){
      return {start,end,shortest,key};
    }
  }

  for(const start of viable){
    for(const end of viable){
      if(start===end)continue;
      const shortest=shortestSixPath(start,end,6);
      if(shortest){
        return {
          start,end,shortest,
          key:[start.name,end.name].sort().join("|")
        };
      }
    }
  }

  return null;
}

  const used=new Set([pair.start.name]);
  const optimal=Math.max(1,(pair.shortest?.length||2)-1);
  let finished=false,gaveUp=false;

  function currentLinks(){return path.length-1}

  function baseReward(){
    const extra=Math.max(0,currentLinks()-optimal);
    return Math.max(20,120-extra*25);
  }

  async function finish(success){
    if(finished)return;
    finished=true;
    gaveUp=!success;

    let gain=0;
    if(success){
      gain=awardXp(baseReward(),"six");
      prog.xp+=gain;
      prog.sixSolved=(prog.sixSolved||0)+1;
      if(!prog.sixBest||currentLinks()<prog.sixBest)prog.sixBest=currentLinks();
      recordGameResult("six",{xp:gain,durationMs:Date.now()-startedAt,links:currentLinks(),score:Math.max(0,7-currentLinks())});
      rollPostGamePowerup("six");
    }
    await save();
    render(success?`CHAIN VERIFIED · +${gain} XP`:"CHAIN ABANDONED · +0 XP");
  }

  function render(message=""){
    const current=path[path.length-1];
    const complete=current.name===pair.end.name;

    if(complete&&!finished){
      finish(true);
      return;
    }

    const pathHtml=path.map((node,index)=>{
      const arrow=index?`<span class="degree-arrow">→</span>`:"";
      return `${arrow}<span class="degree-node">${esc(node.name)}</span>`;
    }).join("");

    const reasonHtml=path.length>1?path.slice(1).map((node,index)=>{
      return `<div class="clue"><span>LINK ${index+1}</span><div>${esc(sixConnectionReason(path[index],node)||"Verified relationship")}</div></div>`;
    }).join(""):"";

    screen.innerHTML=`<div class="missionhead">

    </div>
    <section class="mission">
      <div class="notice">A direct link is valid when both characters are recorded in at least one of the same released Marvel films or series. Maximum: 6 links.</div>
      <div class="six-archive"><strong>${esc(sixArchiveSummary())}</strong></div>
      <div class="degree-path">${pathHtml}<span class="degree-arrow">→</span><span class="degree-node" style="border-style:dashed">${esc(pair.end.name)}</span></div>
      ${reasonHtml}
      ${!finished?`
        <form class="form" id="sixForm">
          <input id="sixInput" placeholder="Search next character…" autocomplete="off" required>
          <button class="btn primary">Add link</button>
        </form>
        <div class="suggestions" id="sixSuggestions"></div>
        <div class="row"><button class="btn" id="sixGiveUp">Give up · 0 XP</button></div>
      `:`<div class="grid-results"><strong>${gaveUp?"GAVE UP":"CHAIN COMPLETE"}</strong><p>${gaveUp?`Shortest route: ${pair.shortest?.map(x=>x.name).join(" → ")||"unavailable"}`:`${currentLinks()} links · shortest possible ${optimal}`}</p><div class="row"><button class="btn primary" id="sixNew">New chain</button><button class="btn" id="sixHome">Terminal</button></div></div>`}
      <p class="feedback" id="sixFeedback">${esc(message)}</p>
    </section>`;

    document.getElementById("sixBack").onclick=home;

    if(!finished){
      const input=document.getElementById("sixInput");
      const suggestions=document.getElementById("sixSuggestions");

      function refresh(){
        const q=norm(input.value);
        if(!q){suggestions.innerHTML="";return;}
        const matches=sixConnectedProfiles()
          .filter(profile=>!used.has(profile.name))
          .filter(profile=>norm(profile.name).includes(q)||(profile.aliases||[]).some(alias=>norm(alias).includes(q)))
          .sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1)||a.name.localeCompare(b.name))
          .slice(0,12);

        suggestions.innerHTML=matches.map(profile=>`<button class="suggestion" data-six-name="${esc(profile.name)}" type="button"><strong>${esc(profile.name)}</strong><small>${esc((profile.aliases||[]).slice(0,2).join(" · "))}</small></button>`).join("");
        document.querySelectorAll("[data-six-name]").forEach(button=>button.onclick=()=>{input.value=button.dataset.sixName;suggestions.innerHTML=""});
      }

      input.addEventListener("input",refresh);

      document.getElementById("sixForm").onsubmit=e=>{
        e.preventDefault();
        const candidate=findGridProfile(input.value);
        const feedback=document.getElementById("sixFeedback");

        if(!candidate){feedback.textContent="Character not found. Choose a suggested personnel record.";return;}
        if(used.has(candidate.name)){feedback.textContent="That character is already in your chain.";return;}

        const reason=sixConnectionReason(path[path.length-1],candidate);
        if(!reason){feedback.textContent=`No shared released film/series appearance is recorded between ${path[path.length-1].name} and ${candidate.name}.`;return;}

        if(candidate.name!==pair.end.name&&currentLinks()>=5){
          feedback.textContent="That would use your sixth link without reaching the target.";
          return;
        }

        path.push(candidate);
        used.add(candidate.name);

        if(currentLinks()>6){
          finish(false);
        }else{
          render(`${candidate.name} added · ${reason}`);
        }
      };

      document.getElementById("sixGiveUp").onclick=()=>finish(false);
    }else{
      document.getElementById("sixNew").onclick=()=>sixDegreesGame();
      document.getElementById("sixHome").onclick=home;
    }
  }

  render();
}

function heistRemainingMs(){
  if((isAdmin()&&prog.adminHeistNoCooldown)||hasActivePowerup("vault_master_key"))return 0;
  return Math.max(0,(Number(prog.heistReadyAt)||0)-Date.now());
}
function heistCooldownDurationMs(){
  const reduction=artifactLoadoutEffects().heistCooldownReduction;
  return Math.max(5*60*1000,60*60*1000*(1-reduction));
}

const HEIST_BASE_WEIGHTS={Common:38,Uncommon:28,Rare:20,Epic:10,Legendary:3.5,Mythic:0.5};
const HEIST_LUCK_WEIGHTS={Common:28,Uncommon:27,Rare:23,Epic:16.2,Legendary:4.9,Mythic:0.9};
const HEIST_SINGULARITY_WEIGHTS={Common:5,Uncommon:10,Rare:20,Epic:30,Legendary:25,Mythic:10};

function rollWeightedRarity(weights){
  const roll=Math.random()*100;
  let total=0;
  for(const rarity of rarityOrder){
    total+=weights[rarity]||0;
    if(roll<total)return rarity;
  }
  return "Common";
}

function rollHeistArtifact(){
  if(isAdmin()&&prog.adminNextHeistArtifact){
    const forced=artifacts.find(a=>a.name===prog.adminNextHeistArtifact);
    prog.adminNextHeistArtifact="";
    if(forced)return forced;
  }

  const weights=hasActivePowerup("singularity_fortune")
    ? HEIST_SINGULARITY_WEIGHTS
    : hasActivePowerup("heist_luck")?HEIST_LUCK_WEIGHTS:HEIST_BASE_WEIGHTS;
  let rarity=(isAdmin()&&prog.adminNextHeistRarity&&rarityOrder.includes(prog.adminNextHeistRarity))
    ? prog.adminNextHeistRarity
    : rollWeightedRarity(weights);

  if(isAdmin()&&prog.adminNextHeistRarity)prog.adminNextHeistRarity="";

  let pool=standardArtifacts.filter(item=>rarityForArtifact(item.name)===rarity);
  if(!pool.length)pool=standardArtifacts;
  let artifact=rnd(pool);

  if(hasActivePowerup("dup_guard")&&(prog.inventory||[]).some(item=>item.name===artifact.name)){
    const uniquePool=pool.filter(item=>!(prog.inventory||[]).some(owned=>owned.name===item.name));
    if(uniquePool.length)artifact=rnd(uniquePool);
  }

  return artifact;
}

function heistOddsHtml(){
  const weights=hasActivePowerup("singularity_fortune")
    ? HEIST_SINGULARITY_WEIGHTS
    : hasActivePowerup("heist_luck")?HEIST_LUCK_WEIGHTS:HEIST_BASE_WEIGHTS;
  return `<div class="heist-odds">${rarityOrder.map(r=>`<div><strong>${esc(r)}</strong><br>${weights[r]}%</div>`).join("")}</div>`;
}

      prog.heists=(prog.heists||0)+1;

      setTimeout(async()=>{

        addInventoryReward(first,lvl(prog.xp));

        const perkDouble=artifactLoadoutEffects().doubleHeist+(currentMissionEvent?.doubleHeist||0);
        const doubleChance=Math.min(.95,(hasActivePowerup("double_loot")?.25:0)+perkDouble);
        if((isAdmin()&&prog.adminForceDoubleRecovery)||Math.random()<doubleChance){
          const second=rollHeistArtifact();
          lastRewards.push(second);
          addInventoryReward(second,lvl(prog.xp));
        }

        rollPostGamePowerup("heist");
        revealing=false;
        await save();
        render(`${lastRewards.length} artefact${lastRewards.length===1?"":"s"} recovered.`);
      },1100);
    };
  }

  render();

  const heistUiTimer=setInterval(()=>{
    if(activeScreen!=="heist"){clearInterval(heistUiTimer);return;}
    if(!revealing&&heistRemainingMs()>0)render();
  },1000);
}
