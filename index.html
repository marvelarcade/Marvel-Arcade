function formatClock(ms){
  ms=Math.max(0,Number(ms)||0);
  const total=Math.ceil(ms/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function hasActivePowerup(id){
  return (prog.activePowerups||[]).some(item=>item.id===id&&item.remainingMs>0);
}

function remainingPowerupMs(id){
  return (prog.activePowerups||[]).find(item=>item.id===id)?.remainingMs||0;
}

function activePowerupMultiplier(gameId){
  if(activeFriendChallenge)return 1;
  let multiplier=1;
  if(hasActivePowerup("xp_amp"))multiplier+=0.5;
  if(hasActivePowerup("intel_amp")&&["identity","database","artifact","quote","roster","evidence"].includes(gameId))multiplier+=0.5;
  if(hasActivePowerup("tactical_amp")&&["escape","grid","six","stark","sling"].includes(gameId))multiplier+=0.5;
  if(hasActivePowerup("director_overdrive"))multiplier+=5;
  return multiplier;
}

function awardXp(baseXp,gameId){
  const base=Math.max(0,Number(baseXp)||0);
  if(base<=0)return 0;
  const adminMult=isAdmin()?Math.max(0,Number(prog.adminXpMultiplier)||1):1;
  const artefactMult=artifactLoadoutEffects().xpMultiplier;
  const modifierMult=gameModifierXpMultiplier(gameId);
  const eventMult=currentMissionEvent?.xpMult||1;
  const gain=Math.round(base*activePowerupMultiplier(gameId)*adminMult*artefactMult*modifierMult*eventMult*10)/10;
  prog.gameplayXpEarned=(Number(prog.gameplayXpEarned)||0)+gain;
  showXpGain(gain);
  return gain;
}


function weightedDuration(){
  const roll=Math.random()*100;
  if(roll<45)return 5;
  if(roll<75)return 15;
  if(roll<93)return 30;
  return 60;
}

function addPowerupToInventory(id,durationMin=0){
  const key=powerupKey(id,durationMin);
  let item=(prog.powerups||[]).find(entry=>powerupKey(entry.id,entry.durationMin)===key);
  if(item)item.qty=(item.qty||1)+1;
  else prog.powerups.push({id,durationMin,qty:1});
  prog.unseenPowerups=(prog.unseenPowerups||0)+1;
  return {id,durationMin};
}

function rollPostGamePowerup(gameId){
  const forced=(isAdmin()&&prog.adminForcePowerupDrop)||hasActivePowerup("probability_override");
  const forcedId=isAdmin()&&prog.adminNextPowerupId?prog.adminNextPowerupId:"";
  const denominator=hasActivePowerup("powerup_luck")?18:POWERUP_DROP_DENOMINATOR;
  const perkChance=artifactLoadoutEffects().powerupBonus+(currentMissionEvent?.powerupBonus||0);
  const dropChance=Math.min(.95,1/denominator+perkChance);

  if(!forced&&!forcedId&&Math.random()>=dropChance)return null;

  const ids=Object.keys(powerupCatalog).filter(id=>!powerupCatalog[id].adminOnly);
  const id=forcedId&&powerupCatalog[forcedId]?forcedId:rnd(ids);
  const info=powerupCatalog[id];
  const durationMin=info.timed
    ? (forcedId?Math.max(1,Number(prog.adminNextPowerupDuration)||60):weightedDuration())
    : 0;

  const drop=addPowerupToInventory(id,durationMin);

  if(forcedId){
    prog.adminNextPowerupId="";
  }

  setTimeout(()=>{
    showToast(
      "POWER-UP RECOVERED",
      `${info.name}${durationMin?` · ${durationMin} min`:" · single use"} added to Inventory.`
    );
  },60);

  return drop;
}

function removeStoredPowerup(id,durationMin=0){
  const key=powerupKey(id,durationMin);
  const item=(prog.powerups||[]).find(entry=>powerupKey(entry.id,entry.durationMin)===key);
  if(!item||item.qty<=0)return false;
  item.qty--;
  prog.powerups=prog.powerups.filter(entry=>(entry.qty||0)>0);
  return true;
}

function activateTimedPowerup(id,durationMin){
  if(!removeStoredPowerup(id,durationMin))return false;
  let active=(prog.activePowerups||[]).find(item=>item.id===id);
  if(active)active.remainingMs=Math.min(4*60*60*1000,(active.remainingMs||0)+durationMin*60000);
  else prog.activePowerups.push({id,remainingMs:durationMin*60000});
  showToast("POWER-UP ACTIVATED",`${powerupCatalog[id].name} · ${durationMin} minutes of active-tab time.`);
  return true;
}

async function useSinglePowerup(id){
  if(id==="heist_reset"){
    if(heistRemainingMs()<=0){
      showToast("NOT USED","Inventory Heist is already ready.");
      return false;
    }
    if(!removeStoredPowerup(id,0))return false;
    prog.heistReadyAt=0;
    prog.heistStateUpdatedAt=Date.now();
    showToast("COOLDOWN RESET","Inventory Heist is ready immediately.");
    await save();
    return true;
  }

  if(id==="grid_shield"){
    if(!removeStoredPowerup(id,0))return false;
    prog.gridShieldCharges=(prog.gridShieldCharges||0)+1;
    showToast("GRID SAFEGUARD ARMED",`You now have ${prog.gridShieldCharges} protected mistake${prog.gridShieldCharges===1?"":"s"}.`);
    await save();
    return true;
  }

  if(id==="timeline_purge"){
    if(!removeStoredPowerup(id,0))return false;
    prog.heistReadyAt=0;
    prog.heistStateUpdatedAt=Date.now();
    prog.gridShieldCharges=(prog.gridShieldCharges||0)+5;
    showToast("TIMELINE PURGED","Heist cooldown reset · +5 Grid Safeguards.");
    await save();
    return true;
  }

  return false;
}

function activeBuffStrip(){

  const buff=(!active.length&&!prog.gridShieldCharges)?"":`<div class="buff-strip">

    ${prog.gridShieldCharges?`<span class="buff-chip">Grid Safeguard ×${prog.gridShieldCharges}</span>`:""}
  </div>`;
  return `${missionEventStrip()}${buff}`;
}

  localStorage.setItem("shield-v4",JSON.stringify(prog));

let powerTimerLast=Date.now();
let powerTimerPersistAt=0;

function tickPowerTimers(){
  const now=Date.now();
  const canTick=document.visibilityState==="visible"&&navigator.onLine&&!(isAdmin()&&prog.adminFreezeBuffTimers);
  let changed=false;

  if(canTick){
    const delta=Math.max(0,Math.min(5000,now-powerTimerLast));
    for(const item of prog.activePowerups||[]){
      if(item.remainingMs>0){
        item.remainingMs=Math.max(0,item.remainingMs-delta);
        changed=true;
      }
    }
    prog.activePowerups=(prog.activePowerups||[]).filter(item=>item.remainingMs>0);
  }

  powerTimerLast=now;

  if(changed&&now-powerTimerPersistAt>5000){
    persistLocalProgress();
    powerTimerPersistAt=now;
  }

  document.querySelectorAll("[data-active-power]").forEach(el=>{
    const id=el.dataset.activePower;
    const remaining=remainingPowerupMs(id);
    if(remaining<=0){
      el.remove();
    }else{
      el.textContent=`${powerupCatalog[id]?.name||id} · ${formatClock(remaining)}`;
    }
  });
}

setInterval(tickPowerTimers,1000);
document.addEventListener("visibilitychange",()=>{powerTimerLast=Date.now();persistLocalProgress()});
window.addEventListener("online",()=>{powerTimerLast=Date.now()});
window.addEventListener("offline",()=>{powerTimerLast=Date.now();persistLocalProgress()});
window.addEventListener("beforeunload",persistLocalProgress);

function mergeInventory(localInventory=[],cloudInventory=[]){
  const byName=new Map();
  for(const item of [...cloudInventory,...localInventory]){
    if(!item||!item.name)continue;
    const existing=byName.get(item.name);
    if(!existing){
      byName.set(item.name,{...item,qty:Math.max(1,item.qty||1)});
    }else{
      existing.qty=Math.max(existing.qty||1,item.qty||1);
      existing.firstLevel=Math.min(existing.firstLevel||999999,item.firstLevel||999999);
      existing.lastLevel=Math.max(existing.lastLevel||0,item.lastLevel||0);
    }
  }
  return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function mergeCollectibles(localItems=[],cloudItems=[]){
  const merged=new Map();
  for(const item of [...cloudItems,...localItems]){
    if(!item?.id)continue;
    const current=merged.get(item.id);
    if(!current)merged.set(item.id,{...item,qty:Math.max(1,item.qty||1)});
    else current.qty=Math.max(current.qty||1,item.qty||1);
  }
  return [...merged.values()];
}

function addCollectible(id,qty=1,source="Reward"){
  if(!itemCatalog[id])return false;
  qty=Math.max(1,Math.floor(Number(qty)||1));
  let item=(prog.collectibles||[]).find(entry=>entry.id===id);
  if(item)item.qty=(item.qty||1)+qty;
  else prog.collectibles.push({id,qty,source,firstEarnedAt:Date.now()});
  prog.unseenCollectibles=(prog.unseenCollectibles||0)+qty;
  return true;
}

function standardUniqueArtifactCount(){
  const valid=new Set(standardArtifacts.map(a=>a.name));
  return new Set((prog.inventory||[]).filter(item=>valid.has(item.name)).map(item=>item.name)).size;
}

function ownedArtifactQtyByRarity(rarity){
  const valid=new Set(standardArtifacts.map(a=>a.name));
  return (prog.inventory||[]).filter(item=>valid.has(item.name)&&rarityForArtifact(item.name)===rarity)
    .reduce((sum,item)=>sum+(item.qty||1),0);
}

function ownsArtifactRarity(rarity){
  return ownedArtifactQtyByRarity(rarity)>0;
}

function seededUnit(seed,level,salt=0){
  let x=(Number(seed)||1) ^ Math.imul(level+31,2654435761) ^ Math.imul(salt+17,1597334677);
  x=Math.imul(x^(x>>>16),2246822507);
  x=Math.imul(x^(x>>>13),3266489909);
  x=(x^(x>>>16))>>>0;
  return x/4294967296;
}

function rewardLevelEligible(level){
  // Guaranteed every 5 levels. Level Cache Scanner only affects random non-guaranteed drops.
  if(level%5===0)return true;
  const chance=hasActivePowerup("level_luck")?0.56:0.28;
  return seededUnit(prog.rewardSeed,level,1)<chance;
}

function addInventoryReward(artifact,level){
  const rarity=rarityForArtifact(artifact.name);
  const existing=(prog.inventory||[]).find(item=>item.name===artifact.name);
  if(existing){
    existing.qty=(existing.qty||1)+1;
    existing.lastLevel=level;
    existing.rarity=rarity;
  }else{
    prog.inventory.push({
      name:artifact.name,
      rarity,
      qty:1,
      firstLevel:level,
      lastLevel:level
    });
  }
  prog.unseenInventory=(prog.unseenInventory||0)+1;
}

function rewardArtifactFor(level,slot){
  const desiredRarity=chooseRarityForLevel(level,slot+100);
  const owned=new Set((prog.inventory||[]).map(item=>item.name));

  let pool=standardArtifacts.filter(item=>
    rarityForArtifact(item.name)===desiredRarity &&
    !owned.has(item.name)
  );

  // If all unowned artefacts of that rarity are gone, allow duplicates.
  if(!pool.length){
    pool=standardArtifacts.filter(item=>rarityForArtifact(item.name)===desiredRarity);
  }

  // If a tier has no artefacts at all, step downward to the nearest available tier.
  if(!pool.length){
    let rarityIndex=rarityOrder.indexOf(desiredRarity);
    while(rarityIndex>0&&!pool.length){
      rarityIndex--;
      const fallbackRarity=rarityOrder[rarityIndex];
      pool=standardArtifacts.filter(item=>rarityForArtifact(item.name)===fallbackRarity);
    }
  }

  if(!pool.length)pool=standardArtifacts;

  const index=Math.floor(seededUnit(prog.rewardSeed,level,slot+200)*pool.length);
  return pool[Math.max(0,Math.min(pool.length-1,index))];
}

function processLevelRewards(){
  const currentLevel=lvl(prog.xp);
  const processed=new Set(prog.rewardedLevels||[]);

  for(let level=2;level<=currentLevel;level++){
    if(processed.has(level))continue;

    if(rewardLevelEligible(level)){
      let count=1;
      if(level%25===0)count=3;
      else if(level%10===0)count=2;

      for(let slot=0;slot<count;slot++){
        addInventoryReward(rewardArtifactFor(level,slot),level);
      }
    }

    prog.rewardedLevels.push(level);
    processed.add(level);
  }

  prog.rewardedLevels=[...new Set(prog.rewardedLevels)].sort((a,b)=>a-b);
}

const normalAchievementCount=achievementCatalog.filter(a=>!a.secret).length;
const secretAchievementCount=achievementCatalog.filter(a=>a.secret).length;

function achievementArtifactReward(rarity){
  let pool=standardArtifacts.filter(a=>rarityForArtifact(a.name)===rarity);
  if(!pool.length)return null;
  const owned=new Set((prog.inventory||[]).map(item=>item.name));
  const unowned=pool.filter(a=>!owned.has(a.name));
  return rnd(unowned.length?unowned:pool);
}

function grantAchievementReward(achievement){
  const reward=achievement.reward||{};
  if(reward.xp){const achievementXp=Number(reward.xp)||0;prog.xp+=achievementXp;showXpGain(achievementXp);}

  for(const itemId of reward.items||[]){
    addCollectible(itemId,1,`Achievement · ${achievement.name}`);
  }

  for(const power of reward.powerups||[]){
    const info=powerupCatalog[power.id];
    if(!info||info.adminOnly)continue;
    const qty=Math.max(1,Math.floor(Number(power.qty)||1));
    for(let i=0;i<qty;i++)addPowerupToInventory(power.id,power.durationMin||0);
  }

  if(reward.artifactRarity){
    const qty=Math.max(1,Math.floor(Number(reward.artifactQty)||1));
    for(let i=0;i<qty;i++){
      const artifact=achievementArtifactReward(reward.artifactRarity);
      if(artifact)addInventoryReward(artifact,lvl(prog.xp));
    }
  }
}

function achievementRewardText(achievement){
  const reward=achievement.reward||{};
  const parts=[];
  if(reward.xp)parts.push(`${Number(reward.xp).toLocaleString()} XP`);
  for(const itemId of reward.items||[])parts.push(itemCatalog[itemId]?.name||itemId);
  for(const power of reward.powerups||[]){
    const info=powerupCatalog[power.id];
    if(info)parts.push(`${info.name}${info.timed?` ${power.durationMin}m`:""}${(power.qty||1)>1?` ×${power.qty}`:""}`);
  }
  if(reward.artifactRarity)parts.push(`${reward.artifactRarity} artefact${(reward.artifactQty||1)>1?` ×${reward.artifactQty}`:""}`);
  return parts.join(" · ")||"Classified reward";
}

function processAchievements(){
  if(!Array.isArray(prog.completedAchievements))prog.completedAchievements=[];
  const completed=new Set(prog.completedAchievements);
  const newlyUnlocked=[];

  // Multiple passes allow reward XP to trigger another threshold immediately.
  for(let pass=0;pass<4;pass++){
    let changed=false;
    for(const achievement of achievementCatalog){
      if(completed.has(achievement.id))continue;
      let achieved=false;
      try{achieved=!!achievement.condition()}catch{achieved=false}
      if(!achieved)continue;

      completed.add(achievement.id);
      prog.completedAchievements.push(achievement.id);
      prog.unseenAchievements=(prog.unseenAchievements||0)+1;
      grantAchievementReward(achievement);
      newlyUnlocked.push(achievement);
      changed=true;
    }
    if(!changed)break;
  }

  prog.completedAchievements=[...new Set(prog.completedAchievements)];

  if(newlyUnlocked.length){
    setTimeout(()=>{
      const last=newlyUnlocked[newlyUnlocked.length-1];
      showToast(
        newlyUnlocked.length===1?"ACHIEVEMENT UNLOCKED":`${newlyUnlocked.length} ACHIEVEMENTS UNLOCKED`,
        newlyUnlocked.length===1?last.name:`Latest: ${last.name}`
      );
    },80);
  }

  return newlyUnlocked;
}

async function save(){
  const beforeRuntimeLevel=runtimeLastLevel;
  processLevelRewards();
  const unlocked=processAchievements();
  if(unlocked.length)processLevelRewards();
  ensureMissionState();
  normaliseGameModifiers();normaliseArtifactLoadout();
  const newlyPermanent=refreshPermanentMissionCompletions();
  if(newlyPermanent.length){
    const names=newlyPermanent.map(id=>permanentMissionInfo(id)?.name).filter(Boolean);
    showToast("PERMANENT MISSION COMPLETE",names.length===1?names[0]:`${names.length} career missions completed.`);
  }
  normaliseProfileShowcase();
  stampChangedSyncFields();
  updateInventoryButton();updateAchievementButton();updateMissionBadge();
  applyTheme(prog.uiSettings.theme);
  localStorage.setItem("shield-v4",JSON.stringify(prog));
  document.getElementById("xp").textContent=prog.xp.toLocaleString();
  const currentLevel=lvl(prog.xp);document.getElementById("lvl").textContent=currentLevel;updateTopContext();
  if(currentLevel>beforeRuntimeLevel){runtimeLastLevel=currentLevel;if(prog.uiSettings.levelUpNotifications){playUiSound("level",true);showToast("CLEARANCE LEVEL INCREASED",`Level ${currentLevel} · open Level Details to preview upcoming guaranteed caches.`)}}else runtimeLastLevel=currentLevel;
  if(currentUser&&db){
    try{
      await setDocFn(docFn(db,"users",currentUser.uid),{progress:prog,updatedAt:serverTimestampFn()},{merge:true});
      setLoginStatus("Cloud saved");
      syncPublicProfile();
    }catch(error){console.error(error);setLoginStatus("Local save only",true)}
  }
}

async function authClick(){
  if(!firebaseEnabled){
    alert("Google login code is ready, but Firebase is not connected yet. Paste your Firebase web config into the top of index.html first.");
    return;
  }

  await firebaseReady;

  if(currentUser){
    await signOutFn(auth);
    return;
  }

  const provider=new GoogleAuthProviderClass();
  provider.setCustomParameters({prompt:"select_account"});

  try{
    await signInWithPopupFn(auth,provider);
  }catch(error){
    console.error(error);
    if(error?.code==="auth/popup-blocked"||error?.code==="auth/cancelled-popup-request"){
      await signInWithRedirectFn(auth,provider);
      return;
    }
    alert("Google sign-in failed. Check Firebase Authentication and authorised domains.");
  }
}

function adminGiveArtifact(name,qty){
  const artifact=artifacts.find(a=>a.name===name);
  qty=Math.max(1,Math.floor(Number(qty)||1));
  if(!artifact)return false;
  for(let i=0;i<qty;i++)addInventoryReward(artifact,lvl(prog.xp));
  return true;
}

function adminRemoveArtifact(name,qty){
  qty=Math.max(1,Math.floor(Number(qty)||1));
  const item=(prog.inventory||[]).find(x=>x.name===name);
  if(!item)return false;
  item.qty=Math.max(0,(item.qty||1)-qty);
  prog.inventory=prog.inventory.filter(x=>(x.qty||0)>0);
  return true;
}

function adminGiveAllArtifacts(){
  for(const artifact of standardArtifacts){
    if(!(prog.inventory||[]).some(item=>item.name===artifact.name)){
      addInventoryReward(artifact,lvl(prog.xp));
    }
  }
}

function adminGivePowerup(id,durationMin,qty){
  const info=powerupCatalog[id];
  if(!info)return false;
  qty=Math.max(1,Math.floor(Number(qty)||1));
  const duration=info.timed?Math.max(1,Math.floor(Number(durationMin)||5)):0;
  for(let i=0;i<qty;i++)addPowerupToInventory(id,duration);
  return true;
}

function adminActivateBuff(id,minutes){
  const info=powerupCatalog[id];
  if(!info?.timed)return false;
  minutes=Math.max(1,Number(minutes)||1);
  const addMs=minutes*60000;
  let active=(prog.activePowerups||[]).find(x=>x.id===id);
  if(active)active.remainingMs=(active.remainingMs||0)+addMs;
  else prog.activePowerups.push({id,remainingMs:addMs});
  return true;
}

function adminGrantRandomArtifacts(count,rarity="Any"){

function adminChaosAction(){
  const actions=[
    ()=>{
      const amount=rnd([1000,5000,10000,50000,100000]);
      prog.xp+=amount;
      return `CHAOS: +${amount.toLocaleString()} XP`;
    },
    ()=>{

      adminGrantRandomArtifacts(rnd([1,2,3,5]),rarity);
      return `CHAOS: random ${rarity} artefact drop`;
    },
    ()=>{
      adminActivateEveryTimedBuff(rnd([15,30,60,180]));
      return "CHAOS: every timed buff activated";
    },
    ()=>{
      prog.heistReadyAt=0;prog.heistStateUpdatedAt=Date.now();
      return "CHAOS: Heist cooldown erased";
    },
    ()=>{
      prog.gridShieldCharges=(prog.gridShieldCharges||0)+rnd([5,10,25,50]);

    },
    ()=>{
      addPowerupToInventory(rnd(Object.keys(powerupCatalog)),60);
      return "CHAOS: random Power-Up generated";
    }
  ];
  return rnd(actions)();
}

async function adminLoadSupportUsers(){

  }
  const q=queryFn(
    collectionFn(db,"users"),
    whereFn("progress.adminSupport","==",true)
  );

  return snap.docs.map(d=>({

  }));

function supportGiveArtifact(target,name,qty=1){
  const artifact=artifacts.find(a=>a.name===name);
  if(!artifact)return false;
  if(!Array.isArray(target.inventory))target.inventory=[];
  qty=Math.max(1,Math.floor(Number(qty)||1));
  for(let i=0;i<qty;i++){
    const existing=target.inventory.find(x=>x.name===artifact.name);
    if(existing)existing.qty=(existing.qty||1)+1;
    else target.inventory.push({
      name:artifact.name,
      rarity:rarityForArtifact(artifact.name),
      qty:1,
      firstLevel:lvl(target.xp||0),
      lastLevel:lvl(target.xp||0)
    });
  }
  target.unseenInventory=(target.unseenInventory||0)+qty;
  return true;
}


function supportGiveCollectible(target,id,qty=1){
  if(!itemCatalog[id])return false;
  if(!Array.isArray(target.collectibles))target.collectibles=[];
  qty=Math.max(1,Math.floor(Number(qty)||1));
  let item=target.collectibles.find(x=>x.id===id);
  if(item)item.qty=(item.qty||1)+qty;
  else target.collectibles.push({id,qty,source:"Administrator grant",firstEarnedAt:Date.now()});
  target.unseenCollectibles=(target.unseenCollectibles||0)+qty;
  return true;
}

function supportGivePowerup(target,id,durationMin=60,qty=1){
  const info=powerupCatalog[id];
  if(!info)return false;
  if(!Array.isArray(target.powerups))target.powerups=[];
  const duration=info.timed?Math.max(1,Math.floor(Number(durationMin)||60)):0;
  const key=powerupKey(id,duration);
  let item=target.powerups.find(x=>powerupKey(x.id,x.durationMin)===key);
  qty=Math.max(1,Math.floor(Number(qty)||1));
  if(item)item.qty=(item.qty||1)+qty;
  else target.powerups.push({id,durationMin:duration,qty});
  target.unseenPowerups=(target.unseenPowerups||0)+qty;
  return true;
}

async function adminMutateSupportUser(uid,mutator){
  if(!isAdmin()||!uid)throw new Error("Admin access required.");
  const ref=docFn(db,"users",uid);
  const snap=await getDocFn(ref);
  if(!snap.exists())throw new Error("User save not found.");
  const data=snap.data();
  const target=JSON.parse(JSON.stringify(data.progress||{}));
  if(target.adminSupport!==true)throw new Error("This user has not enabled admin support.");

  await mutator(target);

  // Preserve the user's opt-in so admin writes cannot silently remove consent.
  target.adminSupport=true;
  await setDocFn(ref,{progress:target,updatedAt:serverTimestampFn()},{merge:true});
  return target;
}

<div class="rules-card"><h3>12 · Marvel Roster</h3><ul>

/* ============================================================
   GAME 09 · STARK SYSTEMS LAB
   Drag components → draw cables → rotate calibration rings.
   ============================================================ */

const STARK_COMPONENTS=[
  {key:"arc",name:"Arc Core",sub:"POWER SOURCE",icon:"◉"},
  {key:"repulsor",name:"Repulsor Regulator",sub:"ENERGY CONTROL",icon:"◎"},
  {key:"flight",name:"Flight Control",sub:"VECTOR MODULE",icon:"△"},
  {key:"sensor",name:"Sensor Array",sub:"TARGETING MODULE",icon:"⌖"},
  {key:"power",name:"Power Bus",sub:"DISTRIBUTION",icon:"↯"},
  {key:"nano",name:"Nano-Forge",sub:"ASSEMBLY MATRIX",icon:"⬡"}
];

async function starkSystemsLab(replayId=null){
  activeScreen="stark";
  prog.games++;
  prog.starkPlayed=(prog.starkPlayed||0)+1;
  await save();

  const meta=resolvePuzzle("STARK",typeof replayId==="string"?replayId:null);
  setCurrentPuzzle("STARK",meta.seed);
  const generated=withPuzzleSeed(meta.seed,()=>{
    const components=sh(STARK_COMPONENTS).slice(0,3),slotOrder=sh(components);
    const wireKeys=sh([{key:"A",name:"ARC BUS"},{key:"B",name:"FLIGHT BUS"},{key:"C",name:"SENSOR BUS"},{key:"D",name:"REPULSOR BUS"}]);
    const wireLeft=[...wireKeys],wireRight=sh(wireKeys);
    const targets=Array.from({length:3},()=>rnd([0,45,90,135,180,225,270,315]));
    const angles=targets.map(target=>(target+rnd([45,90,135,180]))%360);
    return {components,slotOrder,wireKeys,wireLeft,wireRight,targets,angles};
  });
  const {components,slotOrder,wireKeys,wireLeft,wireRight,targets,angles}=generated;
  const placed=new Set(),wired=new Set(),startedAt=Date.now();

  let stage=1;
  let mistakes=0;
  let completed=false;
  let stageStatus="";

  const stageHeader=()=>`<div class="interactive-hud">
    <div class="interactive-stat"><span>STAGE</span><strong>${stage} / 3</strong></div>
    <div class="interactive-stat"><span>ERRORS</span><strong>${mistakes}</strong></div>
    <div class="interactive-stat"><span>MAX BASE XP</span><strong>300</strong></div>
  </div>`;

  function shell(content){
    screen.innerHTML=`<div class="missionhead">
      <button class="back" id="starkBack">← Terminal</button>
      <div><p class="eyebrow">GAME 09</p><h1>Stark Systems Lab</h1></div>
      <div><div class="reward">3-STAGE REPAIR</div>${puzzleIdInline()}</div>
    </div>
    <section class="mission" style="max-width:1120px">
      ${stageHeader()}
      ${content}
    </section>`;
    document.getElementById("starkBack").onclick=home;
  }

  function componentHtml(component){
    return `<div class="stark-component" data-component="${esc(component.key)}">
      <div class="component-icon">${esc(component.icon)}</div>
      <div><strong>${esc(component.name)}</strong><small>${esc(component.sub)}</small></div>
    </div>`;
  }

  function bindAssemblyDrag(){
    document.querySelectorAll(".stark-component[data-component]").forEach(token=>{
      if(token.closest(".stark-slot"))return;

      token.addEventListener("pointerdown",event=>{
        if(event.button!=null&&event.button!==0)return;
        event.preventDefault();

        const key=token.dataset.component;
        const component=components.find(x=>x.key===key);
        if(!component)return;

        const ghost=token.cloneNode(true);
        ghost.classList.add("drag-ghost");
        document.body.appendChild(ghost);
        const workbench=document.querySelector(".stark-workbench");
        document.querySelectorAll(".stark-slot").forEach(slot=>slot.classList.add("drop-ready"));
        document.querySelector(`.stark-slot[data-slot="${key}"]`)?.classList.add("valid-drop");
        feedbackBurst(token,"neutral");

        const move=e=>{
          ghost.style.left=`${e.clientX}px`;
          ghost.style.top=`${e.clientY}px`;
          document.querySelectorAll(".stark-slot").forEach(slot=>slot.classList.remove("drop-hover"));
          document.elementFromPoint(e.clientX,e.clientY)?.closest(".stark-slot")?.classList.add("drop-hover");
        };
        move(event);

        const up=e=>{
          document.removeEventListener("pointermove",move);
          document.removeEventListener("pointerup",up);
          ghost.remove();

          const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".stark-slot");
          document.querySelectorAll(".stark-slot").forEach(slot=>slot.classList.remove("drop-ready","valid-drop","drop-hover"));
          if(target&&target.dataset.slot===key){
            placed.add(key);stageStatus=`${component.name} seated correctly.`;
            target.innerHTML=componentHtml(component);target.classList.add("filled");token.style.visibility="hidden";feedbackBurst(target,"correct");
            setTimeout(()=>{renderAssembly();if(placed.size===components.length&&activeScreen==="stark"&&!completed){stage=2;setTimeout(renderWiring,180)}},260);
          }else{
            mistakes++;stageStatus="Component rejected · bay signature mismatch.";feedbackBurst(target||workbench,"wrong");
            const fb=document.querySelector(".feedback");if(fb)fb.textContent=stageStatus;
          }
        };

        document.addEventListener("pointermove",move,{passive:false});
        document.addEventListener("pointerup",up,{once:true});
      });
    });
  }

  function renderAssembly(){
    stage=1;
    shell(`<div class="game-instruction">
      Physically drag each module from the component tray into its matching installation bay.
      Wrong bays are rejected.
    </div>
    <div class="stark-workbench">
      <div class="stark-stage-title"><strong>STAGE 01 · MODULE INSTALLATION</strong><span>${placed.size}/${components.length} INSTALLED</span></div>
      <div class="stark-layout">
        <div class="stark-tray">
          <div class="stark-label">COMPONENT TRAY</div>
          ${components.filter(c=>!placed.has(c.key)).map(componentHtml).join("")||`<div class="notice">All modules transferred.</div>`}
        </div>
        <div class="stark-bay">
          <div class="stark-label">INSTALLATION BAYS</div>
          ${slotOrder.map(component=>`<div class="stark-slot ${placed.has(component.key)?"filled":""}" data-slot="${esc(component.key)}">
            ${placed.has(component.key)?componentHtml(component):`DROP · ${esc(component.sub)}`}
          </div>`).join("")}
        </div>
      </div>
    </div>
    <p class="feedback">${esc(stageStatus||"Drag a component to begin.")}</p>`);
    bindAssemblyDrag();
  }

  function drawWireLines(temp=null){
    const board=document.getElementById("starkWireBoard");
    const svg=document.getElementById("starkWireSvg");
    if(!board||!svg)return;

    const br=board.getBoundingClientRect();
    svg.setAttribute("viewBox",`0 0 ${br.width} ${br.height}`);
    let lines="";

    for(const key of wired){
      const a=board.querySelector(`.wire-port.from[data-wire="${key}"]`);
      const b=board.querySelector(`.wire-port.to[data-wire="${key}"]`);
      if(!a||!b)continue;
      const ar=a.getBoundingClientRect(), bb=b.getBoundingClientRect();
      const x1=ar.right-br.left-8,y1=ar.top+ar.height/2-br.top;
      const x2=bb.left-br.left+8,y2=bb.top+bb.height/2-br.top;
      lines+=`<path d="M${x1} ${y1} C${x1+60} ${y1},${x2-60} ${y2},${x2} ${y2}" fill="none" stroke="#54e4ff" stroke-width="3" stroke-linecap="round"/>`;
    }

    if(temp){
      lines+=`<path d="M${temp.x1} ${temp.y1} C${temp.x1+55} ${temp.y1},${temp.x2-55} ${temp.y2},${temp.x2} ${temp.y2}" fill="none" stroke="#4abfff" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>`;
    }

    svg.innerHTML=lines;
  }

  function bindWireDrag(){
    const board=document.getElementById("starkWireBoard");
    if(!board)return;

    board.querySelectorAll(".wire-port.from:not(.wired)").forEach(port=>{
      port.addEventListener("pointerdown",event=>{
        if(event.button!=null&&event.button!==0)return;
        event.preventDefault();

        const key=port.dataset.wire;
        board.classList.add("linking");feedbackBurst(port,"neutral");
        const br=board.getBoundingClientRect();
        const pr=port.getBoundingClientRect();
        const x1=pr.right-br.left-8;
        const y1=pr.top+pr.height/2-br.top;

        const move=e=>{
          drawWireLines({
            x1,y1,
            x2:e.clientX-br.left,
            y2:e.clientY-br.top
          });
        };

        const up=e=>{
          document.removeEventListener("pointermove",move);
          document.removeEventListener("pointerup",up);
          board.classList.remove("linking");
          const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".wire-port.to");

          if(target&&target.dataset.wire===key&&!wired.has(key)){
            wired.add(key);stageStatus=`${key} bus linked.`;feedbackBurst(target,"correct");
            setTimeout(()=>{renderWiring();if(wired.size===wireKeys.length&&activeScreen==="stark"&&!completed){stage=3;setTimeout(renderCalibration,180)}},220);
          }else{
            mistakes++;stageStatus="Cable rejected · endpoint signature mismatch.";feedbackBurst(target||board,"wrong");drawWireLines();
            const fb=document.querySelector(".feedback");if(fb)fb.textContent=stageStatus;
          }
        };

        document.addEventListener("pointermove",move,{passive:false});
        document.addEventListener("pointerup",up,{once:true});
      });
    });
  }

  function renderWiring(){
    stage=2;
    shell(`<div class="game-instruction">
      Drag a cable from each left-side output port to the matching right-side input.
      The cable follows your finger or pointer.
    </div>
    <div class="stark-workbench">
      <div class="stark-stage-title"><strong>STAGE 02 · POWER BUS ROUTING</strong><span>${wired.size}/${wireKeys.length} LINKS</span></div>
      <div class="wire-board" id="starkWireBoard">
        <svg class="wire-svg" id="starkWireSvg" aria-hidden="true"></svg>
        <div class="wire-column">
          ${wireLeft.map(item=>`<button class="wire-port from ${wired.has(item.key)?"wired":""}" data-wire="${item.key}" ${wired.has(item.key)?"disabled":""}>
            <span class="wire-dot"></span><span><small>OUTPUT ${item.key}</small>${esc(item.name)}</span>
          </button>`).join("")}
        </div>
        <div class="wire-column">
          ${wireRight.map(item=>`<button class="wire-port to ${wired.has(item.key)?"wired":""}" data-wire="${item.key}" ${wired.has(item.key)?"disabled":""}>
            <span class="wire-dot"></span><span><small>INPUT ${item.key}</small>${esc(item.name)}</span>
          </button>`).join("")}
        </div>
      </div>
    </div>
    <p class="feedback">${esc(stageStatus||"Route all four power buses.")}</p>`);
    requestAnimationFrame(drawWireLines);
    bindWireDrag();
  }

  async function finish(){
    if(completed)return;
    completed=true;

    const base=Math.max(120,300-mistakes*25);
    const gain=awardXp(base,"stark");
    prog.xp+=gain;
    prog.starkSolved=(prog.starkSolved||0)+1;
    recordGameResult("stark",{xp:gain,durationMs:Date.now()-startedAt,errors:mistakes});
    rollPostGamePowerup("stark");
    await save();

    shell(`<div class="stark-workbench">
      <div class="stark-stage-title"><strong>REPAIR COMPLETE</strong><span>ALL SYSTEMS NOMINAL</span></div>
      <div style="text-align:center;padding:42px 16px">
        <div style="font-size:4rem;color:#68eaff">◉</div>
        <h2>System restored</h2>
        <p class="lede">${mistakes?`${mistakes} repair error${mistakes===1?"":"s"} reduced the base reward.`:"Perfect installation and routing."}</p>
        <div class="reward">+${gain.toLocaleString()} XP</div>
        <div class="row" style="justify-content:center;margin-top:18px">

/* ============================================================
   GAME 10 · SLING RING NETWORK
   Procedural rotation / routing puzzle.
   ============================================================ */

const SLING_DIRS={
  N:{dr:-1,dc:0,opp:"S"},
  E:{dr:0,dc:1,opp:"W"},
  S:{dr:1,dc:0,opp:"N"},
  W:{dr:0,dc:-1,opp:"E"}
};

function slingDirection(a,b){
  if(b.r<a.r)return "N";
  if(b.r>a.r)return "S";
  if(b.c>a.c)return "E";
  return "W";
}

function slingConnections(type,rotation){
  rotation=((rotation%4)+4)%4;
  if(type==="straight"){
    return rotation%2===0?["N","S"]:["E","W"];
  }
  const corners=[
    ["N","E"],["E","S"],["S","W"],["W","N"]
  ];
  return corners[rotation];
}

function slingSameConnections(a,b){
  return a.length===b.length&&a.every(x=>b.includes(x));
}

function slingTargetRotation(connections){
  const type=(connections.includes("N")&&connections.includes("S"))||
             (connections.includes("E")&&connections.includes("W"))
             ?"straight":"corner";
  for(let rotation=0;rotation<4;rotation++){
    if(slingSameConnections(slingConnections(type,rotation),connections)){
      return {type,rotation};
    }
  }
  return {type:"corner",rotation:0};
}

function slingGeneratePath(size=5){
  for(let attempt=0;attempt<180;attempt++){
    const start={r:rnd([1,2,3]),c:0};
    const end={r:rnd([1,2,3]),c:size-1};
    const seen=new Set([`${start.r},${start.c}`]);
    const path=[start];

    function dfs(cell){
      if(cell.r===end.r&&cell.c===end.c){
        return path.length>=8?[...path]:null;
      }
      if(path.length>=18)return null;

      let dirs=sh(["N","E","S","W"]);
      // Slight eastward preference without making the route predictable.
      dirs.sort((a,b)=>(a==="E"?-0.35:Math.random())-(b==="E"?-0.35:Math.random()));

      for(const dir of dirs){
        const d=SLING_DIRS[dir];
        const next={r:cell.r+d.dr,c:cell.c+d.dc};
        if(next.r<0||next.r>=size||next.c<0||next.c>=size)continue;
        const key=`${next.r},${next.c}`;
        if(seen.has(key))continue;
        if(next.r===end.r&&next.c===end.c&&path.length<7)continue;

        seen.add(key);path.push(next);
        const result=dfs(next);
        if(result)return result;
        path.pop();seen.delete(key);
      }
      return null;
    }

    const found=dfs(start);
    if(found)return {start,end,path:found};
  }

  // Deterministic solvable fallback.
  const start={r:2,c:0},end={r:2,c:size-1};
  const path=[
    {r:2,c:0},{r:1,c:0},{r:1,c:1},{r:1,c:2},
    {r:2,c:2},{r:3,c:2},{r:3,c:3},{r:3,c:4},{r:2,c:4}
  ];
  return {start,end,path};
}

function slingBuildBoard(size=5){
  const generated=slingGeneratePath(size);
  const pathKeys=new Set(generated.path.map(p=>`${p.r},${p.c}`));
  const cells=[];

  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const key=`${r},${c}`;
      const pathIndex=generated.path.findIndex(p=>p.r===r&&p.c===c);

      if(pathIndex>=0){
        const prev=pathIndex===0?{r,c:c-1}:generated.path[pathIndex-1];
        const next=pathIndex===generated.path.length-1?{r,c:c+1}:generated.path[pathIndex+1];
        const connections=[slingDirection({r,c},prev),slingDirection({r,c},next)];
        const target=slingTargetRotation(connections);

        let rotation;
        if(target.type==="straight"){
          rotation=(target.rotation+1)%4;
        }else{
          rotation=(target.rotation+rnd([1,2,3]))%4;
        }

        cells.push({
          r,c,key,path:true,type:target.type,rotation,targetRotation:target.rotation
        });
      }else{
        cells.push({
          r,c,key,path:false,type:Math.random()<.48?"straight":"corner",
          rotation:Math.floor(Math.random()*4),targetRotation:null
        });
      }
    }
  }

  const optimal=cells.filter(x=>x.path).reduce((sum,cell)=>{
    const a=cell.rotation,b=cell.targetRotation;
    if(cell.type==="straight")return sum+(a%2===b%2?0:1);
    const diff=(b-a+4)%4;
    return sum+Math.min(diff,4-diff);
  },0);

  return {...generated,size,cells,pathKeys,optimalMoves:optimal};
}

function slingTrace(state){
  const byKey=new Map(state.cells.map(cell=>[cell.key,cell]));
  let r=state.start.r,c=state.start.c,incoming="W";
  const visited=new Set();
  const seenStates=new Set();

  for(let step=0;step<state.size*state.size*4;step++){
    const key=`${r},${c}`;
    const cell=byKey.get(key);
    if(!cell)return {solved:false,visited};

    const stateKey=`${key}:${incoming}`;
    if(seenStates.has(stateKey))return {solved:false,visited};
    seenStates.add(stateKey);
    visited.add(key);

    const connections=slingConnections(cell.type,cell.rotation);
    if(!connections.includes(incoming))return {solved:false,visited};

    const exit=connections.find(dir=>dir!==incoming);
    if(r===state.end.r&&c===state.end.c&&exit==="E"){
      return {solved:true,visited};
    }

    const d=SLING_DIRS[exit];
    const nr=r+d.dr,nc=c+d.dc;
    if(nr<0||nr>=state.size||nc<0||nc>=state.size)return {solved:false,visited};

    r=nr;c=nc;incoming=d.opp;
  }

  return {solved:false,visited};
}

function slingTileSvg(cell,energized){
  const connections=slingConnections(cell.type,cell.rotation);
  const edge={N:[50,2],E:[98,50],S:[50,98],W:[2,50]};
  const stroke=energized?"#b7f8ff":"#2e91bd";
  const glow=energized?`filter="drop-shadow(0 0 5px rgba(83,226,255,.55))"`:"";

  return `<svg viewBox="0 0 100 100" aria-hidden="true" ${glow}>
    ${connections.map(dir=>`<line x1="50" y1="50" x2="${edge[dir][0]}" y2="${edge[dir][1]}" stroke="${stroke}" stroke-width="${energized?11:7}" stroke-linecap="round"/>`).join("")}
    <circle cx="50" cy="50" r="11" fill="#06182c" stroke="${stroke}" stroke-width="4"/>
    <circle cx="50" cy="50" r="4" fill="${energized?"#6beaff":"#1c6587"}"/>
  </svg>`;
}

async function slingRingNetwork(replayId=null){
  activeScreen="sling";
  prog.games++;
  prog.slingPlayed=(prog.slingPlayed||0)+1;
  await save();

  const meta=resolvePuzzle("SLING",typeof replayId==="string"?replayId:null);
  const state=withPuzzleSeed(meta.seed,()=>slingBuildBoard(5));
  const validation=validateSlingGeneratedState(state);
  if(!validation.ok){screen.innerHTML=`<section class="mission"><p class="eyebrow">SLING RING NETWORK</p><h1>Puzzle validation failed.</h1><p>${esc(validation.reason)}</p><button class="btn" id="slingInvalidBack">Terminal</button></section>`;document.getElementById("slingInvalidBack").onclick=home;return}
  setCurrentPuzzle("SLING",meta.seed);
  const startedAt=Date.now();
  let moves=0;
  let completed=false;
  let message="Swipe a tile left or right to rotate it. A tap rotates clockwise.";

  async function finish(){
    if(completed)return;
    completed=true;

    const extra=Math.max(0,moves-state.optimalMoves);
    const base=Math.max(100,280-extra*8);
    const gain=awardXp(base,"sling");

    prog.xp+=gain;
    prog.slingSolved=(prog.slingSolved||0)+1;
    if(moves<=state.optimalMoves)prog.slingPerfect=(prog.slingPerfect||0)+1;
    recordGameResult("sling",{xp:gain,durationMs:Date.now()-startedAt,moves,score:moves<=state.optimalMoves?1:0});
    rollPostGamePowerup("sling");
    await save();

    render();
    const finishBox=document.getElementById("slingFinish");
    if(finishBox){
      finishBox.hidden=false;
      finishBox.innerHTML=`<h2>PORTAL NETWORK STABLE</h2>
        <p>${moves<=state.optimalMoves?"Perfect route: minimum required rotations.":`${extra} rotation${extra===1?"":"s"} above the generated optimum.`}</p>
        <div class="reward">+${gain.toLocaleString()} XP</div>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" id="slingAgain">Generate another network</button>
          <button class="btn" id="slingDone">Terminal</button>
        </div>`;
      document.getElementById("slingAgain").onclick=()=>slingRingNetwork();
      document.getElementById("slingDone").onclick=home;
    }
  }

  function rotate(index,delta,tile=null){
    if(completed)return;
    state.cells[index].rotation=(state.cells[index].rotation+delta+4)%4;moves++;
    const trace=slingTrace(state);message=trace.solved?"Energy path established…":"Network recalculating.";feedbackBurst(tile,trace.solved?"correct":"neutral");
    setTimeout(()=>{render();if(trace.solved)setTimeout(()=>activeScreen==="sling"&&finish(),140)},95);
  }

  function render(){
    const trace=slingTrace(state);

    screen.innerHTML=`<div class="missionhead">
      <button class="back" id="slingBack">← Terminal</button>
      <div><p class="eyebrow">GAME 10</p><h1>Sling Ring Network</h1></div>
      <div><div class="reward">${completed?"STABLE":"ROUTING"}</div>${puzzleIdInline()}</div>
    </div>
    <section class="mission" style="max-width:980px">
      <div class="interactive-hud">
        <div class="interactive-stat"><span>ROTATIONS</span><strong>${moves}</strong></div>
        <div class="interactive-stat"><span>GENERATED OPTIMUM</span><strong>${state.optimalMoves}</strong></div>
        <div class="interactive-stat"><span>NETWORK</span><strong>${trace.solved?"CONNECTED":"UNSTABLE"}</strong></div>
      </div>

      <div class="game-instruction">
        Build one continuous energy path from START to EXIT. Swipe left/right on any tile to rotate it in that direction;
        a short tap rotates clockwise. Glowing tiles show how far the current energy path can travel.
      </div>

      <div class="sling-shell">
        <div class="sling-board" id="slingBoard" style="grid-template-columns:repeat(${state.size},1fr)">
          ${state.cells.map((cell,index)=>{
            const energized=trace.visited.has(cell.key);
            const start=cell.r===state.start.r&&cell.c===state.start.c;
            const end=cell.r===state.end.r&&cell.c===state.end.c;
            return `<button class="sling-tile ${energized?"energized":""} ${start||end?"endpoint":""}"
              data-sling-index="${index}" ${completed?"disabled":""}>
              ${start?`<span class="sling-end-label">START</span>`:end?`<span class="sling-end-label">EXIT</span>`:""}
              ${slingTileSvg(cell,energized)}
            </button>`;
          }).join("")}
        </div>
        <div class="sling-legend"><span>Energy reaches glowing tiles</span><span>All tiles can be rotated</span></div>
      </div>

      <p class="feedback">${esc(message)}</p>
      <div class="evidence-complete" id="slingFinish" ${completed?"":"hidden"}></div>
    </section>`;

    document.getElementById("slingBack").onclick=home;

    document.querySelectorAll("[data-sling-index]").forEach(tile=>{
      let startX=0,startY=0,moved=false;

      tile.addEventListener("pointerdown",e=>{
        if(completed)return;
        e.preventDefault();
        startX=e.clientX;startY=e.clientY;moved=false;
      });

      tile.addEventListener("pointermove",e=>{
        if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8)moved=true;
      });

      tile.addEventListener("pointerup",e=>{
        if(completed)return;
        const dx=e.clientX-startX;
        const index=Number(tile.dataset.slingIndex);
        if(moved&&Math.abs(dx)>18)rotate(index,dx>0?1:-1,tile);
        else rotate(index,1,tile);
      });
    });
  }

  render();
}

async function evidenceBoardGame(replayId=null){
  activeScreen="evidence";
  prog.games++;
  prog.evidencePlayed=(prog.evidencePlayed||0)+1;
  await save();

  const meta=resolvePuzzle("EVID",typeof replayId==="string"?replayId:null);
  const validCases=EVIDENCE_CASES.filter(validateEvidenceCaseData);
  if(!validCases.length){screen.innerHTML=`<section class="mission"><p class="eyebrow">EVIDENCE BOARD</p><h1>No validated cases available.</h1><button class="btn" id="evidenceInvalidBack">Terminal</button></section>`;document.getElementById("evidenceInvalidBack").onclick=home;return}
  const generated=withPuzzleSeed(meta.seed,()=>{
    const caseData=rnd(validCases);
    const people=sh(caseData.pairs.map((pair,index)=>({id:`person-${index}`,kind:"person",name:pair[0],pairIndex:index})));
    const items=sh([...caseData.pairs.map((pair,index)=>({id:`item-${index}`,kind:"item",name:pair[1],pairIndex:index})),{id:"item-decoy",kind:"item",name:caseData.decoy,pairIndex:-1}]);
    return {caseData,people,items};
  });
  const {caseData,people,items}=generated;
  setCurrentPuzzle("EVID",meta.seed);
  const startedAt=Date.now();

  const nodes=[...people,...items];
  const correct=new Set(caseData.pairs.map((_,index)=>evidenceEdgeKey(`person-${index}`,`item-${index}`)));
  const links=new Set();

  let mistakes=0;
  let completed=false;
  let status="Panels are fixed. Drag a relationship line from one circular connector to the matching panel on the opposite side.";

  function initialPosition(node){
    const list=node.kind==="person"?people:items;
    const i=list.findIndex(x=>x.id===node.id);
    const count=list.length;
    const top=40+i*((490)/(Math.max(1,count-1)));
    return {
      left:node.kind==="person"?4:62,
      top
    };
  }

  const positions={};
  for(const node of nodes)positions[node.id]=initialPosition(node);

  function drawLines(temp=null){
    const board=document.getElementById("evidenceBoard");
    const svg=document.getElementById("evidenceSvg");
    if(!board||!svg)return;

    const br=board.getBoundingClientRect();
    svg.setAttribute("viewBox",`0 0 ${br.width} ${br.height}`);
    let out="";

    for(const key of links){
      const [aId,bId]=key.split("::");
      const a=board.querySelector(`[data-evidence-id="${aId}"]`);
      const b=board.querySelector(`[data-evidence-id="${bId}"]`);
      if(!a||!b)continue;
      const ar=a.getBoundingClientRect(),bb=b.getBoundingClientRect();
      const x1=ar.left+ar.width/2-br.left,y1=ar.top+ar.height/2-br.top;
      const x2=bb.left+bb.width/2-br.left,y2=bb.top+bb.height/2-br.top;
      out+=`<path d="M${x1} ${y1} C${(x1+x2)/2} ${y1},${(x1+x2)/2} ${y2},${x2} ${y2}"
        fill="none" stroke="#62e6ff" stroke-width="3" stroke-linecap="round"/>`;
      out+=`<circle cx="${x1}" cy="${y1}" r="4" fill="#62e6ff"/><circle cx="${x2}" cy="${y2}" r="4" fill="#62e6ff"/>`;
    }

    if(temp){
      out+=`<path d="M${temp.x1} ${temp.y1} C${(temp.x1+temp.x2)/2} ${temp.y1},${(temp.x1+temp.x2)/2} ${temp.y2},${temp.x2} ${temp.y2}"
        fill="none" stroke="#477dff" stroke-width="2" stroke-dasharray="7 5"/>`;
    }

    svg.innerHTML=out;
  }

  function isLinkedNode(id){
    return [...links].some(key=>key.split("::").includes(id));
  }

  async function finish(){
    if(completed)return;
    completed=true;

    const base=Math.max(130,320-mistakes*28);
    const gain=awardXp(base,"evidence");
    prog.xp+=gain;
    prog.evidenceSolved=(prog.evidenceSolved||0)+1;
    recordGameResult("evidence",{xp:gain,durationMs:Date.now()-startedAt,errors:mistakes,score:links.size});
    rollPostGamePowerup("evidence");
    await save();

    status="All verified relationships reconstructed.";
    render();

    const box=document.getElementById("evidenceFinish");
    if(box){
      box.hidden=false;
      box.innerHTML=`<h2>CASE RECONSTRUCTED</h2>
        <p>${mistakes?`${mistakes} incorrect link${mistakes===1?"":"s"} reduced the base reward.`:"No false relationships submitted."}</p>
        <div class="reward">+${gain.toLocaleString()} XP</div>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" id="evidenceAgain">New case</button>
          <button class="btn" id="evidenceDone">Terminal</button>
        </div>`;
      document.getElementById("evidenceAgain").onclick=()=>evidenceBoardGame();
      document.getElementById("evidenceDone").onclick=home;
    }
  }

  function bindNodeMovement(){
    // Panels are intentionally fixed. Only relationship lines can be dragged.
  }

  function bindLinkDrawing(){
    const board=document.getElementById("evidenceBoard");
    if(!board)return;

    board.querySelectorAll(".evidence-link-port").forEach(port=>{
      port.addEventListener("pointerdown",event=>{
        if(completed)return;
        event.preventDefault();
        event.stopPropagation();

        const source=port.closest(".evidence-node");
        const sourceId=source.dataset.evidenceId;
        if(isLinkedNode(sourceId))return;
        board.classList.add("linking");source.classList.add("link-source");feedbackBurst(source,"neutral");

        const br=board.getBoundingClientRect();
        const pr=port.getBoundingClientRect();
        const x1=pr.left+pr.width/2-br.left;
        const y1=pr.top+pr.height/2-br.top;

        const move=e=>{
          drawLines({x1,y1,x2:e.clientX-br.left,y2:e.clientY-br.top});
          board.querySelectorAll(".evidence-node").forEach(node=>node.classList.remove("link-target"));
          const candidate=document.elementFromPoint(e.clientX,e.clientY)?.closest(".evidence-node");
          if(candidate&&candidate!==source&&candidate.dataset.evidenceKind!==source.dataset.evidenceKind&&!isLinkedNode(candidate.dataset.evidenceId))candidate.classList.add("link-target");
        };

        const up=e=>{
          document.removeEventListener("pointermove",move);
          document.removeEventListener("pointerup",up);

          const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".evidence-node");
          board.classList.remove("linking");source.classList.remove("link-source");board.querySelectorAll(".evidence-node").forEach(node=>node.classList.remove("link-target"));
          if(!target||target===source||target.dataset.evidenceKind===source.dataset.evidenceKind||isLinkedNode(target.dataset.evidenceId)){feedbackBurst(source,"neutral");drawLines();return;}

          const targetId=target.dataset.evidenceId;
          const key=evidenceEdgeKey(sourceId,targetId);

          if(correct.has(key)){
            links.add(key);status="Verified relationship added.";feedbackBurst(target,"correct");
            setTimeout(()=>{render();if(links.size===correct.size)setTimeout(()=>activeScreen==="evidence"&&finish(),180)},210);
          }else{
            mistakes++;status="Relationship rejected · files do not match this recovered trace.";feedbackBurst(target,"wrong");
            const statusEl=document.querySelector(".evidence-status");if(statusEl){statusEl.className="evidence-status bad";statusEl.textContent=status}drawLines();
          }
        };

        document.addEventListener("pointermove",move,{passive:false});
        document.addEventListener("pointerup",up,{once:true});
      });
    });
  }

  function render(){
    screen.innerHTML=`<div class="missionhead">
      <button class="back" id="evidenceBack">← Terminal</button>
      <div><p class="eyebrow">GAME 11</p><h1>Evidence Board</h1></div>
      <div><div class="reward">${links.size}/${correct.size} LINKS</div>${puzzleIdInline()}</div>
    </div>
    <section class="mission" style="max-width:1080px">
      <div class="interactive-hud">
        <div class="interactive-stat"><span>CASE</span><strong>${esc(caseData.title)}</strong></div>
        <div class="interactive-stat"><span>VERIFIED</span><strong>${links.size} / ${correct.size}</strong></div>
        <div class="interactive-stat"><span>FALSE LINKS</span><strong>${mistakes}</strong></div>
      </div>

      <div class="game-instruction">
        Reconstruct ${correct.size} verified PERSONNEL ↔ EVIDENCE relationships.
        One evidence record is a decoy. Panels stay fixed in place. Drag from a dossier’s circular connector to a panel on the opposite side to draw a relationship line.
      </div>

      <div class="evidence-board" id="evidenceBoard">
        <svg class="evidence-svg" id="evidenceSvg" aria-hidden="true"></svg>
        ${nodes.map(node=>{
          const p=positions[node.id];
          const linked=isLinkedNode(node.id);
          const posStyle=p.leftPx!=null
            ?`left:${p.leftPx}px;top:${p.topPx}px`
            :`left:${p.left}%;top:${p.top}px`;
          return `<div class="evidence-node ${node.kind} ${linked?"linked":""}" data-evidence-id="${esc(node.id)}" data-evidence-kind="${esc(node.kind)}" style="${posStyle}">
            <small>${node.kind==="person"?"PERSONNEL FILE":"EVIDENCE FILE"}</small>
            <strong>${esc(node.name)}</strong>
            <span class="evidence-link-port" aria-hidden="true"></span>
          </div>`;
        }).join("")}
      </div>

      <p class="evidence-status ${status.includes("rejected")?"bad":status.includes("Verified")?"good":""}">${esc(status)}</p>
      <div class="evidence-complete" id="evidenceFinish" ${completed?"":"hidden"}></div>
    </section>`;

    document.getElementById("evidenceBack").onclick=home;
    requestAnimationFrame(drawLines);
    bindLinkDrawing();
  }

  render();
}

function mergeCuratedAoSRosterList(list){
  const profiles=[...(list||[])];
  for(const record of CURATED_AOS_ROSTER){
    const forms=new Set([record.name,...(record.aliases||[])].map(norm));
    let existing=profiles.find(profile=>
      forms.has(profile.canonical)||
      forms.has(norm(profile.name))||
      (profile.aliases||[]).some(alias=>forms.has(norm(alias)))
    );

    if(existing){
      existing.aliases=[...new Set([...(existing.aliases||[]),...(record.aliases||[])])]
        .filter(alias=>norm(alias)!==existing.canonical);
      existing.tags=[...new Set([...(existing.tags||[]),"agentsOfShieldShow","rosterSeriesDebut"])];
      if(!existing.firstProjectMeta)existing.firstProjectMeta={...CURATED_AOS_PROJECT_META};
      continue;
    }

    profiles.push({
      name:record.name,
      canonical:norm(record.name),
      aliases:[...(record.aliases||[])],
      remoteIds:[],
      tags:["agentsOfShieldShow","rosterSeriesDebut"],
      descriptions:["Curated Agents of S.H.I.E.L.D. roster record."],
      firstProjectMeta:{...CURATED_AOS_PROJECT_META},
      uid:"aos-curated-"+norm(record.name)
    });
  }

  return profiles
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map((profile,index)=>({...profile,uid:profile.uid||`roster-curated-${index+1}`}));
}

function rosterCuratedIn(profile,group){
  return (profile?.curatedGroups||[]).includes(group);
}

function mergeCuratedMajorRosterList(list){
  const profiles=[...(list||[])];

  for(const record of CURATED_MAJOR_ROSTER){
    const forms=new Set([record.name,...(record.aliases||[])].map(norm));
    let existing=profiles.find(profile=>{
      const profileForms=[
        profile.canonical,
        norm(profile.name),
        ...(profile.aliases||[]).map(norm)
      ].filter(Boolean);
      return profileForms.some(form=>forms.has(form));
    });

    if(existing){
      existing.aliases=[...new Set([...(existing.aliases||[]),...(record.aliases||[])])]
        .filter(alias=>norm(alias)!==existing.canonical);
      existing.curatedGroups=[...new Set([...(existing.curatedGroups||[]),...(record.groups||[])])];
      existing.curatedReleased=true;
      continue;
    }

    profiles.push({
      name:record.name,
      canonical:norm(record.name),
      aliases:[...(record.aliases||[])],
      remoteIds:[],
      tags:[],
      descriptions:["Curated major-character audit record."],
      firstProjectMeta:null,
      curatedGroups:[...(record.groups||[])],
      curatedReleased:true,
      uid:"major-curated-"+norm(record.name)
    });
  }

  return profiles
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map((profile,index)=>({...profile,uid:profile.uid||`roster-major-${index+1}`}));
}

function rosterMajorEnough(profile){
  const forms=[profile?.canonical,norm(profile?.name||""),...(profile?.aliases||[]).map(norm)].filter(Boolean);
  return forms.some(form=>ROSTER_MAJOR_ONLY.has(form));
}

function rosterMajorAuditSummary(list){
  const profiles=list||[];
  const missingByGroup={};

  const groups=[...new Set(CURATED_MAJOR_ROSTER.flatMap(record=>record.groups||[]))];
  for(const group of groups){
    const required=CURATED_MAJOR_ROSTER.filter(record=>(record.groups||[]).includes(group));
    const missing=required.filter(record=>{
      const forms=new Set([record.name,...(record.aliases||[])].map(norm));
      return !profiles.some(profile=>{
        const profileForms=[profile.canonical,norm(profile.name),...(profile.aliases||[]).map(norm)];
        return profileForms.some(form=>forms.has(form));
      });
    });
    if(missing.length)missingByGroup[group]=missing.map(record=>record.name);
  }

  return {
    required:CURATED_MAJOR_ROSTER.length,
    missingTotal:Object.values(missingByGroup).reduce((sum,list)=>sum+list.length,0),
    missingByGroup
  };
}

function rosterParseAliases(record){
  const aliases=[];
  const raw=record?.alias;
  if(Array.isArray(raw)){
    aliases.push(...raw);
  }else if(raw){
    aliases.push(String(raw));
    if(String(raw).includes(";"))aliases.push(...String(raw).split(";"));
    if(String(raw).includes("|"))aliases.push(...String(raw).split("|"));
  }
  return [...new Set(aliases.map(x=>String(x).trim()).filter(Boolean))];
}

function rosterFirstKnownProject(record,moviesById,showsById){
  const movie=record?.first_appearance_movie_id?moviesById.get(Number(record.first_appearance_movie_id)):null;
  const show=record?.first_appearance_tvshow_id?showsById.get(Number(record.first_appearance_tvshow_id)):null;

  if(movie&&show){
    const md=movie.release_date||"9999-12-31";
    const sd=show.release_date||"9999-12-31";
    return md<=sd?movie:show;
  }
  return movie||show||null;
}

function rosterProjectMeta(project){
  if(!project)return null;
  return {
    id:Number(project.id)||0,
    title:String(project.title||""),
    type:String(project.type||""),
    phase:Number(project.phase)||0,
    release_date:String(project.release_date||"")
  };
}

function rosterProjectEarlier(a,b){
  if(!a)return b||null;
  if(!b)return a;
  const ad=a.release_date||"9999-12-31";
  const bd=b.release_date||"9999-12-31";
  return bd<ad?b:a;
}

function rosterIsUpcoming(profile){
  if(profile?.curatedReleased===true)return false;
  const project=profile.firstProjectMeta;
  if(!project||!project.release_date)return true;
  const time=new Date(`${project.release_date}T00:00:00Z`).getTime();
  return !Number.isFinite(time)||time>Date.now();
}

function rosterBaseTags(record,project){
  const tags=new Set([...deriveDescriptionTags(record)]);
  const title=String(project?.title||"").toLowerCase();
  const phase=Number(project?.phase)||0;

  if(phase>0)tags.add(`rosterPhase${phase}`);
  if(project?.type==="movie")tags.add("rosterMovieDebut");
  if(project?.type==="tvshow")tags.add("rosterSeriesDebut");

  if(title.includes("agents of s.h.i.e.l.d"))tags.add("agentsOfShieldShow");
  if(title.includes("iron man"))tags.add("ironManTitle");
  if(title.includes("captain america"))tags.add("captainAmericaTitle");
  if(title.includes("thor"))tags.add("thorTitle");
  if(title.includes("avengers"))tags.add("avengersTitle");
  if(title.includes("guardians of the galaxy"))tags.add("guardiansTitle");
  if(title.includes("spider-man"))tags.add("spiderManTitle");
  if(title.includes("doctor strange"))tags.add("doctorStrangeTitle");
  if(title.includes("black panther"))tags.add("blackPantherTitle");
  if(title.includes("ant-man"))tags.add("antManTitle");
  if(title.includes("captain marvel")||title==="the marvels")tags.add("captainMarvelTitle");

  return tags;
}

function rosterManualAliasesFor(name){
  const n=norm(name);
  const aliases=[];

  for(const c of characters){
    if(norm(c.name)===n)aliases.push(...(c.aliases||[]));
  }
  for(const p of gridProfiles||[]){
    if(norm(p.name)===n)aliases.push(...(p.aliases||[]));
  }

  return [...new Set(aliases.filter(Boolean))];
}

function rosterMergeRecord(map,record,project){
  const canonical=norm(record.name);
  if(!canonical)return;

  const tags=rosterBaseTags(record,project);
  const aliases=[...rosterParseAliases(record),...rosterManualAliasesFor(record.name)];
  const meta=rosterProjectMeta(project);
  const existing=map.get(canonical);

  if(existing){
    existing.remoteIds=[...new Set([...existing.remoteIds,...(record.id!=null?[record.id]:[])])];
    existing.aliases=[...new Set([...existing.aliases,...aliases])]
      .filter(alias=>norm(alias)!==canonical);
    existing.tags=[...new Set([...existing.tags,...tags])];
    if(record.description&&!existing.descriptions.includes(record.description))existing.descriptions.push(record.description);
    existing.firstProjectMeta=rosterProjectEarlier(existing.firstProjectMeta,meta);
    return;
  }

  map.set(canonical,{
    name:String(record.name),
    canonical,
    aliases:[...new Set(aliases)].filter(alias=>norm(alias)!==canonical),
    remoteIds:record.id!=null?[record.id]:[],
    tags:[...tags],
    descriptions:record.description?[String(record.description)]:[],
    firstProjectMeta:meta
  });
}

async function loadCompleteMarvelRoster(){
  if(completeMarvelRosterLoaded)return completeMarvelRoster;
  if(completeMarvelRosterLoading)return completeMarvelRosterLoading;

  completeMarvelRosterLoading=(async()=>{
    try{
      const [charactersResponse,moviesResponse,tvResponse]=await Promise.all([
        fetch(MCU_ROSTER_URL,{cache:"no-store"}),
        fetch(MCU_MOVIES_URL,{cache:"no-store"}),
        fetch(MCU_TV_URL,{cache:"no-store"})
      ]);

      if(!charactersResponse.ok||!moviesResponse.ok||!tvResponse.ok){
        throw new Error("Complete Marvel character source is unavailable.");
      }

      const [records,movies,shows]=await Promise.all([
        charactersResponse.json(),
        moviesResponse.json(),
        tvResponse.json()
      ]);

      if(!Array.isArray(records)||!Array.isArray(movies)||!Array.isArray(shows)){
        throw new Error("Roster source returned an unexpected format.");
      }

      // Preserve these shared title lists for categories/Six Degrees.
      fullMcuMovies=movies;
      fullMcuShows=shows;

      const moviesById=new Map(movies.map(item=>[Number(item.id),item]));
      const showsById=new Map(shows.map(item=>[Number(item.id),item]));
      const byName=new Map();

      for(const record of records){
        if(!record?.name)continue;
        const project=rosterFirstKnownProject(record,moviesById,showsById);
        // IMPORTANT: there is deliberately NO release-date filter here.
        // Publicly catalogued future characters stay in the Roster game.
        rosterMergeRecord(byName,record,project);
      }

      completeMarvelRoster=mergeCuratedMajorRosterList(
        mergeCuratedAoSRosterList(
          [...byName.values()]
            .sort((a,b)=>a.name.localeCompare(b.name))
            .map((profile,index)=>({...profile,uid:`roster-${index+1}`}))
        )
      ).filter(rosterMajorEnough);

      const rosterAudit=rosterMajorAuditSummary(completeMarvelRoster);
      if(rosterAudit.missingTotal)console.warn("Major roster audit still has gaps.",rosterAudit);

      completeMarvelRosterLoaded=true;
      completeMarvelRosterError=false;
      return completeMarvelRoster;
    }catch(error){
      console.warn("Complete Marvel Roster source failed.",error);
      completeMarvelRosterError=true;

      // Safe fallback: use the already-loaded released roster.
      await loadFullGridRoster();
      completeMarvelRoster=mergeCuratedMajorRosterList(
        mergeCuratedAoSRosterList((gridProfiles||[]).map((profile,index)=>({
          name:profile.name,
          canonical:norm(profile.name),
          aliases:[...(profile.aliases||[])],
          remoteIds:[...(profile.remoteIds||[profile.remoteId].filter(v=>v!=null))],
          tags:[...(profile.tags||[])],
          descriptions:[profile.description||""].filter(Boolean),
          firstProjectMeta:profile.firstProjectMeta||null,
          uid:`roster-fallback-${index+1}`
        })))
      ).filter(rosterMajorEnough);
      const rosterAudit=rosterMajorAuditSummary(completeMarvelRoster);
      if(rosterAudit.missingTotal)console.warn("Fallback major roster audit still has gaps.",rosterAudit);
      return completeMarvelRoster;
    }finally{
      completeMarvelRosterLoading=null;
    }
  })();

  return completeMarvelRosterLoading;
}

function rosterArchiveProjectTitles(profile){
  const titles=new Set();
  if(profile.firstProjectMeta?.title)titles.add(profile.firstProjectMeta.title);

  if(sixArchiveLooksValid(sixArchive)){
    for(const id of profile.remoteIds||[]){
      for(const key of sixArchive.filmographies?.[String(id)]||[]){
        const project=sixArchive.projects?.[key];
        if(project?.title)titles.add(project.title);
      }
    }
  }

  return [...titles];
}

function rosterAppearsIn(profile,needles){
  const wanted=(Array.isArray(needles)?needles:[needles]).map(x=>norm(x));
  return rosterArchiveProjectTitles(profile).some(title=>{
    const n=norm(title);
    return wanted.some(needle=>n.includes(needle));
  });
}

function rosterHasTag(profile,tag){
  return (profile.tags||[]).includes(tag);
}

function rosterDescription(profile){
  return (profile.descriptions||[]).join(" ").toLowerCase();
}

function rosterIsAvenger(profile){
  return rosterHasTag(profile,"avenger")||ROSTER_CURATED_AVENGERS.has(profile.canonical)||rosterCuratedIn(profile,"avengers");
}

function rosterIsGuardian(profile){
  return rosterHasTag(profile,"guardian")||ROSTER_CURATED_GUARDIANS.has(profile.canonical)||rosterCuratedIn(profile,"gotg");
}

function rosterIsAgentsOfShield(profile){
  return rosterHasTag(profile,"agentsOfShieldShow")||
    rosterAppearsIn(profile,["agents of s.h.i.e.l.d.","agentsofshield"])||
    ROSTER_AOS_NAMES.has(profile.canonical)||
    rosterCuratedIn(profile,"agents-of-shield");
}

function rosterAppearanceCount(profile){
  if(!sixArchiveLooksValid(sixArchive))return 0;
  const projects=new Set();
  for(const id of profile.remoteIds||[]){
    for(const key of sixArchive.filmographies?.[String(id)]||[])projects.add(key);
  }
  return projects.size;
}

function rosterCharacterXp(profile){
  // Minimum is always 20 XP.
  if(rosterIsUpcoming(profile))return 100;
  if(ROSTER_ICONIC_NAMES.has(profile.canonical))return 20;

  const appearances=rosterAppearanceCount(profile);
  if(appearances>=8)return 20;
  if(appearances>=5)return 25;
  if(appearances>=3)return 35;
  if(appearances===2)return 50;
  if(appearances===1)return 75;

  // Fallback if the shared appearance archive is not available.
  if(rosterIsAvenger(profile)||rosterIsGuardian(profile))return 25;
  if(rosterHasTag(profile,"villain")||rosterHasTag(profile,"shield")||rosterHasTag(profile,"asgardian"))return 35;
  const phase=Number(profile.firstProjectMeta?.phase)||0;
  if(phase>0&&phase<=3)return 40;
  return 50;
}

function rosterXpTier(profile){
  const xp=rosterCharacterXp(profile);
  if(xp<=20)return "ICONIC";
  if(xp<=25)return "CORE";
  if(xp<=35)return "FAMILIAR";
  if(xp<=50)return "OBSCURE";
  if(xp<=75)return "DEEP CUT";
  return rosterIsUpcoming(profile)?"UPCOMING":"ARCHIVE";
}

function rosterCompletionBonus(count){
  count=Math.max(0,Number(count)||0);
  if(count<=10)return 250;
  if(count<=25)return 750;
  if(count<=50)return 2000;
  if(count<=100)return 5000;
  if(count<=200)return 12000;
  return 25000+Math.floor((count-200)/50)*5000;
}

function rosterAvailableBaseXp(profiles){
  return profiles.reduce((sum,p)=>sum+rosterCharacterXp(p),0)+rosterCompletionBonus(profiles.length);
}

    {id:"hydra",name:"HYDRA",description:"Major HYDRA operatives, leaders and affiliated characters.",filter:p=>rosterHasTag(p,"hydra")||rosterCuratedIn(p,"hydra")},
    {id:"wakanda",name:"Wakanda",description:"Major Wakandan and Black Panther-linked characters.",filter:p=>rosterHasTag(p,"wakandan")||rosterAppearsIn(p,["black panther","wakanda forever"])||rosterCuratedIn(p,"wakanda")},
    {id:"asgard",name:"Asgard",description:"Major Asgardians and key Thor/Asgard-linked characters.",filter:p=>rosterHasTag(p,"asgardian")||rosterAppearsIn(p,["thor","loki"])||rosterCuratedIn(p,"asgard")},
    {id:"tva",name:"TVA",description:"Major TVA personnel and timeline-linked characters.",filter:p=>rosterHasTag(p,"tva")||(rosterAppearsIn(p,["loki"])&&rosterDescription(p).includes("tva"))||rosterCuratedIn(p,"tva")},
    {id:"mystic",name:"Mystic Arts",description:"Major sorcerers, witches and characters strongly connected to the mystic side of the MCU.",filter:p=>rosterHasTag(p,"mystic")||rosterHasTag(p,"sorcerer")||rosterCuratedIn(p,"mystic")},
    {id:"movie-debut",name:"Movie Debuts",description:"Characters first recorded in an MCU movie, with curated fallback coverage.",filter:p=>p.firstProjectMeta?.type==="movie"||rosterCuratedIn(p,"movie-debut")},
    {id:"series-debut",name:"Series Debuts",description:"Characters first recorded in a TV/streaming series, with curated fallback coverage.",filter:p=>p.firstProjectMeta?.type==="tvshow"||rosterCuratedIn(p,"series-debut")},
  ];

  const phases=[...new Set(completeMarvelRoster.map(p=>Number(p.firstProjectMeta?.phase)||0).filter(n=>n>0))].sort((a,b)=>a-b);
  for(const phase of phases){
    defs.push({
      id:`phase-${phase}`,
      name:`Phase ${phase}`,
      description:`Characters whose first recorded MCU appearance is in Phase ${phase}.`,
      filter:p=>Number(p.firstProjectMeta?.phase)===phase||rosterCuratedIn(p,`phase-${phase}`)
    });
  }

  const franchises=[
    ["iron-man","Iron Man","iron man"],
    ["captain-america","Captain America","captain america"],
    ["thor-franchise","Thor","thor"],
    ["avengers-films","Avengers Films","avengers"],
    ["guardians-films","Guardians Films","guardians of the galaxy"],
    ["spider-man","Spider-Man","spider-man"],
    ["doctor-strange","Doctor Strange","doctor strange"],
    ["black-panther","Black Panther","black panther"],
    ["ant-man","Ant-Man","ant-man"],
    ["captain-marvel","Captain Marvel / The Marvels",["captain marvel","the marvels"]]
  ];

  for(const [id,name,needle] of franchises){
    defs.push({
      id,
      name,
      description:`Characters recorded in ${name} screen projects.`,
      filter:p=>rosterAppearsIn(p,needle)||rosterCuratedIn(p,id)
    });
  }

  return defs.filter(def=>completeMarvelRoster.some(def.filter));
}

function rosterHash(value){
  let h=2166136261;
  for(const char of String(value)){
    h^=char.charCodeAt(0);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}

  tonystark:["Tony"],steverogers:["Steve","Cap"],natasharomanoff:["Nat","Natasha"],
  clintbarton:["Clint"],brucebanner:["Bruce","Banner"],wandamaximoff:["Wanda"],

  happyhogan:["Happy"],nickfury:["Fury"],philcoulson:["Coulson"],peterquill:["Quill"],
  rocketraccoon:["Rocket"],yelenabelova:["Yelena"],katebishop:["Kate"],caroldanvers:["Carol"],
  scottlang:["Scott"],hopvandyne:["Hope"],kamalakhan:["Kamala"],marcspector:["Marc"],
  mattmurdock:["Matt"],daisyjohnson:["Daisy"],leofitz:["Fitz"],jemmasimmons:["Simmons"],
  alphonsomackenzie:["Mack"],elenarodriguez:["Yo-Yo","Yoyo"]
};

function rosterAcceptedNames(profile){
  const nicknames=ROSTER_COMMON_NICKNAMES[profile.canonical]||[];
  const shared=CHARACTER_COMMON_NAMES[profile.name]||[];
  const expanded=new Set();
  [profile.name,...(profile.aliases||[]),...nicknames,...shared].forEach(value=>
    expandCharacterNameForms(value).forEach(form=>expanded.add(form))
  );
  const parts=String(profile.name).replace(/[()]/g," ").trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2){expanded.add(parts[0]);expanded.add(parts[parts.length-1])}
  return [...expanded].filter(Boolean);
}

function rosterFindExact(input,profiles,guessedIds){
  const value=norm(input);
  if(!value)return {profile:null,ambiguous:false};

  const matches=profiles.filter(profile=>{
    if(guessedIds.has(profile.uid))return false;
    return rosterAcceptedNames(profile).some(name=>norm(name)===value);
  });

  if(matches.length===1)return {profile:matches[0],ambiguous:false};

  // If an alias belongs to multiple people (Ant-Man, Wasp, etc.),
  // require the character's actual name instead of guessing arbitrarily.
  if(matches.length>1){
    const direct=matches.filter(profile=>profile.canonical===value);
    if(direct.length===1)return {profile:direct[0],ambiguous:false};
    return {profile:null,ambiguous:true};
  }

  return {profile:null,ambiguous:false};
}

function rosterEditDistance(a,b){
  a=norm(a);b=norm(b);
  if(!a||!b)return 99;
  if(Math.abs(a.length-b.length)>3)return 99;

  const prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let left=i,diag=i-1;
    for(let j=1;j<=b.length;j++){
      const up=prev[j];
      const next=Math.min(
        up+1,
        left+1,
        diag+(a[i-1]===b[j-1]?0:1)
      );
      prev[j-1]=left;
      diag=up;
      left=next;
    }
    prev[b.length]=left;
  }
  return prev[b.length];
}

function rosterCloseMatch(input,profiles,guessedIds){
  const value=norm(input);
  if(value.length<4)return false;

  let best=99;
  for(const profile of profiles){
    if(guessedIds.has(profile.uid))continue;
    for(const name of rosterAcceptedNames(profile)){
      const n=norm(name);
      const threshold=n.length>=9?2:1;
      const distance=rosterEditDistance(value,n);
      if(distance<best)best=distance;
      if(distance<=threshold)return true;
    }
  }
  return false;
}

function rosterSortProfiles(profiles,sort,guessedIds){
  const arr=[...profiles];
  if(sort==="az")return arr.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==="xp")return arr.sort((a,b)=>rosterCharacterXp(b)-rosterCharacterXp(a)||a.name.localeCompare(b.name));
  if(sort==="remaining")return arr.sort((a,b)=>{
    const ag=guessedIds.has(a.uid)?1:0,bg=guessedIds.has(b.uid)?1:0;
    return ag-bg||a.name.localeCompare(b.name);
  });
  return arr;
}

function escapeDistinct(values){
  const seen=new Set();
  return (values||[]).filter(value=>{
    if(value==null||String(value).trim()==="")return false;
    const key=norm(value);
    if(!key||seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function escapeMcq(label,q,answer,distractors){
  const a=String(answer);
  const pool=escapeDistinct(distractors).filter(x=>norm(x)!==norm(a));
  if(pool.length<3)return null;
  return {label,q,a,answers:[a],o:sh([a,...sh(pool).slice(0,3)]),mode:"mcq"};
}

function escapeTyped(label,q,answers,placeholder="Enter answer"){
  answers=escapeDistinct(answers);
  if(!answers.length)return null;
  return {label,q,a:answers[0],answers,mode:"text",placeholder};
}

function escapeNumber(label,q,answer){
  return {label,q,a:String(answer),answers:[String(answer)],mode:"number",placeholder:"Enter number"};
}

let escapeActiveCharacters=characters;
function escapeCharacters(){return escapeActiveCharacters?.length?escapeActiveCharacters:characters}

function escapeOtherCharacters(target,predicate=()=>true){
  return escapeCharacters().filter(c=>c.name!==target.name&&predicate(c));
}

function escapeOtherArtifacts(target,predicate=()=>true){
  return standardArtifacts.filter(a=>a.name!==target.name&&predicate(a));
}

function escapeCharacterFactPool(key){
  return escapeDistinct(escapeCharacters().flatMap(c=>Array.isArray(c[key])?c[key]:[c[key]]));
}
