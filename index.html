<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S.H.I.E.L.D. Marvel Arcade</title>
  <style>
    :root{
      --bg:#04070a;--panel:#0d141a;--panel2:#111c24;--line:#263a47;--line2:#375565;
      --text:#edf7fa;--muted:#8fa5af;--accent:#6fd8ff;--accentSoft:#6fd8ff16;
      --ok:#95e8bf;--bad:#ff9d9d;--shadow:0 22px 60px rgba(0,0,0,.32)
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;color:var(--text);min-height:100%;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 14% 0%,rgba(37,102,130,.24),transparent 30%),
        radial-gradient(circle at 88% 18%,rgba(36,89,110,.10),transparent 27%),
        linear-gradient(180deg,#05090d 0%,#030609 100%);
      position:relative
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.15;
      background-image:
        linear-gradient(rgba(111,216,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(111,216,255,.10) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:linear-gradient(to bottom,black,transparent 72%)
    }
    button,input{font:inherit}
    button{color:inherit}
    .top{
      position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:12px;align-items:center;
      padding:14px 18px;border-bottom:1px solid #2b4350;
      background:linear-gradient(180deg,rgba(6,11,15,.96),rgba(4,8,11,.91));
      backdrop-filter:blur(18px) saturate(130%);
      box-shadow:0 10px 35px rgba(0,0,0,.18)
    }
    .brand{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left}
    .mark{
      display:grid;place-items:center;width:38px;height:42px;border:1px solid var(--accent);
      border-radius:10px 10px 18px 18px;color:var(--accent);font-weight:900;
      background:linear-gradient(145deg,rgba(111,216,255,.10),rgba(111,216,255,.01));
      box-shadow:inset 0 0 18px rgba(111,216,255,.05),0 0 24px rgba(111,216,255,.07)
    }
    .brand strong{display:block;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-top:2px}
    .stats{display:flex;gap:8px;align-items:center}
    .pill{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#0b1116}.pill span{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.12em}.pill strong{font-size:.9rem}
    main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:42px 0 58px}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:end}
    .eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.18em;margin:0 0 8px}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.035em}
    h2{line-height:1.2}.lede{color:var(--muted);line-height:1.65;max-width:700px}
    .card,.mission,.case,.db{
      border:1px solid var(--line);
      background:linear-gradient(145deg,rgba(16,24,32,.96),rgba(7,13,17,.96));
      border-radius:20px;box-shadow:0 16px 44px rgba(0,0,0,.16)
    }
    .card{padding:18px}.progress{height:7px;background:#1d2830;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--accent)}
    .gamegrid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));
      column-gap:26px;row-gap:28px;margin-top:34px
    }
    .game{
      min-height:310px;padding:20px 20px 64px;border:1px solid var(--line);border-radius:22px;
      background:linear-gradient(160deg,rgba(17,28,36,.97),rgba(7,12,16,.99) 68%);
      cursor:pointer;text-align:left;position:relative;overflow:hidden;isolation:isolate;
      transition:border-color .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease
    }
    .game::before{
      content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;
      background:
        linear-gradient(90deg,transparent 0 16%,rgba(111,216,255,.04) 16.2%,transparent 16.4%),
        linear-gradient(180deg,rgba(111,216,255,.04),transparent 38%)
    }
    .game::after{
      content:"";position:absolute;left:-20%;right:-20%;height:1px;top:20%;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      opacity:.12;pointer-events:none;animation:cardScan 6s linear infinite
    }
    .game-topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .game-status{
      font-size:.61rem;letter-spacing:.12em;color:#8eb9c9;border:1px solid #294552;
      border-radius:999px;padding:5px 8px;background:rgba(111,216,255,.035)
    }
    .game-visual{
      height:96px;margin:16px 0 12px;border:1px solid #233844;border-radius:16px;
      display:grid;place-items:center;position:relative;overflow:hidden;
      background:radial-gradient(circle at 50% 45%,rgba(111,216,255,.10),transparent 50%),rgba(5,12,16,.75)
    }
    .game-visual::before{
      content:"";position:absolute;inset:10px;border:1px dashed rgba(111,216,255,.08);
      border-radius:12px;pointer-events:none
    }
    .game-visual svg{
      width:72px;height:72px;fill:none;stroke:var(--accent);stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round;
      filter:drop-shadow(0 0 10px rgba(111,216,255,.13));
      transition:transform .22s ease
    }
    .game-visual .soft{opacity:.34}.game-visual .pulse-dot{transform-origin:center;animation:uiPulse 2.4s ease-in-out infinite}
    .game strong{display:block;margin-top:4px;font-size:1.28rem;letter-spacing:-.015em}
    .game p{color:var(--muted);line-height:1.52;margin:9px 0 0;font-size:.88rem}
    .num{color:#607985;font-size:.7rem;letter-spacing:.16em}
    .meta{
      position:absolute;left:20px;right:20px;bottom:18px;border-top:1px solid var(--line);
      padding-top:12px;color:#b8c9d0;font-size:.78rem
    }
    .meta::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#557783;margin-right:7px;vertical-align:1px}
    [data-g="e"] .game-visual{background:radial-gradient(circle at 50% 60%,rgba(104,176,201,.16),transparent 50%),#081116}
    [data-g="g"] .game-visual{background:radial-gradient(circle at 50% 50%,rgba(111,216,255,.14),transparent 48%),#081116}
    [data-g="d"] .game-visual{background:radial-gradient(circle at 50% 45%,rgba(108,193,174,.11),transparent 48%),#081116}
    [data-g="a"] .game-visual{background:radial-gradient(circle at 50% 45%,rgba(167,138,205,.11),transparent 48%),#081116}
    [data-g="q"] .game-visual{background:radial-gradient(circle at 50% 50%,rgba(111,216,255,.11),transparent 52%),#081116}
    [data-g="grid"] .game-visual{background:radial-gradient(circle at 50% 50%,rgba(111,216,255,.12),transparent 52%),#081116}
    [data-g="six"] .game-visual{background:radial-gradient(circle at 50% 50%,rgba(122,188,255,.12),transparent 52%),#081116}
    [data-g="heist"] .game-visual{background:radial-gradient(circle at 50% 50%,rgba(197,167,94,.11),transparent 52%),#081116}
    @media (hover:hover) and (pointer:fine){
      .game:hover{
        border-color:#4d788c;transform:translateY(-5px);
        box-shadow:0 22px 56px rgba(0,0,0,.30),0 0 0 1px rgba(111,216,255,.035);
        background:linear-gradient(160deg,rgba(21,36,45,.98),rgba(7,13,17,.98) 68%)
      }
      .game:hover .game-visual svg{transform:scale(1.05)}
    }
    .game:active{transform:scale(.985)}
    .game.launching{border-color:var(--accent);box-shadow:0 0 0 1px rgba(111,216,255,.14),0 18px 48px rgba(0,0,0,.28)}
    .mission{max-width:820px;margin:0 auto;padding:24px}.missionhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
    .back,.btn,.choice{min-height:44px;border-radius:11px;cursor:pointer;position:relative;overflow:hidden}
    .back{border:0;background:none;color:var(--muted);padding:8px;transition:color .18s ease,transform .18s ease}
    .btn{
      padding:10px 15px;border:1px solid var(--line);background:linear-gradient(145deg,#111b23,#0b1218);
      font-weight:700;transition:transform .16s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease
    }
    .btn.primary{background:linear-gradient(135deg,#79ddff,#5bc6ed);border-color:#80dcfb;color:#051018;box-shadow:0 7px 22px rgba(111,216,255,.09)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .choice{
      padding:14px;border:1px solid var(--line);background:linear-gradient(145deg,#0b141a,#080e12);
      text-align:left;transition:transform .16s ease,border-color .18s ease,background .18s ease
    }
    @media (hover:hover) and (pointer:fine){
      .btn:hover,.choice:hover,.difficulty:hover,.person:hover,.suggestion:hover{border-color:#4f788a}
      .btn:not(:disabled):hover,.choice:not(:disabled):hover{transform:translateY(-1px)}
      .back:hover{color:var(--text);transform:translateX(-2px)}
    }
    .btn:active:not(:disabled),.choice:active:not(:disabled),.difficulty:active,.person:active,.suggestion:active{transform:scale(.985)}
    .feedback{min-height:24px;color:#b1c1c8;margin-top:16px}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
    .form input,.search input{
      min-height:48px;border-radius:11px;border:1px solid var(--line);background:#050a0e;color:var(--text);
      padding:10px 13px;font-size:16px;width:100%;outline:none;
      transition:border-color .18s ease,box-shadow .18s ease,background .18s ease
    }
    .form input:focus,.search input:focus{border-color:#4e849a;box-shadow:0 0 0 3px rgba(111,216,255,.07);background:#071016}
    .clues{display:grid;gap:10px;margin:16px 0}
    .clue{
      border:1px solid var(--line);border-radius:13px;padding:14px;
      background:linear-gradient(145deg,rgba(13,22,28,.8),rgba(7,12,16,.75));
      transition:border-color .2s ease,background .2s ease
    }
    .clue span{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-bottom:6px}.hidden{opacity:.31}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.reward{display:inline-block;padding:8px 12px;border:1px solid #355364;border-radius:10px;color:var(--accent);font-weight:800;margin:8px 0}
    .casegrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:14px}.case,.db{padding:20px}.case p{color:var(--muted);line-height:1.55}.evidence{display:grid;gap:8px;margin-top:18px}.evidence div{border-left:2px solid var(--accent);background:#6fd8ff0a;padding:10px}.evidence span{font-size:.62rem;color:var(--muted);letter-spacing:.12em}
    .search{display:grid;grid-template-columns:1fr auto;gap:8px}.results{display:grid;gap:8px;max-height:560px;overflow:auto;margin-top:12px}.person{border:1px solid var(--line);border-radius:12px;background:#091015;padding:13px;text-align:left;cursor:pointer}.person.sel{border-color:var(--accent);background:#6fd8ff10}.person strong{display:block}.person small{color:var(--accent)}.person p{font-size:.78rem;color:#c5d1d6;margin:7px 0 0;line-height:1.4}

    .topright{display:flex;align-items:center;gap:8px}
    .quote-box{padding:22px;border:1px solid var(--line);border-radius:14px;background:#071016;margin:18px 0}
    .quote-box blockquote{margin:0;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.45;font-weight:700}
    .quote-box small{display:block;color:var(--muted);margin-top:12px;letter-spacing:.12em}
    .artifact-clue-stack{display:grid;gap:8px;margin:18px 0}

    .inventory-btn{position:relative}
    .inventory-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--accent);color:#051018;font-size:.68rem;font-weight:900}
    .inventory-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    .inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
    .inventory-item{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .inventory-item-top{display:flex;gap:12px;align-items:flex-start}
    .artifact-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#060c10;color:var(--accent)}
    .artifact-icon svg{width:34px;height:34px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .artifact-icon svg .fill{fill:currentColor;stroke:none;opacity:.9}
    .artifact-icon svg .soft{opacity:.45}
    .inventory-item-copy{min-width:0;flex:1}
    .inventory-item strong{display:block;font-size:1rem}.inventory-item span{display:block;color:var(--accent);font-size:.72rem;margin-top:4px}
    .inventory-item p{color:var(--muted);font-size:.8rem;line-height:1.45;margin:8px 0 0}
    .rarity{display:inline-block;margin-top:8px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:.64rem;font-weight:900;letter-spacing:.09em}
    .rarity-common{opacity:.78}
    .rarity-uncommon{border-color:#4d7a64}
    .rarity-rare{border-color:#496a8d}
    .rarity-epic{border-color:#75548d}
    .rarity-legendary{border-color:#8d7348}
    .rarity-mythic{border-color:#8b4b5f}
    .new-reward{padding:12px 14px;border-left:2px solid var(--ok);background:rgba(149,232,191,.06);color:#ccebdd;margin:18px 0}
    .grid-status{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .grid-chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#0a1116;font-size:.78rem}
    .marvel-grid-wrap{overflow-x:auto;padding-bottom:4px}
    .marvel-grid{display:grid;grid-template-columns:120px repeat(3,minmax(120px,1fr));gap:6px;min-width:520px}
    .grid-corner,.grid-head,.grid-rowhead,.grid-cell{min-height:92px;border:1px solid var(--line);border-radius:12px;background:#091015;padding:10px}
    .grid-corner{display:grid;place-items:center;color:var(--muted);font-size:.68rem;letter-spacing:.12em}
    .grid-head,.grid-rowhead{display:grid;place-items:center;text-align:center;color:#c9d6db;font-size:.78rem;font-weight:800}
    .grid-cell{cursor:pointer;display:grid;place-items:center;text-align:center;position:relative}
    .grid-cell:hover{border-color:#4c7182}.grid-cell.selected{border-color:var(--accent);background:#6fd8ff0d}
    .grid-cell.filled{border-color:#497565;background:rgba(149,232,191,.06);cursor:default}
    .grid-cell.revealed{opacity:.65;cursor:default}
    .grid-cell .cell-plus{font-size:1.6rem;color:#5b7480}
    .grid-cell .cell-name{font-size:.82rem;font-weight:800}
    .grid-cell .cell-example{font-size:.68rem;color:var(--muted);margin-top:4px}
    .grid-entry{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#081015}
    .grid-entry h3{margin:0 0 6px}.grid-entry p{color:var(--muted);font-size:.82rem;line-height:1.45}
    .suggestions{display:grid;gap:6px;margin-top:8px;max-height:290px;overflow:auto}
    .suggestion{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0b1218;cursor:pointer;text-align:left}
    .suggestion:hover{border-color:#4c7182}.suggestion small{display:block;color:var(--muted);margin-top:3px}
    .grid-results{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0a1116}
    .inventory-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.inventory-tabs .btn.active{border-color:var(--accent);background:#6fd8ff10}
    .inventory-controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
    .inventory-controls select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081015;color:var(--text);padding:8px 12px;font-size:16px}
    .power-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
    .power-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .power-card strong{display:block}.power-card .power-meta{color:var(--accent);font-size:.72rem;margin-top:5px}.power-card p{color:var(--muted);font-size:.8rem;line-height:1.45}
    .active-power{border-color:#486f62;background:rgba(149,232,191,.05)}
    .rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
    .rules-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091015}.rules-card h3{margin:0 0 8px}.rules-card p,.rules-card li{color:var(--muted);font-size:.82rem;line-height:1.5}.rules-card ul{padding-left:18px;margin:8px 0}
    .heist-vault{display:grid;place-items:center;min-height:220px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 35%,#17242d,#070b0e 65%);text-align:center;padding:20px}
    .heist-vault .artifact-icon{width:72px;height:72px;flex-basis:72px}.heist-vault .artifact-icon svg{width:52px;height:52px}
    .heist-odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.heist-odds div{padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:.75rem}
    .degree-path{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.degree-node{padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:#0a1116;font-size:.8rem}.degree-arrow{color:var(--muted)}
    .six-archive{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#071015}
    .six-archive strong{color:var(--accent)}
    .six-progress{height:10px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#05090c;margin-top:9px}
    .six-progress>span{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s ease}
    .buff-strip{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.buff-chip{padding:7px 9px;border:1px solid #486f62;border-radius:999px;background:rgba(149,232,191,.05);font-size:.7rem;color:#cde8db}
    .toast-host{position:fixed;right:14px;bottom:14px;z-index:50;display:grid;gap:8px;max-width:min(360px,calc(100% - 28px))}
    .toast{padding:13px 15px;border:1px solid #466779;border-radius:12px;background:#0b151cf2;box-shadow:0 12px 30px #0008;font-size:.82rem;line-height:1.4}
    .toast strong{color:var(--accent)}
    .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
    .admin-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .admin-card h3{margin:0 0 8px}.admin-card p{color:var(--muted);font-size:.8rem;line-height:1.45}
    .admin-card input,.admin-card select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#071015;color:var(--text);padding:9px 11px;font-size:16px;margin:6px 0}
    .admin-inline{display:flex;gap:8px;flex-wrap:wrap}.admin-inline>*{flex:1 1 120px}
    .admin-danger{border-color:#7d4545;background:rgba(125,69,69,.07)}
    .admin-status{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#071015;color:var(--muted);font-size:.78rem;margin-top:8px}
    .admin-hidden{display:none!important}
    .achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
    .achievement-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091015;min-width:0}
    .achievement-card.done{border-color:#426f62;background:rgba(149,232,191,.045)}
    .achievement-card.secret:not(.done){border-style:dashed;background:#070b0e}
    .achievement-card h3{margin:0 0 6px;display:flex;gap:8px;align-items:center}
    .achievement-card p{color:var(--muted);font-size:.8rem;line-height:1.45}
    .achievement-reward{font-size:.73rem;color:var(--accent);margin-top:10px}
    .achievement-status{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:.65rem;letter-spacing:.08em}
    .achievement-card.done .achievement-status{border-color:#486f62;color:#cde8db}
    .achievement-progress{height:8px;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:10px;background:#05090c}
    .achievement-progress>span{display:block;height:100%;background:var(--accent)}
    .collectible-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px;margin-top:14px}
    .collectible-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .collectible-card .collectible-icon{font-size:1.8rem;line-height:1}
    .collectible-card p{color:var(--muted);font-size:.78rem;line-height:1.4}
    .admin-exclusive{display:inline-block;margin-top:6px;padding:3px 7px;border:1px solid #8569b2;border-radius:999px;color:#d8c8ff;font-size:.62rem;letter-spacing:.08em}

    .admin-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
    .admin-toggle:first-of-type{border-top:0}
    .admin-toggle input{width:22px;height:22px;min-height:auto;margin:0;flex:0 0 auto}
    .admin-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .admin-kpi div{padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center}
    .admin-kpi strong{display:block;font-size:1.05rem}
    .support-user{padding:12px;border:1px solid var(--line);border-radius:12px;background:#071015;margin-top:8px}
    .support-user code{font-size:.72rem;word-break:break-all;color:var(--accent)}
    .support-user.selected{border-color:var(--accent)}
    .support-list{max-height:340px;overflow:auto;padding-right:4px}
    .chaos-button{min-height:58px;font-size:1rem;letter-spacing:.05em}


    .loginstatus{color:var(--muted);font-size:.7rem}
    .syncok{color:var(--ok)}.syncbad{color:var(--bad)}
    .difficultygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
    .difficulty{min-height:44px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#091015;cursor:pointer;text-align:left}
    .difficulty:hover{border-color:#4c7182}.difficulty.selected{border-color:var(--accent);background:#6fd8ff10}
    .difficulty strong{display:block;font-size:1.05rem}.difficulty span{display:block;color:var(--accent);font-size:.72rem;margin-top:3px}
    .difficulty p{color:var(--muted);font-size:.84rem;line-height:1.45;margin:8px 0 0}
    .notice{padding:12px 14px;border-left:2px solid var(--accent);background:#6fd8ff0a;color:#bcd0d8;line-height:1.5}

    footer{padding:18px;color:#6f858e;text-align:center;border-top:1px solid #11202a;font-size:.7rem}

    .screen-enter{animation:screenIn .34s cubic-bezier(.2,.75,.25,1) both}
    .ui-ripple{
      position:absolute;pointer-events:none;border-radius:50%;z-index:20;
      width:12px;height:12px;background:rgba(111,216,255,.26);
      transform:translate(-50%,-50%) scale(0);animation:rippleOut .48s ease-out forwards
    }
    .choice .ui-ripple,.btn.primary .ui-ripple{background:rgba(255,255,255,.30)}
    @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes rippleOut{0%{opacity:.75;transform:translate(-50%,-50%) scale(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
    @keyframes cardScan{0%{transform:translateY(-80px);opacity:0}12%{opacity:.14}50%{opacity:.08}100%{transform:translateY(270px);opacity:0}}
    @keyframes uiPulse{0%,100%{opacity:.42}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    }
    @media(max-width:1100px){.gamegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.casegrid{grid-template-columns:.8fr 1.2fr}}
    @media(max-width:820px){.hero,.casegrid{grid-template-columns:1fr}.pill{display:none}.gamegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}
    @media(max-width:650px){.gamegrid{grid-template-columns:1fr;gap:18px}.game{min-height:285px}}
    @media(max-width:560px){.choices,.form,.search,.difficultygrid{grid-template-columns:1fr}.brand small{display:none}.top{align-items:flex-start}.topright{flex-direction:column;align-items:flex-end}}
  

    /* =========================================================
       MARVEL ARCADE · BLUE NEON TACTICAL THEME
       Cyan / electric blue / navy / black only.
       ========================================================= */
    :root{
      --bg:#020711;--panel:#08182a;--panel2:#0c2238;--line:#214967;--line2:#33759d;
      --text:#effbff;--muted:#8fb4c8;--accent:#50ddff;--accentSoft:#50ddff1b;
      --ok:#70dcff;--bad:#ff728c;--cyan:#63e7ff;--electric:#1d9bff;--blue:#1466e8;
      --navy:#06152b;--deepNavy:#020a17;--neon:#3be6ff;--ice:#c9f7ff
    }

    html{background:#020711}
    body{
      background:
        radial-gradient(circle at 14% 4%,rgba(38,183,255,.25),transparent 29%),
        radial-gradient(circle at 88% 17%,rgba(23,91,227,.25),transparent 32%),
        radial-gradient(circle at 55% 92%,rgba(43,222,255,.11),transparent 34%),
        linear-gradient(145deg,#071a34 0%,#041126 43%,#020711 100%)
    }
    body::before{
      opacity:.24;
      background-image:
        linear-gradient(rgba(64,198,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(64,198,255,.10) 1px,transparent 1px),
        radial-gradient(circle,rgba(95,229,255,.18) 1px,transparent 1.4px);
      background-size:48px 48px,48px 48px,17px 17px;
      mask-image:linear-gradient(to bottom,black,rgba(0,0,0,.65) 64%,transparent 96%)
    }

    .top{
      border-bottom-color:#1f5679;
      background:linear-gradient(90deg,rgba(4,15,31,.97),rgba(6,31,55,.97) 48%,rgba(3,14,29,.97));
      box-shadow:0 12px 36px rgba(0,6,17,.34),inset 0 -1px 0 rgba(80,221,255,.08)
    }
    .mark{
      color:#001421;border-color:#58e4ff;
      background:linear-gradient(145deg,#65eaff,#1aa7ff);
      box-shadow:0 0 0 1px rgba(104,235,255,.11),0 0 28px rgba(50,205,255,.24)
    }
    .brand strong{color:#f1fcff}.brand small{color:#8fbfd4}
    .top .btn{
      border-color:#275d7e;background:linear-gradient(145deg,#0c2a44,#071b30);color:#eafaff
    }
    #rulesBtn,#achievementsBtn,#inventoryBtn,#adminBtn,#accountBtn{
      border-color:#286485;background:linear-gradient(145deg,#0d304c,#071d34)
    }
    .pill{border-color:#2b6688;background:linear-gradient(145deg,#0e304b,#071c31)}
    .pill span{color:#82bad1}.pill strong{color:#effcff}

    main{width:min(1200px,calc(100% - 30px))}

    .hero{
      position:relative;overflow:hidden;padding:30px;border:1px solid #2b7195;border-radius:26px;
      background:
        radial-gradient(circle at 7% 18%,rgba(80,221,255,.18),transparent 29%),
        radial-gradient(circle at 91% 8%,rgba(26,116,255,.20),transparent 34%),
        linear-gradient(145deg,#0d2c4b,#071b34 60%,#041226);
      box-shadow:0 24px 65px rgba(0,7,20,.30),inset 0 1px 0 rgba(122,235,255,.04)
    }
    .hero::after{
      content:"";position:absolute;right:-100px;top:-110px;width:330px;height:330px;border-radius:50%;
      border:1px solid rgba(91,226,255,.15);
      box-shadow:inset 0 0 0 34px rgba(42,146,255,.025),inset 0 0 0 68px rgba(67,217,255,.018);
      pointer-events:none
    }
    .hero h1{color:#f4fcff;text-shadow:0 0 26px rgba(56,205,255,.12)}
    .hero .eyebrow{color:#62e7ff}.lede{color:#b5d1df}
    .hero .card{
      border-color:#2e6d8e;background:linear-gradient(145deg,rgba(13,48,75,.96),rgba(6,26,48,.96));
      color:inherit;text-align:left;cursor:pointer;width:100%;font:inherit
    }
    .progress{background:#041426;border:1px solid #1c4762}
    .progress span{background:linear-gradient(90deg,#174fe7,#1ba8ff,#66ecff);box-shadow:0 0 15px rgba(68,222,255,.25)}

    .eyebrow{color:#52ddff}
    .missionhead{padding-bottom:16px;border-bottom:1px solid rgba(77,179,224,.23)}
    .missionhead h1{color:#f5fcff}
    .card,.mission,.case,.db{
      border-color:#265a78;background:linear-gradient(145deg,rgba(9,34,57,.98),rgba(4,18,35,.98));
      box-shadow:0 18px 48px rgba(0,7,19,.22)
    }

    .game{
      --gameColor:#50ddff;--gameRgb:80,221,255;
      border-color:rgba(var(--gameRgb),.42);
      background:
        radial-gradient(circle at 87% 5%,rgba(var(--gameRgb),.13),transparent 26%),
        linear-gradient(145deg,rgba(12,45,72,.98),rgba(5,21,40,.99) 74%);
      box-shadow:0 18px 38px rgba(0,7,19,.22),inset 0 1px 0 rgba(120,235,255,.035)
    }
    .game::before{
      opacity:1;background:
        linear-gradient(135deg,rgba(var(--gameRgb),.10),transparent 43%),
        linear-gradient(90deg,transparent 0 72%,rgba(72,205,255,.025) 72.2%,transparent 72.4%)
    }
    .game::after{
      left:0;right:45%;top:0;height:3px;background:linear-gradient(90deg,var(--gameColor),transparent);
      opacity:.95;animation:none
    }
    .game-status{color:#dffaff;border-color:rgba(var(--gameRgb),.46);background:rgba(var(--gameRgb),.10)}
    .game-visual{
      border-color:rgba(var(--gameRgb),.38);
      background:
        radial-gradient(circle at 50% 48%,rgba(var(--gameRgb),.17),transparent 52%),
        linear-gradient(145deg,rgba(12,50,79,.76),rgba(3,17,34,.88))
    }
    .game-visual::before{border-color:rgba(var(--gameRgb),.13)}
    .game-visual svg{stroke:var(--gameColor);filter:drop-shadow(0 0 12px rgba(var(--gameRgb),.22))}
    .game-visual .pulse-dot{animation:none;opacity:1}
    .num{color:var(--gameColor);font-weight:900}.game strong{color:#f2fcff}.game p{color:#9fbccc}
    .meta{color:#c6dce6;border-top-color:rgba(var(--gameRgb),.19)}
    .meta::before{background:var(--gameColor);box-shadow:0 0 8px var(--gameColor)}

    [data-g="e"]{--gameColor:#67e7ff;--gameRgb:103,231,255}
    [data-g="g"]{--gameColor:#33c5ff;--gameRgb:51,197,255}
    [data-g="d"]{--gameColor:#52a8ff;--gameRgb:82,168,255}
    [data-g="a"]{--gameColor:#758fff;--gameRgb:117,143,255}
    [data-g="q"]{--gameColor:#38ddff;--gameRgb:56,221,255}
    [data-g="grid"]{--gameColor:#1fbeff;--gameRgb:31,190,255}
    [data-g="six"]{--gameColor:#5b7fff;--gameRgb:91,127,255}
    [data-g="heist"]{--gameColor:#55e5ff;--gameRgb:85,229,255}
    [data-g="roster"]{--gameColor:#74ecff;--gameRgb:116,236,255}
    [data-g] .game-visual{
      background:
        radial-gradient(circle at 50% 48%,rgba(var(--gameRgb),.17),transparent 52%),
        linear-gradient(145deg,rgba(12,50,79,.76),rgba(3,17,34,.88))
    }

    .btn{border-color:#285e7d;background:linear-gradient(145deg,#0e3552,#071f37);color:#eefbff}
    .btn.primary{
      background:linear-gradient(135deg,#5ee8ff,#1bafff);border-color:#79eaff;color:#001722;
      box-shadow:0 8px 25px rgba(40,191,255,.15)
    }
    .choice{border-color:#275b79;background:linear-gradient(145deg,#0d304b,#071d35);color:#effbff}
    .choice:nth-child(4n+1){border-left:3px solid #5ce7ff}
    .choice:nth-child(4n+2){border-left:3px solid #21baff}
    .choice:nth-child(4n+3){border-left:3px solid #397cff}
    .choice:nth-child(4n+4){border-left:3px solid #80eaff}

    .form input,.search input{border-color:#285f80;background:#061c32;color:#effbff}
    .form input::placeholder,.search input::placeholder{color:#759db2}
    .form input:focus,.search input:focus{
      border-color:#50ddff;box-shadow:0 0 0 3px rgba(80,221,255,.10);background:#08243d
    }
    .notice{
      border-left:4px solid #50ddff;background:linear-gradient(90deg,rgba(80,221,255,.10),rgba(23,86,194,.05));
      color:#d9edf6;border-radius:0 12px 12px 0
    }
    .new-reward{
      border-left-color:#7beaff;background:linear-gradient(90deg,rgba(65,217,255,.11),rgba(34,90,213,.06));color:#e1f9ff
    }
    .reward{border-color:#2c7da4;color:#dcf8ff;background:linear-gradient(145deg,#0d3b5a,#07253f)}
    .clue,.quote-box,.grid-entry,.grid-results{border-color:#275b79;background:linear-gradient(145deg,#0c304c,#071c34)}
    .clue span,.quote-box small{color:#8cb5c9}
    .case,.db{background:linear-gradient(145deg,#0d304c,#071d35)}
    .evidence div{border-left-color:#3edcff;background:linear-gradient(90deg,rgba(58,214,255,.10),rgba(28,86,194,.045))}
    .person,.suggestion,.grid-cell,.grid-head,.grid-rowhead,.grid-corner{border-color:#275b79;background:#0b2b45}
    .person.sel,.grid-cell.selected{border-color:#50ddff;background:#0f3b59}
    .grid-cell.filled{border-color:#319fd3;background:#0b3851}
    .grid-chip{border-color:#2c6787;background:#0e314b;color:#e9faff}

    .difficulty{border-color:#285f7e;background:linear-gradient(145deg,#0e304a,#071d34)}
    .difficulty:nth-child(4n+1){border-top:3px solid #57e6ff}
    .difficulty:nth-child(4n+2){border-top:3px solid #2ebcff}
    .difficulty:nth-child(4n+3){border-top:3px solid #3d82ff}
    .difficulty:nth-child(4n+4){border-top:3px solid #73d8ff}
    .difficulty.selected{border-color:#55dfff;background:linear-gradient(145deg,#104565,#082b47)}
    .difficulty span{color:#6adfff}

    .inventory-item,.power-card,.achievement-card,.collectible-card,.admin-card{
      border-color:#275d7b;background:linear-gradient(145deg,#0d314c,#071d34)
    }
    .artifact-icon{border-color:#2d6b8b;background:#082741;color:#61e4ff}
    .power-card .power-meta,.inventory-item span{color:#64dfff}
    .achievement-card.done{border-color:#2e8cb4;background:linear-gradient(145deg,#0b3f59,#072b42)}
    .achievement-card.secret:not(.done){border-color:#405f9d;background:linear-gradient(145deg,#101f47,#08142f)}
    .inventory-tabs .btn.active{border-color:#51deff;background:linear-gradient(145deg,#104564,#082b47)}
    .inventory-controls select,.admin-card input,.admin-card select{border-color:#275e7d;background:#08243c;color:#effbff}

    .rarity-common{background:#6b819022;border-color:#7996a8}
    .rarity-uncommon{background:#39c7ff1d;border-color:#39c7ff;color:#ccefff}
    .rarity-rare{background:#1d9bff22;border-color:#1d9bff;color:#d5efff}
    .rarity-epic{background:#5c7cff22;border-color:#6c8cff;color:#dfe5ff}
    .rarity-legendary{background:#2ecfff24;border-color:#66e4ff;color:#d9f9ff}
    .rarity-mythic{background:#0f6fff2e;border-color:#4bb8ff;color:#e1f2ff}
    footer{color:#7599ab;border-top-color:#1e506c;background:rgba(2,11,23,.30)}

    /* Decorative HUD scenery; intentionally non-functional. */
    .ambient-hud{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
    .ambient-orbit{position:absolute;border:1px solid rgba(76,214,255,.09);border-radius:50%}
    .ambient-orbit.o1{width:430px;height:430px;right:-180px;top:110px}
    .ambient-orbit.o2{width:260px;height:260px;left:-110px;top:49%}
    .ambient-orbit.o3{width:720px;height:720px;left:31%;bottom:-580px;border-color:rgba(47,109,255,.07)}
    .ambient-cross{
      position:absolute;width:150px;height:150px;opacity:.10;
      background:
        linear-gradient(90deg,transparent 49.4%,#5ddfff 49.5% 50.5%,transparent 50.6%),
        linear-gradient(transparent 49.4%,#5ddfff 49.5% 50.5%,transparent 50.6%)
    }
    .ambient-cross.c1{right:8%;top:35%}.ambient-cross.c2{left:6%;bottom:16%;transform:scale(.6)}
    .ambient-code{
      position:absolute;font:700 10px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.16em;color:rgba(85,222,255,.16);white-space:pre
    }
    .ambient-code.a1{right:24px;bottom:70px;text-align:right}
    .ambient-code.a2{left:22px;top:180px;color:rgba(64,124,255,.13)}
    .ambient-corner{position:absolute;width:70px;height:70px;border-color:rgba(80,221,255,.16);border-style:solid}
    .ambient-corner.tl{left:18px;top:112px;border-width:1px 0 0 1px}
    .ambient-corner.br{right:18px;bottom:48px;border-width:0 1px 1px 0}

    .hero .ambient-signal{
      position:absolute;right:28px;bottom:24px;width:18px;height:18px;border-radius:50%;
      border:1px solid rgba(93,226,255,.38);background:#0c3351;box-shadow:0 0 0 5px rgba(70,209,255,.025);
      padding:0;cursor:pointer;z-index:2
    }
    .hero .ambient-signal::after{
      content:"";position:absolute;inset:5px;border-radius:50%;background:#58e4ff;box-shadow:0 0 9px rgba(88,228,255,.45)
    }

    .egg-toast{
      position:fixed;left:50%;bottom:24px;z-index:1000;transform:translateX(-50%);
      max-width:min(520px,calc(100% - 30px));padding:12px 16px;border:1px solid #43cfff;border-radius:14px;
      background:linear-gradient(145deg,rgba(8,42,66,.97),rgba(3,19,36,.98));

    }
    .egg-flash.show{animation:eggFlash .6s ease-out}
    @keyframes eggFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

    /* This design pass is visual rather than motion-heavy. */
    .game::after,.game-visual .pulse-dot{animation:none!important}

  
    /* =========================================================
       GAME 12 · MARVEL ROSTER
       ========================================================= */
    .roster-source{
      display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;
      margin:14px 0 18px;padding:12px 14px;border:1px solid #245979;border-radius:14px;
      background:linear-gradient(145deg,rgba(9,47,73,.78),rgba(4,23,43,.86));
      color:#a8c7d6;font-size:.76rem
    }
    .roster-source strong{color:#68e5ff}
    .roster-category-tools{
      display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:16px 0
    }
    .roster-category-tools input{
      min-height:48px;width:100%;border:1px solid #285f80;border-radius:12px;
      background:#061c32;color:#effbff;padding:10px 13px;font-size:16px;outline:none
    }
    .roster-category-tools input:focus{border-color:#50ddff;box-shadow:0 0 0 3px rgba(80,221,255,.10)}
    .roster-category-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px;margin-top:14px
    }
    .roster-category{
      min-height:154px;padding:16px;border:1px solid #285f7e;border-radius:18px;
      background:
        radial-gradient(circle at 90% 10%,rgba(77,215,255,.10),transparent 30%),
        linear-gradient(145deg,#0d304d,#061b32);
      color:#edfaff;text-align:left;cursor:pointer;position:relative;overflow:hidden;
      transition:border-color .18s ease,transform .18s ease,background .18s ease
    }
    .roster-category::before{
      content:"";position:absolute;left:0;top:0;width:74%;height:3px;
      background:linear-gradient(90deg,#5be7ff,#1a9fff,transparent)
    }
    .roster-category strong{display:block;font-size:1rem;margin-bottom:7px}
    .roster-category p{margin:0;color:#91b4c7;font-size:.76rem;line-height:1.45}
    .roster-category .roster-cat-count{
      display:inline-block;margin-top:14px;padding:5px 8px;border:1px solid #286786;border-radius:999px;
      color:#bfeeff;background:rgba(65,210,255,.06);font-size:.66rem;letter-spacing:.06em
    }
    .roster-category .roster-cat-xp{
      position:absolute;right:14px;bottom:14px;color:#5ce3ff;font-size:.7rem;font-weight:800
    }
    @media(hover:hover) and (pointer:fine){
      .roster-category:hover{border-color:#55dbff;transform:translateY(-2px);background:linear-gradient(145deg,#10405f,#07233c)}
    }

    .roster-hud{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0
    }
    .roster-stat{
      padding:11px 12px;border:1px solid #275e7d;border-radius:13px;
      background:linear-gradient(145deg,#0b2d47,#061b31)
    }
    .roster-stat span{display:block;color:#719caf;font-size:.59rem;letter-spacing:.11em;margin-bottom:4px}
    .roster-stat strong{font-size:1rem;color:#eafaff}
    .roster-progress{
      height:10px;border:1px solid #20536f;border-radius:999px;background:#031323;overflow:hidden;margin:12px 0 4px
    }
    .roster-progress>span{
      display:block;height:100%;background:linear-gradient(90deg,#1669ef,#1ebcff,#67edff);
      box-shadow:0 0 14px rgba(63,219,255,.24);transition:width .23s ease
    }
    .roster-entry{
      display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin:16px 0 8px
    }
    .roster-entry input{
      min-height:52px;border:1px solid #2a6788;border-radius:13px;background:#061d33;color:#f0fbff;
      padding:11px 14px;font-size:17px;outline:none;box-shadow:inset 0 1px 0 rgba(121,233,255,.025)
    }
    .roster-entry input:focus{border-color:#5be5ff;box-shadow:0 0 0 3px rgba(80,221,255,.11)}
    .roster-entry input:disabled{opacity:.55}
    .roster-feedback{min-height:25px;color:#9ec2d2;font-size:.79rem}
    .roster-feedback.good{color:#78eaff}.roster-feedback.close{color:#8ebcff}.roster-feedback.bad{color:#a5b7c2}

    .roster-controls{
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0
    }
    .roster-controls select{

    .roster-board{

    }
    .roster-slot{
      min-height:158px;border:1px solid #204f6b;border-radius:16px;background:

      padding:9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;
      position:relative;overflow:hidden

      content:"";position:absolute;left:8px;right:8px;top:8px;height:1px;background:linear-gradient(90deg,#40dfff55,transparent)
    }
    .roster-slot.guessed{
      border-color:#36bfe8;background:
        radial-gradient(circle at 50% 25%,rgba(71,220,255,.12),transparent 36%),
        linear-gradient(145deg,#0c3550,#061d34)

    .roster-slot.missed{border-color:#355774;opacity:.72}
    .roster-sprite{
      height:100px;display:grid;place-items:center;overflow:hidden;position:relative
    }
    .roster-sprite svg{width:88px;height:94px;display:block}
    .roster-sprite.hidden svg{filter:drop-shadow(0 0 9px rgba(38,151,202,.11))}
    .roster-sprite.revealed svg{filter:drop-shadow(0 0 13px rgba(64,218,255,.22))}
    .roster-slot-name{
      text-align:center;font-size:.69rem;font-weight:800;line-height:1.2;color:#eafbff;
      overflow-wrap:anywhere;margin-top:5px
    }
    .roster-slot.hidden .roster-slot-name{color:#57778a;letter-spacing:.12em}
    .roster-slot-xp{text-align:center;color:#59e1ff;font-size:.59rem;margin-top:3px}
    .roster-slot.missed .roster-slot-xp{color:#708da0}
    .roster-rarity-tag{
      position:absolute;right:7px;top:7px;z-index:2;padding:3px 5px;border:1px solid #286a88;border-radius:999px;
      background:#062039;color:#83dcff;font-size:.48rem;letter-spacing:.07em
    }
    .roster-upcoming{
      position:absolute;left:7px;top:7px;z-index:2;padding:3px 5px;border:1px solid #405fa3;border-radius:999px;
      background:#091d44;color:#9abaff;font-size:.46rem;letter-spacing:.06em
    }
    .roster-finish{
      margin-top:18px;padding:18px;border:1px solid #3bc8ef;border-radius:17px;
      background:linear-gradient(145deg,rgba(17,73,99,.82),rgba(6,34,55,.92))
    }
    .roster-finish h2{margin-top:0}
    .roster-empty{padding:28px;text-align:center;color:#83a7b9;border:1px dashed #285c78;border-radius:15px}

    @media(max-width:760px){
      .roster-hud{grid-template-columns:1fr 1fr}
      .roster-board{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
      .roster-slot{min-height:148px}
      .roster-category-tools,.roster-entry{grid-template-columns:1fr}
    }
    @media(max-width:390px){
      .roster-board{grid-template-columns:repeat(3,minmax(0,1fr))}
      .roster-slot{padding:6px}.roster-sprite{height:86px}.roster-sprite svg{width:76px;height:82px}

    /* =========================================================
       GAMES 09–11 · PHYSICAL / SPATIAL INTERACTION
       ========================================================= */
    [data-g="stark"]{--gameColor:#69efff;--gameRgb:105,239,255}
    [data-g="sling"]{--gameColor:#30c8ff;--gameRgb:48,200,255}
    [data-g="evidence"]{--gameColor:#708dff;--gameRgb:112,141,255}

    .interactive-hud{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px
    }
    .interactive-stat{
      padding:11px 12px;border:1px solid #275e7d;border-radius:13px;
      background:linear-gradient(145deg,#0b2d47,#061b31)
    }
    .interactive-stat span{
      display:block;color:#729caf;font-size:.58rem;letter-spacing:.11em;margin-bottom:4px
    }
    .interactive-stat strong{color:#effbff;font-size:.96rem}
    .game-instruction{
      padding:13px 15px;border-left:3px solid #57e6ff;border-radius:0 12px 12px 0;
      background:linear-gradient(90deg,rgba(62,210,255,.10),rgba(23,73,162,.04));
      color:#b9d4e1;line-height:1.48;font-size:.82rem;margin-bottom:16px
    }

    /* Stark Systems Lab */
    .stark-workbench{
      border:1px solid #296681;border-radius:20px;padding:16px;
      background:
        radial-gradient(circle at 50% 22%,rgba(77,226,255,.10),transparent 32%),
        linear-gradient(145deg,#092a44,#04182e);
      min-height:380px;position:relative;overflow:hidden
    }
    .stark-workbench::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
      background-image:
        linear-gradient(rgba(87,221,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(87,221,255,.12) 1px,transparent 1px);
      background-size:30px 30px
    }
    .stark-stage-title{
      display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;
      border-bottom:1px solid #245875;padding-bottom:12px;margin-bottom:16px
    }
    .stark-stage-title strong{color:#e9fbff}.stark-stage-title span{color:#60ddff;font-size:.7rem}
    .stark-layout{
      display:grid;grid-template-columns:1fr 1.15fr;gap:20px;position:relative;z-index:1
    }
    .stark-tray,.stark-bay{
      border:1px solid #245b77;border-radius:16px;padding:13px;
      background:rgba(4,22,39,.72);min-height:250px
    }
    .stark-label{
      color:#72a8bf;font-size:.58rem;letter-spacing:.14em;margin-bottom:10px
    }
    .stark-component{
      min-height:62px;margin:9px 0;padding:10px 12px;border:1px solid #2e718f;border-radius:13px;
      background:linear-gradient(145deg,#10405f,#082841);display:flex;align-items:center;gap:10px;
      cursor:grab;touch-action:none;user-select:none;position:relative
    }
    .stark-component:active{cursor:grabbing}
    .stark-component .component-icon{
      width:38px;height:38px;border:1px solid #55dfff;border-radius:10px;display:grid;place-items:center;
      color:#75ecff;font-size:1.2rem;background:#061c31;box-shadow:inset 0 0 14px rgba(70,220,255,.06)
    }
    .stark-component small{display:block;color:#779fb3;margin-top:2px}
    .stark-slot{
      min-height:72px;margin:9px 0;padding:10px;border:1px dashed #326d89;border-radius:14px;
      display:flex;align-items:center;justify-content:center;color:#64889a;background:rgba(6,30,49,.58);
      transition:border-color .16s ease,background .16s ease
    }
    .stark-slot.filled{border-style:solid;border-color:#47d8ff;background:rgba(18,72,94,.54)}
    .stark-slot .stark-component{width:100%;margin:0;cursor:default}
    .drag-ghost{
      position:fixed;z-index:5000;pointer-events:none;width:min(250px,65vw);opacity:.92;
      transform:translate(-50%,-50%) scale(1.03);box-shadow:0 18px 45px rgba(0,5,14,.45)
    }

    .wire-board{
      min-height:390px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:90px;
      padding:24px 20px;border:1px solid #245d7a;border-radius:18px;background:rgba(3,18,34,.72);overflow:hidden
    }
    .wire-board::before{
      content:"";position:absolute;left:50%;top:18px;bottom:18px;width:1px;background:#1c4e69;opacity:.65
    }
    .wire-column{display:flex;flex-direction:column;justify-content:space-around;gap:16px;position:relative;z-index:2}
    .wire-port{
      min-height:54px;border:1px solid #2a6a89;border-radius:13px;background:linear-gradient(145deg,#0e3855,#071f37);
      color:#dff9ff;padding:9px 12px;display:flex;align-items:center;gap:10px;text-align:left;
      cursor:crosshair;touch-action:none;position:relative
    }
    .wire-port.to{flex-direction:row-reverse;text-align:right}
    .wire-port.wired{border-color:#55ddff;background:linear-gradient(145deg,#104760,#082c45)}
    .wire-dot{
      flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid #64e8ff;background:#052036;
      box-shadow:0 0 11px rgba(80,221,255,.22)
    }
    .wire-port.wired .wire-dot{background:#69eaff}
    .wire-port small{display:block;color:#76a5b9;font-size:.55rem;letter-spacing:.08em}
    .wire-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}

    .calibration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .calibration-unit{
      padding:16px;border:1px solid #285f7c;border-radius:18px;background:rgba(5,25,43,.76);text-align:center
    }
    .calibration-unit strong{display:block;color:#e9fbff;margin-bottom:3px}
    .calibration-unit small{color:#71a1b6}
    .calibration-ring{
      width:min(170px,100%);aspect-ratio:1;margin:15px auto;position:relative;border-radius:50%;
      border:2px solid #266989;touch-action:none;cursor:grab;
      background:
        radial-gradient(circle,#06182a 0 31%,transparent 32%),
        repeating-conic-gradient(from 0deg,#43dfff22 0 2deg,transparent 2deg 45deg),
        radial-gradient(circle,rgba(60,214,255,.11),rgba(4,19,35,.2));
      box-shadow:inset 0 0 35px rgba(37,184,235,.07)
    }
    .calibration-ring::before{
      content:"";position:absolute;inset:17%;border:1px solid #23617e;border-radius:50%
    }
    .calibration-marker{
      position:absolute;left:50%;top:4px;width:4px;height:45%;border-radius:999px;
      background:linear-gradient(#6ceaff,#1f86ff);transform-origin:50% 100%;
      transform:translateX(-50%) rotate(var(--dial-angle));
      box-shadow:0 0 11px rgba(75,218,255,.3)
    }
    .calibration-core{
      position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);
      border:1px solid #5ce8ff;border-radius:50%;background:#06192d;display:grid;place-items:center;
      color:#64e6ff;font-size:.7rem
    }
    .calibration-value{color:#65e5ff;font:700 .75rem ui-monospace,SFMono-Regular,Menlo,monospace}

    /* Sling Ring Network */
    .sling-shell{
      border:1px solid #28627f;border-radius:20px;padding:16px;background:
        radial-gradient(circle at 50% 50%,rgba(50,190,255,.09),transparent 42%),
        linear-gradient(145deg,#08263f,#04172c)
    }
    .sling-board{
      display:grid;gap:6px;width:min(650px,100%);margin:16px auto;touch-action:manipulation
    }
    .sling-tile{
      aspect-ratio:1;border:1px solid #245873;border-radius:13px;background:
        radial-gradient(circle at center,rgba(44,190,238,.05),transparent 45%),#061c31;
      padding:0;cursor:pointer;position:relative;overflow:hidden;touch-action:none;
      transition:border-color .14s ease,background .14s ease,box-shadow .14s ease
    }
    .sling-tile svg{width:100%;height:100%;display:block}
    .sling-tile.energized{
      border-color:#52e4ff;background:#0b3450;box-shadow:inset 0 0 20px rgba(59,218,255,.10),0 0 10px rgba(56,211,255,.08)
    }
    .sling-tile.endpoint{border-color:#4aa4d0}
    .sling-end-label{
      position:absolute;left:4px;top:4px;color:#91eaff;font-size:.43rem;font-weight:900;letter-spacing:.05em;z-index:2
    }
    .sling-legend{
      display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:#7da7ba;font-size:.68rem;margin-top:8px
    }
    .sling-legend span::before{
      content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fdcff;margin-right:5px
    }

    /* Evidence Board */
    .evidence-toolbar{
      display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0
    }
    .evidence-board{
      position:relative;min-height:570px;border:1px solid #2b5c80;border-radius:20px;overflow:hidden;
      background:
        radial-gradient(circle at 50% 40%,rgba(65,140,255,.09),transparent 43%),
        linear-gradient(rgba(72,156,218,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(72,156,218,.06) 1px,transparent 1px),
        #05172b;
      background-size:auto,34px 34px,34px 34px,auto
    }
    .evidence-board::before{
      content:"CLASSIFIED RELATIONSHIP MAP";position:absolute;right:14px;top:12px;color:#486f89;
      font:800 .55rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em
    }
    .evidence-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
    .evidence-node{
      position:absolute;width:34%;min-height:70px;border:1px solid #326b8c;border-radius:14px;
      background:linear-gradient(145deg,#0d3855,#071f39);padding:10px 33px 10px 11px;
      color:#ecfaff;z-index:2;cursor:default;touch-action:auto;user-select:none;
      box-shadow:0 8px 18px rgba(0,6,16,.18)
    }
    .evidence-node.item{border-color:#485f9c;background:linear-gradient(145deg,#102c58,#081e40)}
    .evidence-node.linked{border-color:#55dcff;box-shadow:0 0 0 1px rgba(75,220,255,.08),0 8px 18px rgba(0,6,16,.18)}
    .evidence-node small{
      display:block;color:#78a8bd;font-size:.52rem;letter-spacing:.12em;margin-bottom:4px
    }
    .evidence-node strong{display:block;font-size:.78rem;line-height:1.25;overflow-wrap:anywhere}
    .evidence-link-port{
      position:absolute;right:9px;top:50%;transform:translateY(-50%);width:17px;height:17px;
      border:2px solid #61e5ff;border-radius:50%;background:#06182c;cursor:crosshair;
      box-shadow:0 0 9px rgba(70,219,255,.19);touch-action:none
    }
    .evidence-node.item .evidence-link-port{right:auto;left:9px}
    .evidence-node.item{padding:10px 11px 10px 33px}
    .evidence-node.linked .evidence-link-port{background:#61e5ff}
    .evidence-status{
      color:#9fc0d0;font-size:.78rem;min-height:24px;margin-top:12px
    }
    .evidence-status.good{color:#66e6ff}.evidence-status.bad{color:#a7b9c4}
    .evidence-complete{
      margin-top:15px;padding:16px;border:1px solid #46d4f5;border-radius:15px;
      background:linear-gradient(145deg,#0c3c57,#06263e)
    }

      .interactive-hud{grid-template-columns:1fr 1fr}

      color:var(--theme-text);
      background:
        radial-gradient(circle at 13% 4%,color-mix(in srgb,var(--theme-accent) 24%,transparent),transparent 30%),
        radial-gradient(circle at 87% 16%,color-mix(in srgb,var(--theme-accent2) 22%,transparent),transparent 31%),
        linear-gradient(145deg,var(--theme-bg1),var(--theme-bg2) 48%,var(--theme-bg0))
    }

      background-image:
        linear-gradient(color-mix(in srgb,var(--theme-accent) 10%,transparent) 1px,transparent 1px),
        linear-gradient(90deg,color-mix(in srgb,var(--theme-accent) 10%,transparent) 1px,transparent 1px),

    /* =========================================================
       PLAYER PROFILES
       ========================================================= */
    .profile-hero{
      display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;
      padding:22px;border:1px solid var(--theme-line,#28617f);border-radius:22px;
      background:
        radial-gradient(circle at 92% 6%,color-mix(in srgb,var(--theme-accent,#50ddff) 14%,transparent),transparent 32%),
        linear-gradient(145deg,var(--theme-panel,#08263f),var(--theme-bg0,#020711));

      width:86px;height:86px;border-radius:24px;border:1px solid var(--theme-accent,#50ddff);
      display:grid;place-items:center;background:linear-gradient(145deg,var(--theme-accent,#50ddff),var(--theme-accent2,#1d9bff));
      color:var(--theme-bg0,#020711);font-size:2rem;font-weight:950;letter-spacing:-.04em;
      box-shadow:0 0 26px var(--theme-glow,rgba(80,221,255,.20))

    .profile-identity{min-width:0}

    .profile-identity h1{margin:0;font-size:clamp(1.8rem,5vw,3.1rem);overflow-wrap:anywhere}
    .profile-identity p{margin:7px 0 0;color:var(--theme-muted,#8fb4c8)}
    .profile-online{
      display:inline-flex;align-items:center;gap:7px;border:1px solid #2d6f8c;border-radius:999px;
      padding:7px 10px;color:#bcefff;background:rgba(31,171,218,.07);font-size:.67rem;font-weight:800;white-space:nowrap

    .profile-online::before{content:"";width:8px;height:8px;border-radius:50%;background:#54e5ff;box-shadow:0 0 10px rgba(84,229,255,.55)}
    .profile-online.offline{color:#8ba7b4;border-color:#3d5664;background:rgba(90,113,126,.05)}
    .profile-online.offline::before{background:#6e8490;box-shadow:none}

    .profile-summary{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:14px
    }
    .profile-summary-card{
      min-height:96px;padding:14px;border:1px solid var(--theme-line,#28617f);border-radius:16px;
      background:linear-gradient(145deg,var(--theme-panel,#08263f),color-mix(in srgb,var(--theme-bg0,#020711) 74%,var(--theme-panel,#08263f)))

    .profile-summary-card span{display:block;color:var(--theme-muted,#8fb4c8);font-size:.57rem;letter-spacing:.11em;margin-bottom:7px}
    .profile-summary-card strong{display:block;color:var(--theme-text,#effbff);font-size:1.35rem;line-height:1.1}
    .profile-summary-card small{display:block;color:var(--theme-accent,#50ddff);margin-top:5px;font-size:.61rem}

    .profile-section{margin-top:20px}
    .profile-section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
    .profile-section-head h2{margin:0}.profile-section-head span{color:var(--theme-muted,#8fb4c8);font-size:.69rem}
    .profile-artifacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .profile-artifact{
      display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--theme-line,#28617f);
      border-radius:15px;background:linear-gradient(145deg,var(--theme-panel,#08263f),var(--theme-bg0,#020711));min-width:0
    }

    .profile-artifact-copy span{display:block;font-size:.62rem;margin-top:4px;color:var(--theme-accent,#50ddff)}
    .profile-artifact-copy small{display:block;margin-top:3px;color:var(--theme-muted,#8fb4c8)}

  const cutoff=Date.now()-75000;

async function syncPublicProfile(force=false){
  if(!currentUser||!db||!setDocFn||!docFn)return;
  const now=Date.now();

  if(!force&&now-lastPublicProfileSyncAt<12000){
    clearTimeout(publicProfileSyncTimer);
    publicProfileSyncTimer=setTimeout(()=>syncPublicProfile(true),Math.max(500,12000-(now-lastPublicProfileSyncAt)));
    return;
  }

  clearTimeout(publicProfileSyncTimer);publicProfileSyncTimer=null;
  try{
    await setDocFn(docFn(db,"profiles",currentUser.uid),buildPublicProfilePayload(),{merge:true});
    lastPublicProfileSyncAt=Date.now();
  }catch(error){
    console.warn("Public profile sync unavailable",error);
  }
}

async function loadPlayerProfiles(){
  if(!currentUser||!db||!collectionFn||!getDocsFn)throw new Error("Player profiles require Google sign-in.");

}

const SYNC_TRACKED_FIELDS=[
  "streak","quoteStreak","inventory","powerups","activePowerups","collectibles","gridShieldCharges",
  "recentQuoteIds","recentArtifacts","recent","recentSixPairs","artifactSort","difficulty","escapeDifficulty",

let syncShadow={};
function resetSyncShadow(){
  syncShadow={};
  for(const field of SYNC_TRACKED_FIELDS)syncShadow[field]=JSON.stringify(prog[field]??null);
}
function syncFieldTime(state,field){return Number(state?.syncMeta?.fieldUpdatedAt?.[field])||0}
function newestSyncedField(local,cloud,field,fallback){
  const lt=syncFieldTime(local,field),ct=syncFieldTime(cloud,field);
  if(!lt&&!ct)return fallback;
  return lt>=ct?(local[field]??fallback):(cloud[field]??fallback);
}
function mergeSyncMeta(local={},cloud={}){
  const lf=local?.syncMeta?.fieldUpdatedAt||{},cf=cloud?.syncMeta?.fieldUpdatedAt||{},fields={};
  for(const key of new Set([...Object.keys(lf),...Object.keys(cf)]))fields[key]=Math.max(Number(lf[key])||0,Number(cf[key])||0);
  const ll=Number(local?.syncMeta?.lastWriteAt)||0,cl=Number(cloud?.syncMeta?.lastWriteAt)||0;
  return {revision:Math.max(Number(local?.syncMeta?.revision)||0,Number(cloud?.syncMeta?.revision)||0),lastWriteAt:Math.max(ll,cl),deviceId:ll>=cl?(local?.syncMeta?.deviceId||DEVICE_ID):(cloud?.syncMeta?.deviceId||DEVICE_ID),fieldUpdatedAt:fields};
}
function stampChangedSyncFields(){
  if(!prog.syncMeta||typeof prog.syncMeta!=="object")prog.syncMeta={revision:0,lastWriteAt:0,deviceId:DEVICE_ID,fieldUpdatedAt:{}};
  if(!prog.syncMeta.fieldUpdatedAt)prog.syncMeta.fieldUpdatedAt={};
  const now=Date.now();let changed=false;
  for(const field of SYNC_TRACKED_FIELDS){
    const serial=JSON.stringify(prog[field]??null);
    if(syncShadow[field]!==undefined&&syncShadow[field]!==serial){prog.syncMeta.fieldUpdatedAt[field]=now;changed=true}
    syncShadow[field]=serial;
  }
  if(changed){prog.syncMeta.revision=(Number(prog.syncMeta.revision)||0)+1;prog.syncMeta.lastWriteAt=now;prog.syncMeta.deviceId=DEVICE_ID}
}
function mergePersonalRecords(local={},cloud={}){
  const out={...cloud,...local,perGame:{...(cloud.perGame||{}),...(local.perGame||{})}};
  const gameIds=new Set([...Object.keys(cloud.perGame||{}),...Object.keys(local.perGame||{})]);
  out.perGame={};
  for(const id of gameIds){
    const a=local.perGame?.[id]||{},b=cloud.perGame?.[id]||{};
    out.perGame[id]={
      bestXp:Math.max(Number(a.bestXp)||0,Number(b.bestXp)||0),
      fastestMs:[Number(a.fastestMs)||0,Number(b.fastestMs)||0].filter(Boolean).sort((x,y)=>x-y)[0]||0,
      bestScore:Math.max(Number(a.bestScore)||0,Number(b.bestScore)||0),
      fewestErrors:[Number(a.fewestErrors),Number(b.fewestErrors)].filter(x=>Number.isFinite(x)&&x>=0).sort((x,y)=>x-y)[0]??null,
      fewestMoves:[Number(a.fewestMoves),Number(b.fewestMoves)].filter(x=>Number.isFinite(x)&&x>=0).sort((x,y)=>x-y)[0]??null,
      shortestLinks:[Number(a.shortestLinks),Number(b.shortestLinks)].filter(x=>Number.isFinite(x)&&x>=0).sort((x,y)=>x-y)[0]??null
    };
  }
  const hx=[local.highestXp,cloud.highestXp].filter(x=>x&&Number(x.value)>0).sort((a,b)=>Number(b.value)-Number(a.value))[0];
  if(hx)out.highestXp=hx;

function perfectClearReward(gameId,xp){
  prog.perfectClears=(Number(prog.perfectClears)||0)+1;
  const effects=artifactLoadoutEffects();
  const modifierBonus=hasGameModifier("perfect_hunter")?.50:0;
  const eventBonus=currentMissionEvent?.perfectBonus||0;
  const bonus=Math.max(25,Math.round(Math.max(0,Number(xp)||0)*.15*(1+effects.perfectBonus+modifierBonus+eventBonus)));
  prog.xp+=bonus;prog.gameplayXpEarned=(Number(prog.gameplayXpEarned)||0)+bonus;
  let cacheName="";
  if(prog.perfectClears%10===0){
    const cacheRarity=prog.perfectClears%50===0?"Epic":"Rare";

      const reward=rnd(pool);addInventoryReward(reward,lvl(prog.xp));cacheName=`Perfect Cache: ${reward.name}`;

function recordGameResult(gameId,data={}){
  if(!prog.personalRecords||typeof prog.personalRecords!=="object")prog.personalRecords={};
  if(!prog.personalRecords.perGame)prog.personalRecords.perGame={};
  const r=prog.personalRecords.perGame[gameId]||{};
  const xp=Math.max(0,Number(data.xp)||0);
  if(xp>Number(r.bestXp||0))r.bestXp=xp;
  if(data.durationMs>0&&(!r.fastestMs||data.durationMs<r.fastestMs))r.fastestMs=Math.round(data.durationMs);
  if(Number.isFinite(Number(data.score)))r.bestScore=Math.max(Number(r.bestScore)||0,Number(data.score)||0);
  if(Number.isFinite(Number(data.errors))&&Number(data.errors)>=0&&(r.fewestErrors==null||Number(data.errors)<r.fewestErrors))r.fewestErrors=Number(data.errors);
  if(Number.isFinite(Number(data.moves))&&Number(data.moves)>=0&&(r.fewestMoves==null||Number(data.moves)<r.fewestMoves))r.fewestMoves=Number(data.moves);
  if(Number.isFinite(Number(data.links))&&Number(data.links)>=0&&(r.shortestLinks==null||Number(data.links)<r.shortestLinks))r.shortestLinks=Number(data.links);
  prog.personalRecords.perGame[gameId]=r;

  const flawless=(Number.isFinite(Number(data.errors))&&Number(data.errors)===0)
    ||(gameId==="grid"&&Number(data.score)>=9)
    ||(gameId==="sling"&&Number(data.score)>=1);

  if(flawless){
    prog.flawlessRuns=(Number(prog.flawlessRuns)||0)+1;
    perfectClearReward(gameId,xp);
  }

  if(["identity","quote","artifact"].includes(gameId))adaptiveRecord(gameId,1);
  else if(["escape","database"].includes(gameId)){
    const errors=Number(data.errors);
    adaptiveRecord(gameId,Number.isFinite(errors)?(errors===0?2:errors<=1?1:errors>=3?-1:0):1);
  }

  if(xp>Number(prog.personalRecords.highestXp?.value||0))prog.personalRecords.highestXp={value:xp,gameId,at:Date.now()};
  prog.personalRecordsUpdatedAt=Date.now();

  if(activeFriendChallenge&&PUZZLE_PREFIX_GAME[activeFriendChallenge.prefix]===currentGameKey){
    const score=Number.isFinite(Number(data.score))?` · score ${Number(data.score)}`:"";
    showToast("FRIEND CHALLENGE COMPLETE",`${currentPuzzleId}${score} · ${formatRecordTime(data.durationMs)} · ${xp.toLocaleString()} XP`);
  }
}
function formatRecordTime(ms){
  ms=Number(ms)||0;if(!ms)return "—";
  const sec=ms/1000;if(sec<60)return `${sec.toFixed(sec<10?1:0)}s`;
  return `${Math.floor(sec/60)}m ${Math.round(sec%60)}s`;
}

function stringSeed(value){let h=2166136261>>>0;for(const ch of String(value)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function deterministicShuffle(items,seed){

function refreshPermanentMissionCompletions(){

  const completed=new Set(prog.permanentMissionState.completed||[]),newly=[];

  while(changed){

    for(const mission of PERMANENT_MISSIONS){

    }
  }

async function initFirebase(){
  if(!firebaseEnabled)return;
  try{
    const appMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const authMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
    const fsMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

    const app=appMod.initializeApp(firebaseConfig);
    auth=authMod.getAuth(app);
    db=fsMod.getFirestore(app);
    GoogleAuthProviderClass=authMod.GoogleAuthProvider;
    signInWithPopupFn=authMod.signInWithPopup;
    signInWithRedirectFn=authMod.signInWithRedirect;
    signOutFn=authMod.signOut;
    docFn=fsMod.doc;
    getDocFn=fsMod.getDoc;
    setDocFn=fsMod.setDoc;
    serverTimestampFn=fsMod.serverTimestamp;
    collectionFn=fsMod.collection;
    queryFn=fsMod.query;
    whereFn=fsMod.where;
    getDocsFn=fsMod.getDocs;
    onSnapshotFn=fsMod.onSnapshot;

    await authMod.setPersistence(auth,authMod.browserLocalPersistence);

    authMod.onAuthStateChanged(auth,async user=>{
      if(currentUser&&currentUser.uid!==user?.uid)await heartbeatPresence(false);
      currentUser=user;
      enforceThemeAccess();
      updateLoginUI();
      if(user)startPresence(); else stopPresence();
      if(activeScreen==="admin"&&!isAdmin())home();

      if(!user){
        setLoginStatus("Local save");
        if(activeScreen==="home")home();
        return;
      }

      setLoginStatus("Syncing…");
      try{
        const snap=await getDocFn(docFn(db,"users",user.uid));
        if(snap.exists()&&snap.data().progress){
          prog=mergeProgress(prog,snap.data().progress);
          normaliseProfileShowcase();
          resetSyncShadow();
        }
        await save();
        if(activeScreen==="home")home();
      }catch(error){
        console.error(error);
        setLoginStatus("Cloud sync failed",true);
      }
    });
  }catch(error){
    console.error(error);
    setLoginStatus("Firebase failed to load",true);
  }
}

function artifactIcon(name){
  let kind=artifactIconKind[name];
  if(!kind){
    const n=String(name||"").toLowerCase();
    if(/shield/.test(n))kind="shield";
    else if(/gauntlet|glove/.test(n))kind="gauntlet";
    else if(/hammer|mjolnir|gungnir|scepter|sceptre|staff|cane|spear/.test(n))kind="scepter";
    else if(/axe|stormbreaker/.test(n))kind="axe";
    else if(/sword|blade|necrosword|dragonfang/.test(n))kind="sword";
    else if(/bow|arrow|dart/.test(n))kind="arrow";
    else if(/stone|bloodstone|orb|sphere/.test(n))kind="orb";
    else if(/book|handbook|darkhold/.test(n))kind="book";
    else if(/ring|bangle/.test(n))kind="rings";
    else if(/suit|armour|armor|hulkbuster|iron man|war machine|iron patriot|rescue/.test(n))kind="armour";
    else if(/wing/.test(n))kind="drone";
    else if(/rifle|pistol|blaster|missile|weapon/.test(n))kind="blaster";
    else if(/glasses|visor/.test(n))kind="glasses";
    else if(/reactor|tunnel|loom|extractor|fabricator|laboratory|lab|collar|twister|charge|drive|pager|inhibitor/.test(n))kind="device";
    else if(/ship|fighter|flyer|helicarrier|milano|benatar|bowie|domo|van/.test(n))kind="drone";
    else if(/serum|dust|vial|particles|battery|batteries|disc/.test(n))kind="particles";
    else if(/cloak/.test(n))kind="cloak";
    else if(/necklace|beads/.test(n))kind="beads";
    else if(/web shooter|baton|tentacle/.test(n))kind="wrist";
    else if(/glider/.test(n))kind="drone";
    else if(/pumpkin bomb/.test(n))kind="orb";
    else kind="default";
  }
  return iconSvg(kind);
}

function isAdminArtifactName(name){
  return !!artifacts.find(item=>item.name===name)?.adminOnly;
}
function rarityForArtifact(name){
  return isAdminArtifactName(name)?"ADMIN":(artifactRarity[name]||"Common");

function artifactRarityRank(nameOrRarity){
  const rarity=artifacts.some(a=>a.name===nameOrRarity)?rarityForArtifact(nameOrRarity):String(nameOrRarity||"Common");
  if(rarity==="ADMIN")return 99;
  return Math.max(0,rarityOrder.indexOf(rarity));
}

function artifactPerks(name){
  if(isAdminArtifactName(name)){
    if(!isAdmin())return [];
    return ADMIN_ARTIFACT_PERKS[name]||[];
  }
  const rarity=rarityForArtifact(name);
  const pool=STANDARD_ARTIFACT_PERK_POOLS[rarity]||[];
  const count=STANDARD_ARTIFACT_PERK_COUNTS[rarity]||1;
  if(!pool.length)return [];
  const start=stringSeed(name)%pool.length;
  const chosen=[];
  for(let i=0;i<pool.length&&chosen.length<count;i++){
    const perk=pool[(start+i*3)%pool.length];
    if(!chosen.some(x=>x.id===perk.id))chosen.push(perk);
  }
  return chosen;
}
function artifactPerkSummary(name){
  const perks=artifactPerks(name);
  return perks.length?perks.map(p=>p.label).join(" · "):isAdminArtifactName(name)?"ADMIN perk inactive on non-admin accounts":"No active perk";
}
function artifactLoadoutSlotCount(){
  const level=lvl(prog.xp);
  return 3+(level>=100?1:0)+(level>=200?1:0);
}
function normaliseArtifactLoadout(){
  if(!Array.isArray(prog.artifactLoadout))prog.artifactLoadout=[];
  const owned=new Set((prog.inventory||[]).map(item=>item.name));
  prog.artifactLoadout=[...new Set(prog.artifactLoadout.filter(name=>owned.has(name)))].slice(0,artifactLoadoutSlotCount());
}
function artifactLoadoutEffects(){
  if(activeFriendChallenge)return {xpMultiplier:1,xpPct:0,doubleHeist:0,powerupBonus:0,heistCooldownReduction:0,eventChance:0,perfectBonus:0,gridShieldChance:0,modifierBonus:0};
  normaliseArtifactLoadout();
  const out={xpMultiplier:1,xpPct:0,doubleHeist:0,powerupBonus:0,heistCooldownReduction:0,eventChance:0,perfectBonus:0,gridShieldChance:0,modifierBonus:0};
  let strongestAdminXp=1;
  for(const name of prog.artifactLoadout){
    for(const perk of artifactPerks(name)){
      const e=perk.effects||{};
      out.xpPct+=Number(e.xpPct)||0;
      strongestAdminXp=Math.max(strongestAdminXp,Number(e.xpMult)||1);
      out.doubleHeist+=Number(e.doubleHeist)||0;
      out.powerupBonus+=Number(e.powerupBonus)||0;
      out.heistCooldownReduction+=Number(e.heistCooldownReduction)||0;
      out.eventChance+=Number(e.eventChance)||0;
      out.perfectBonus+=Number(e.perfectBonus)||0;
      out.gridShieldChance+=Number(e.gridShieldChance)||0;
      out.modifierBonus+=Number(e.modifierBonus)||0;
    }
  }
  out.xpPct=Math.min(out.xpPct,.50);
  out.xpMultiplier=strongestAdminXp*(1+out.xpPct);
  out.doubleHeist=Math.min(out.doubleHeist,.85);
  out.powerupBonus=Math.min(out.powerupBonus,.60);
  out.heistCooldownReduction=Math.min(out.heistCooldownReduction,.90);
  out.eventChance=Math.min(out.eventChance,.50);
  out.perfectBonus=Math.min(out.perfectBonus,1.50);
  out.gridShieldChance=Math.min(out.gridShieldChance,.60);
  out.modifierBonus=Math.min(out.modifierBonus,.75);
  return out;
}
function artifactEffectsText(){
  const e=artifactLoadoutEffects(),parts=[];
  if(e.xpMultiplier>1)parts.push(`×${e.xpMultiplier.toFixed(e.xpMultiplier>=2?1:2).replace(/\.0$/,"")} XP`);
  if(e.doubleHeist)parts.push(`+${Math.round(e.doubleHeist*100)}% double Heist`);
  if(e.powerupBonus)parts.push(`+${Math.round(e.powerupBonus*100)}% Power-Up`);
  if(e.heistCooldownReduction)parts.push(`-${Math.round(e.heistCooldownReduction*100)}% Heist cooldown`);
  if(e.eventChance)parts.push(`+${Math.round(e.eventChance*100)}% Mission Event`);
  if(e.perfectBonus)parts.push(`+${Math.round(e.perfectBonus*100)}% Perfect bonus`);
  if(e.gridShieldChance)parts.push(`+${Math.round(e.gridShieldChance*100)}% Grid protection`);
  return parts.join(" · ")||"No gameplay perks active";
}


function rarityWeightsForLevel(level){
  if(level<10){
    return {Common:82,Uncommon:18,Rare:0,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<25){
    return {Common:62,Uncommon:30,Rare:8,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<50){
    return {Common:45,Uncommon:34,Rare:16,Epic:5,Legendary:0,Mythic:0};
  }
  if(level<100){
    return {Common:34,Uncommon:31,Rare:22,Epic:10,Legendary:3,Mythic:0};
  }
  if(level<250){
    return {Common:24,Uncommon:28,Rare:26,Epic:16,Legendary:5,Mythic:1};
  }
  if(level<500){
    return {Common:18,Uncommon:24,Rare:28,Epic:20,Legendary:8,Mythic:2};
  }
  return {Common:14,Uncommon:20,Rare:28,Epic:23,Legendary:11,Mythic:4};
}

function chooseRarityForLevel(level,salt=0){
  const weights=rarityWeightsForLevel(level);
  const roll=seededUnit(prog.rewardSeed,level,salt)*100;
  let running=0;

  for(const rarity of rarityOrder){
    running+=weights[rarity]||0;
    if(roll<running)return rarity;
  }

  return "Common";
}

function expandCharacterNameForms(value){
  const raw=String(value||"").trim();
  if(!raw)return [];
  const forms=new Set([raw,raw.replace(/-/g," "),raw.replace(/\./g,"")]);
  if(/^doctor\s+/i.test(raw)){
    const rest=raw.replace(/^doctor\s+/i,"");
    forms.add(`Dr ${rest}`);forms.add(`Dr. ${rest}`);
  }
  if(/^dr\.?\s+/i.test(raw)){
    const rest=raw.replace(/^dr\.?\s+/i,"");
    forms.add(`Doctor ${rest}`);
  }
  if(/^captain\s+/i.test(raw)){
    const rest=raw.replace(/^captain\s+/i,"");
    forms.add(`Cap ${rest}`);
  }
  if(/^the\s+/i.test(raw))forms.add(raw.replace(/^the\s+/i,""));
  return [...forms].filter(Boolean);
}

function characterProfileByAnyName(target){
  if(!target)return null;
  if(typeof target==="object"&&target.name)return target;
  const needle=norm(target);
  const local=characters.find(c=>norm(c.name)===needle||(c.aliases||[]).some(a=>norm(a)===needle));
  if(local)return local;
  return (gridProfiles||[]).find(p=>norm(p.name)===needle||(p.aliases||[]).some(a=>norm(a)===needle))||null;
}

function characterAcceptedNames(target,pool=characters){
  const profile=characterProfileByAnyName(target);
  const canonical=profile?.name||String(target||"");
  const names=new Set();
  const add=value=>expandCharacterNameForms(value).forEach(v=>names.add(v));
  add(canonical);
  (profile?.aliases||[]).forEach(add);
  (CHARACTER_COMMON_NAMES[canonical]||[]).forEach(add);

  const remote=(completeMarvelRoster||[]).find(p=>norm(p.name)===norm(canonical));
  (remote?.aliases||[]).forEach(add);
  const grid=(gridProfiles||[]).find(p=>norm(p.name)===norm(canonical));
  (grid?.aliases||[]).forEach(add);

  const parts=canonical.replace(/[()]/g," ").trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2){
    for(const short of [parts[0],parts[parts.length-1]]){
      const matches=(pool||characters).filter(c=>{
        const p=String(c.name||"").replace(/[()]/g," ").trim().split(/\s+/).filter(Boolean);
        return p.some(x=>norm(x)===norm(short))||(c.aliases||[]).some(a=>norm(a)===norm(short));
      });
      if(matches.length===1)add(short);
    }
  }
  return [...names];
}

function characterAnswerAccepted(target,input,pool=characters){
  const answer=norm(input);
  return !!answer&&characterAcceptedNames(target,pool).some(name=>norm(name)===answer);
}

function totalXpForLevel(level){
  if(level<=1)return 0;
  return Math.round(100*Math.pow(level-1,2.15));
}

function lvl(xp){
  xp=Math.max(0,Number(xp)||0);

  // Estimate the level, then correct for rounding.
  let level=Math.max(1,Math.floor(Math.pow(xp/100,1/2.15))+1);

  while(totalXpForLevel(level+1)<=xp)level++;
  while(level>1&&totalXpForLevel(level)>xp)level--;

  return level;
}

let runtimeLastLevel=lvl(prog.xp);

function levelProgress(xp){
  const level=lvl(xp);
  const start=totalXpForLevel(level);
  const next=totalXpForLevel(level+1);
  const gained=Math.max(0,xp-start);
  const needed=Math.max(1,next-start);

  return {
    level,
    gained,
    needed,
    next,
    percent:Math.max(0,Math.min(100,(gained/needed)*100))
  };
}

function powerupKey(id,durationMin){
  return `${id}|${durationMin||0}`;
}

function mergePowerupInventory(localItems=[],cloudItems=[]){
  const merged=new Map();
  for(const item of [...cloudItems,...localItems]){
    if(!item||!item.id)continue;
    const key=powerupKey(item.id,item.durationMin);
    const existing=merged.get(key);
    if(!existing){
      merged.set(key,{id:item.id,durationMin:item.durationMin||0,qty:Math.max(1,item.qty||1)});
    }else{
      existing.qty=Math.max(existing.qty||1,item.qty||1);
    }
  }
  return [...merged.values()];
}

function mergeActivePowerups(localItems=[],cloudItems=[]){
  const merged=new Map();
  for(const item of [...cloudItems,...localItems]){
    if(!item||!item.id||!(item.remainingMs>0))continue;
    const existing=merged.get(item.id);
    if(!existing||item.remainingMs>existing.remainingMs){
      merged.set(item.id,{id:item.id,remainingMs:item.remainingMs});
    }
  }
  return [...merged.values()];
}
