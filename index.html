function dbLeadPrompt(type,subject,answer){
  const variants=DB_LEAD_PROMPTS[type]||["Which option matches the recovered evidence?"];
  return variants[stringSeed(`${subject.name}|${type}|${answer}|${Math.random()}`)%variants.length];
}

function dbLeadChallenge(subject,type){
  const allValues=key=>escapeCharacterFactPool(key);

  if(type==="aff"&&subject.aff?.length){
    const answer=rnd(subject.aff);
    return {
      type,label:"AFFILIATION DECRYPTION",
      q:dbLeadPrompt("aff",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("aff").filter(x=>!subject.aff.some(v=>norm(v)===norm(x)))).slice(0,3)]),
      evidence:`Affiliation confirmed: ${answer}`
    };
  }

  if(type==="species"&&subject.species){
    const answer=subject.species;
    return {
      type,label:"BIOMETRIC CLASSIFICATION",
      q:dbLeadPrompt("species",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("species").filter(x=>norm(x)!==norm(answer))).slice(0,3)]),
      evidence:`Classification confirmed: ${answer}`
    };
  }

  if(type==="power"&&subject.powers?.length){
    const answer=rnd(subject.powers);
    return {
      type,label:"CAPABILITY ANALYSIS",
      q:dbLeadPrompt("power",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("powers").filter(x=>!subject.powers.some(v=>norm(v)===norm(x)))).slice(0,3)]),
      evidence:`Capability confirmed: ${answer}`
    };
  }

  if(type==="loc"&&subject.loc?.length){
    const answer=rnd(subject.loc);
    return {
      type,label:"LOCATION LOCK",
      q:dbLeadPrompt("loc",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("loc").filter(x=>!subject.loc.some(v=>norm(v)===norm(x)))).slice(0,3)]),
      evidence:`Location trace confirmed: ${answer}`
    };
  }

  if(type==="gear"&&subject.gear?.length){
    const answer=rnd(subject.gear);
    return {
      type,label:"EQUIPMENT LOCK",
      q:dbLeadPrompt("gear",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("gear").filter(x=>!subject.gear.some(v=>norm(v)===norm(x)))).slice(0,3)]),
      evidence:`Equipment signature confirmed: ${answer}`
    };
  }

  if(type==="assoc"&&subject.assoc?.length){
    const answer=rnd(subject.assoc);
    return {
      type,label:"ASSOCIATE CROSS-REFERENCE",
      q:dbLeadPrompt("assoc",subject,answer),
      answer,
      options:sh([answer,...sh(allValues("assoc").filter(x=>!subject.assoc.some(v=>norm(v)===norm(x)))).slice(0,3)]),
      evidence:`Known associate confirmed: ${answer}`
    };
  }

  if(type==="year"){
    const answer=String(subject.year);
    const years=escapeDistinct(characters.map(c=>String(c.year))).filter(x=>x!==answer);
    return {
      type,label:"TIMELINE DECRYPTION",
      q:dbLeadPrompt("year",subject,answer),
      answer,
      options:sh([answer,...sh(years).slice(0,3)]),
      evidence:`First appearance year confirmed: ${answer}`
    };
  }

  return null;
}

function buildDbLeads(subject){
  const available=sh(["aff","species","power","loc","gear","assoc","year"]);
  const leads=[];

  for(const type of available){
    const lead=dbLeadChallenge(subject,type);
    if(lead&&lead.options?.length>=4)leads.push(lead);
    if(leads.length===3)break;
  }

  if(leads.length<3){
    throw new Error("Unable to assemble enough evidence-decryption stages.");
  }

  return leads;
}

function buildValidatedDbPuzzle(seed,bias=0){
  return withPuzzleSeed(seed,()=>{
    const subject=rnd(identityCharacterPool("agent",bias));
    const leads=buildDbLeads(subject);
    const passiveEvidence=[
      `A recovered file lists ${rnd(subject.assoc||["an unknown contact"])} as a known associate.`,
      `The investigation references ${rnd(subject.loc||["an unknown location"])}.`,
      subject.gear?.length?`Equipment analysis also mentions ${rnd(subject.gear)}.`:`No signature equipment appears in the recovered manifest.`
    ];
    const validation=validateDbPuzzleData(subject,leads);
    return {subject,leads,passiveEvidence,validation};
  });
}

function dbVerificationChecks(subject,suspect){
  const checks=[
    {
      label:"CLASSIFICATION",
      recovered:subject.species,
      selected:suspect.species,
      match:norm(subject.species)===norm(suspect.species)
    },
    {
      label:"FIRST APPEARANCE YEAR",
      recovered:String(subject.year),
      selected:String(suspect.year),
      match:Number(subject.year)===Number(suspect.year)
    }
  ];

  if(subject.aff?.length){
    const value=rnd(subject.aff);
    checks.push({
      label:"AFFILIATION",
      recovered:value,
      selected:suspect.aff?.join(", ")||"None",
      match:!!suspect.aff?.some(x=>norm(x)===norm(value))
    });
  }

  if(subject.loc?.length){
    const value=rnd(subject.loc);
    checks.push({
      label:"LOCATION",
      recovered:value,
      selected:suspect.loc?.join(", ")||"None",
      match:!!suspect.loc?.some(x=>norm(x)===norm(value))
    });
  }

  if(subject.powers?.length){
    const value=rnd(subject.powers);
    checks.push({
      label:"CAPABILITY",
      recovered:value,
      selected:suspect.powers?.join(", ")||"None",
      match:!!suspect.powers?.some(x=>norm(x)===norm(value))
    });
  }

  // For a wrong suspect, prefer a mismatch so the verification stage can
  // actually catch the bad shortlist instead of randomly approving it.
  if(suspect.name!==subject.name){
    const mismatches=sh(checks.filter(x=>!x.match));
    const matches=sh(checks.filter(x=>x.match));
    return [...mismatches,...matches].slice(0,2);
  }

  return sh(checks.filter(x=>x.match)).slice(0,2);
}

function dbGame(replayId=null){
  activeScreen="database";
  prog.games++;
  save();

  let meta=resolvePuzzle("DB",typeof replayId==="string"?replayId:null),seed=meta.seed,generated=null;
  const recentNames=new Set(prog.recent||[]);
  for(let tries=0;tries<50;tries++){
    try{generated=buildValidatedDbPuzzle(seed,typeof replayId==="string"?0:adaptiveQuestionBias("database"))}catch(error){console.warn("Database seed rejected",seed,error);generated=null}
    if(generated?.validation?.ok&&(typeof replayId==="string"||!recentNames.has(generated.subject.name)||tries>35))break;
    if(typeof replayId==="string")break;
    seed=((seed+1)>>>0)||1;
  }
  if(!generated?.validation?.ok){
    screen.innerHTML=`<section class="mission"><p class="eyebrow">CLASSIFIED DATABASE</p><h1>Case generation failed.</h1><p>No fully validated case could be assembled for this Puzzle ID.</p><button class="btn" id="dbFailHome">Terminal</button></section>`;
    document.getElementById("dbFailHome").onclick=home;return;
  }
  const {subject,leads,passiveEvidence}=generated;
  setCurrentPuzzle("DB",seed);
  const startedAt=Date.now();

  let stage=1;
  let leadIndex=0;
  let unlockedEvidence=[];
  let mistakes=0;
  let query="";
  let selectedName="";
  let verification=[];
  let verificationIndex=0;

  function filtered(){
    if(!query)return characters;
    const n=norm(query);
    return characters.filter(c=>
      norm([
        c.name,...(c.aliases||[]),...(c.aff||[]),...(c.powers||[]),...(c.gear||[]),
        ...(c.assoc||[]),...(c.loc||[]),c.species,c.year
      ].join(" ")).includes(n)
    );
  }

  function stageHeader(){
    const names={
      1:"Evidence Decryption I",
      2:"Evidence Decryption II",
      3:"Evidence Decryption III",
      4:"Database Shortlist",
      5:"Field Verification",
      6:"Final Authorization"
    };
    return names[stage]||"Active Case";
  }

  function evidenceHtml(){
    const all=[...unlockedEvidence,...passiveEvidence.slice(0,stage>=4?2:0)];
    if(!all.length)return `<div class="notice">No evidence packets unlocked yet.</div>`;
    return `<div class="evidence">${all.map((x,i)=>`<div><span>EVIDENCE ${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div>`;
  }

  async function closeCase(){
    const base=Math.max(90,180-mistakes*15);
    const gain=awardXp(base,"database");
    prog.xp+=gain;
    prog.cases++;
    prog.recent=[...prog.recent,subject.name].slice(-12);
    recordGameResult("database",{xp:gain,durationMs:Date.now()-startedAt,errors:mistakes,score:Math.max(0,6-mistakes)});
    rollPostGamePowerup("database");
    await save();

    screen.innerHTML=`<section class="mission">
      <div class="row" style="justify-content:flex-end">${puzzleIdInline()}</div><p class="eyebrow">CASE CLOSED</p>
      <h1>${esc(subject.name)} identified.</h1>
      <p>Six-stage investigation completed · ${mistakes} error${mistakes===1?"":"s"}.</p>
      <div class="reward">+${gain} XP</div>
      <div class="row">
        <button class="btn primary" id="dbNew">Generate new case</button>
        <button class="btn" id="dbHome">Terminal</button>
      </div>
    </section>`;

    document.getElementById("dbNew").onclick=()=>dbGame();
    document.getElementById("dbHome").onclick=home;
  }

  function render(msg=""){
    if(stage<=3){
      const lead=leads[leadIndex];
      screen.innerHTML=`<div class="missionhead">
        <button class="back" id="dbBack">← Terminal</button>
        <div>
          <p class="eyebrow">CLASSIFIED DATABASE · STEP ${stage}/6</p>
          <h1>${esc(stageHeader())}</h1>
        </div>
        <div><div class="reward">${mistakes} ERROR${mistakes===1?"":"S"}</div>${puzzleIdInline()}</div>
      </div>
      <section class="casegrid">
        <aside class="case">
          <p class="eyebrow">ACTIVE INVESTIGATION</p>
          <h2>Build the unknown subject profile.</h2>
          <p>Decrypt three independent evidence packets before database access is authorised.</p>
          ${evidenceHtml()}
        </aside>
        <section class="db">
          <div class="notice"><strong>${esc(lead.label)}</strong></div>
          <h2>${esc(lead.q)}</h2>
          <div class="choices">
            ${lead.options.map(option=>`<button class="choice" data-db-lead="${esc(option)}">${esc(option)}</button>`).join("")}
          </div>
          <p class="feedback" id="dbFeedback">${esc(msg)}</p>
        </section>
      </section>`;

      document.getElementById("dbBack").onclick=home;
      document.querySelectorAll("[data-db-lead]").forEach(button=>{
        button.onclick=()=>{
          if(norm(button.dataset.dbLead)===norm(lead.answer)){
            unlockedEvidence.push(lead.evidence);
            leadIndex++;
            if(leadIndex>=leads.length)stage=4;
            else stage=leadIndex+1;
            render("EVIDENCE PACKET DECRYPTED");
          }else{
            mistakes++;
            document.getElementById("dbFeedback").textContent="DECRYPTION REJECTED. Re-check the packet.";
          }
        };
      });
      return;
    }

    if(stage===4){
      const results=filtered();
      screen.innerHTML=`<div class="missionhead">
        <button class="back" id="dbBack">← Terminal</button>
        <div><p class="eyebrow">CLASSIFIED DATABASE · STEP 4/6</p><h1>Database Shortlist</h1></div>
        <div><div class="reward">${results.length} MATCHING FILE${results.length===1?"":"S"}</div>${puzzleIdInline()}</div>
      </div>
      <section class="casegrid">
        <aside class="case">
          <p class="eyebrow">RECOVERED PROFILE</p>
          <h2>Select a suspect.</h2>
          <p>Use all decrypted evidence, then mark one personnel file for field verification.</p>
          ${evidenceHtml()}
        </aside>
        <section class="db">
          <form class="search" id="dbSearch">
            <input id="dbSearchInput" placeholder="Search name, alias, power, team, location…" value="${esc(query)}">
            <button class="btn">Search</button>
          </form>
          <div class="results">
            ${results.map(c=>`<button class="person ${selectedName===c.name?"sel":""}" data-db-person="${esc(c.name)}">
              <strong>${esc(c.name)}</strong>
              <small>${esc(c.aliases?.[0]||"")}</small>
              <p>${esc(c.species)} · ${esc((c.aff||[]).join(", "))}<br>${esc((c.powers||[]).slice(0,2).join(", "))}</p>
            </button>`).join("")}
          </div>
          <div class="row">
            <button class="btn primary" id="dbVerify" ${selectedName?"":"disabled"}>Send selected file to verification</button>
          </div>
          <p class="feedback" id="dbFeedback">${esc(msg)}</p>
        </section>
      </section>`;

      document.getElementById("dbBack").onclick=home;
      document.getElementById("dbSearch").onsubmit=e=>{
        e.preventDefault();
        query=document.getElementById("dbSearchInput").value;
        render();
      };
      document.querySelectorAll("[data-db-person]").forEach(button=>{
        button.onclick=()=>{
          selectedName=button.dataset.dbPerson;
          render();
        };
      });
      document.getElementById("dbVerify").onclick=()=>{
        const suspect=characters.find(c=>c.name===selectedName);
        verification=withPuzzleSeed((seed^stringSeed(suspect.name))>>>0,()=>dbVerificationChecks(subject,suspect));
        verificationIndex=0;
        stage=5;
        render();
      };
      return;
    }

    if(stage===5){
      const suspect=characters.find(c=>c.name===selectedName);
      const check=verification[verificationIndex];

      screen.innerHTML=`<div class="missionhead">
        <button class="back" id="dbBack">← Terminal</button>
        <div><p class="eyebrow">CLASSIFIED DATABASE · STEP 5/6</p><h1>Field Verification</h1></div>
        <div><div class="reward">CHECK ${verificationIndex+1}/${verification.length}</div>${puzzleIdInline()}</div>
      </div>
      <section class="mission">
        <div class="notice">Compare the recovered signal with the selected suspect file.</div>
        <div class="clues">
          <div class="clue"><span>${esc(check.label)} · RECOVERED</span><div>${esc(check.recovered)}</div></div>
          <div class="clue"><span>${esc(check.label)} · ${esc(suspect.name.toUpperCase())}</span><div>${esc(check.selected)}</div></div>
        </div>
        <h2>Do these records match?</h2>
        <div class="choices">
          <button class="choice" data-db-verify="match">MATCH</button>
          <button class="choice" data-db-verify="mismatch">MISMATCH</button>
        </div>
        <p class="feedback" id="dbFeedback">${esc(msg)}</p>
      </section>`;

      document.getElementById("dbBack").onclick=home;
      document.querySelectorAll("[data-db-verify]").forEach(button=>{
        button.onclick=()=>{
          const answer=button.dataset.dbVerify==="match";
          if(answer!==check.match){
            mistakes++;
            document.getElementById("dbFeedback").textContent="VERIFICATION RESPONSE INCORRECT. Compare the two records again.";
            return;
          }

          if(!check.match){
            selectedName="";
            verification=[];
            verificationIndex=0;
            stage=4;
            render("MISMATCH CONFIRMED · suspect removed from shortlist.");
            return;
          }

          verificationIndex++;
          if(verificationIndex>=verification.length){
            stage=6;
            render("FIELD VERIFICATION PASSED");
          }else{
            render("CHECK PASSED");
          }
        };
      });
      return;
    }

    if(stage===6){
      const suspect=characters.find(c=>c.name===selectedName);

      screen.innerHTML=`<div class="missionhead">
        <button class="back" id="dbBack">← Terminal</button>
        <div><p class="eyebrow">CLASSIFIED DATABASE · STEP 6/6</p><h1>Final Authorization</h1></div><div>${puzzleIdInline()}</div>
      </div>
      <section class="mission">
        <div class="notice">All preliminary checks passed. Authorise the selected identity to close the case.</div>
        <div class="clue">
          <span>SELECTED SUBJECT</span>
          <div><strong>${esc(suspect.name)}</strong><br>${esc(suspect.species)} · ${esc((suspect.aff||[]).join(", "))}</div>
        </div>
        <div class="row">
          <button class="btn primary" id="dbAuthorize">AUTHORISE IDENTITY</button>
          <button class="btn" id="dbReturn">Return to database</button>
        </div>
        <p class="feedback" id="dbFeedback">${esc(msg)}</p>
      </section>`;

      document.getElementById("dbBack").onclick=home;
      document.getElementById("dbReturn").onclick=()=>{
        stage=4;
        selectedName="";
        verification=[];
        verificationIndex=0;
        render("Final authorization cancelled.");
      };
      document.getElementById("dbAuthorize").onclick=()=>{
        if(suspect.name===subject.name){
          closeCase();
        }else{
          mistakes++;
          stage=4;
          selectedName="";
          verification=[];
          verificationIndex=0;
          render("IDENTITY REJECTED AT FINAL AUTHORIZATION · return to the database.");
        }
      };
    }
  }

  render();
}


function installEasterEggs(){
  if(window.__marvelArcadeEggs)return;
  window.__marvelArcadeEggs=true;

  function eggMessage(message){
    const old=document.querySelector(".egg-toast");
    if(old)old.remove();

    const node=document.createElement("div");
    node.className="egg-toast";
    node.textContent=message;
    document.body.appendChild(node);

    const flash=document.getElementById("eggFlash");
    if(flash){
      flash.classList.remove("show");
      void flash.offsetWidth;
      flash.classList.add("show");
    }

    setTimeout(()=>node.remove(),2600);
  }

  // Easter egg 1: seven rapid taps on the S.H.I.E.L.D. mark.
  let shieldTaps=0,shieldTimer=0;
  document.getElementById("shieldMark")?.addEventListener("click",()=>{
    clearTimeout(shieldTimer);
    shieldTaps++;
    shieldTimer=setTimeout(()=>shieldTaps=0,1800);
    if(shieldTaps>=7){
      shieldTaps=0;
      eggMessage("LEVEL 7 CLEARANCE ACKNOWLEDGED · DIRECTOR CHANNEL OPEN");
    }
  });

  // Easter egg 2: tap the Marvel Grid's "06" six times.
  let gridTaps=0,gridTimer=0;
  document.addEventListener("click",event=>{
    if(!event.target.closest('[data-g="grid"] .num'))return;
    clearTimeout(gridTimer);
    gridTaps++;
    gridTimer=setTimeout(()=>gridTaps=0,1700);
    if(gridTaps>=6){
      gridTaps=0;
      eggMessage("EARTH-616 SIGNAL FOUND · GRID COORDINATES VERIFIED");
    }
  });

  // Easter egg 3: the tiny signal node in the welcome panel.
  let signalTaps=0;
  document.addEventListener("click",event=>{
    if(!event.target.closest("#ambientSignal"))return;
    signalTaps++;
    if(signalTaps>=3){
      signalTaps=0;
      eggMessage("PROJECT PEGASUS · ENERGY SIGNATURE DETECTED");
    }
  });

  // Easter egg 4: triple-tap the fan-project footer.
  let footerTaps=0,footerTimer=0;
  document.getElementById("arcadeFooter")?.addEventListener("click",()=>{
    clearTimeout(footerTimer);
    footerTaps++;
    footerTimer=setTimeout(()=>footerTaps=0,1600);
    if(footerTaps>=3){
      footerTaps=0;
      eggMessage("ARCHIVE NOTE · SOME FILES WERE NEVER MEANT TO BE EASY TO FIND");
    }
  });

  // Easter egg 5: Inventory → Achievements → Rules.
  let routeSequence=[];
  document.addEventListener("click",event=>{
    let code="";
    if(event.target.closest("#inventoryBtn"))code="I";
    else if(event.target.closest("#achievementsBtn"))code="A";
    else if(event.target.closest("#rulesBtn"))code="R";
    if(!code)return;

    routeSequence=[...routeSequence,code].slice(-3);
    if(routeSequence.join("")==="IAR"){
      routeSequence=[];
      eggMessage("ARCHIVE ROUTE I-A-R · HIDDEN INDEX CHECKSUM PASSED");
    }
  });

  // Easter egg 6: Heist → Six Degrees → Heist.
  let gameSequence=[];
  document.addEventListener("click",event=>{
    const card=event.target.closest(".game");
    if(!card)return;

    const key=card.dataset.g;
    if(!["heist","six"].includes(key)){
      gameSequence=[];
      return;
    }

    gameSequence=[...gameSequence,key].slice(-3);
    if(gameSequence.join(",")==="heist,six,heist"){
      gameSequence=[];
      eggMessage("TIMELINE LOOP DETECTED · NO ACTION REQUIRED");
    }
  });
}

function installInterfaceEffects(){
  if(window.__shieldInterfaceEffects)return;
  window.__shieldInterfaceEffects=true;

  const selector=".game,.btn,.choice,.difficulty,.person,.suggestion,.grid-cell,.back,.support-user";

  document.addEventListener("pointerdown",event=>{
    const target=event.target.closest(selector);
    if(!target||target.disabled)return;

    if(target.classList.contains("game"))target.classList.add("launching");

    const rect=target.getBoundingClientRect();
    const ripple=document.createElement("span");
    ripple.className="ui-ripple";
    ripple.style.left=`${event.clientX-rect.left}px`;
    ripple.style.top=`${event.clientY-rect.top}px`;
    target.appendChild(ripple);
    setTimeout(()=>ripple.remove(),520);
  });

  document.addEventListener("pointerup",event=>{
    const target=event.target.closest(".game");
    if(target)setTimeout(()=>target.classList.remove("launching"),180);
  });

  const animateScreen=()=>{
    [...screen.children].forEach((node,index)=>{
      node.classList.remove("screen-enter");
      node.style.animationDelay=`${Math.min(index*28,90)}ms`;
      void node.offsetWidth;
      node.classList.add("screen-enter");
    });
  };

  new MutationObserver(()=>requestAnimationFrame(animateScreen))
    .observe(screen,{childList:true});

  animateScreen();
}
